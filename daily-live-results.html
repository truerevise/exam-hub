<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/daily-live-results.html">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Live Test Result · True Revise</title>
<style>
:root{--bg:#090b10;--card:#171b23;--card2:#20252f;--line:#303846;--text:#f7f8fb;--muted:#aab2bf;--blue:#3267ff;--green:#1dcc72;--red:#ef4444;--gray:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 24px));margin:auto;padding:18px 0 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.top a{color:#a9bbff;text-decoration:none;font-size:13px;font-weight:800}.brand{font-size:12px;color:var(--muted);font-weight:800}.card{background:linear-gradient(145deg,#171b23,#12161d);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.hero{text-align:center;padding:24px 18px}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#123725;color:#74e3aa;font-size:10px;font-weight:900}.hero h1{font-size:24px;line-height:1.25;margin:14px 0 7px}.meta{color:var(--muted);font-size:13px;line-height:1.5}.rank{margin-top:8px;color:#9eb7ff;font-weight:800}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card2);border-radius:14px;padding:16px;text-align:center}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:27px;margin-top:6px}.correct{border-top:3px solid var(--green)}.wrong{border-top:3px solid var(--red)}.skip{border-top:3px solid var(--gray)}.score{border-top:3px solid var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 16px;border-radius:11px;text-decoration:none;font-weight:900;font-size:13px;background:var(--blue);color:#fff}.btn.secondary{background:var(--card2);border:1px solid var(--line)}.expired{border-color:#55431f;background:#211b11}.expired h2{margin:0 0 6px;color:#f7c85b;font-size:18px}.expired p{margin:0;color:#c8b98e;font-size:13px;line-height:1.5}.error{text-align:center;padding:30px}.error h2{margin-top:0}.hidden{display:none!important}@media(max-width:520px){.wrap{width:calc(100% - 18px);padding-top:12px}.card{padding:15px;border-radius:16px}.hero{padding:20px 14px}.hero h1{font-size:21px}.stats{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.btn{width:100%}}
</style></head><body><main class="wrap"><div class="top"><a href="live-tests.html">← Live Tests</a><div class="brand">TRUE REVISE</div></div><div id="app"><div class="card hero"><span class="badge">DAILY LIVE TEST</span><h1>Loading your result…</h1><p class="meta">Please wait.</p></div></div></main>
<script type="module">
import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,getDoc,doc,query,where}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),resultId=p.get('resultId'),liveTestId=p.get('liveTestId');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const ms=v=>v?.toDate?v.toDate().getTime():v?.seconds?v.seconds*1000:new Date(v||0).getTime();
const pct=r=>Number(r.totalQuestions||0)>0?Math.round(Number(r.score||0)/Number(r.totalQuestions||0)*100):0;
function today(t){const d=new Date(t),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}
function renderExpired(title='This Daily Live Test is expired.'){ $('app').innerHTML=`<div class="card expired"><h2>Test expired</h2><p>${esc(title)} Results from previous Daily Live Tests are not available on this page, and their solutions cannot be opened.</p></div><div class="actions"><a class="btn secondary" href="live-tests.html">Back to Live Tests</a></div>` }
function render(r){const score=Number(r.score||0),total=Number(r.totalQuestions||0),pc=pct(r);$('app').innerHTML=`<section class="card hero"><span class="badge">✓ SUBMITTED TODAY</span><h1>${esc(r.title||'Daily Live Test')}</h1><p class="meta">${esc(r.exam||'')} ${r.subject?'· '+esc(r.subject):''}</p>${r.attemptNo?`<div class="rank">Attempt ${r.attemptNo}</div>`:''}</section><section class="card"><div class="stats"><div class="stat score"><span>Marks</span><b>${score} / ${total}</b></div><div class="stat"><span>Percentage</span><b>${pc}%</b></div><div class="stat correct"><span>Correct Answers</span><b>${Number(r.correctCount||0)}</b></div><div class="stat wrong"><span>Wrong Answers</span><b>${Number(r.wrongCount||0)}</b></div><div class="stat skip"><span>Not Attempted</span><b>${Number(r.notAttemptedCount||0)}</b></div></div><div class="actions"><a class="btn" href="review.html?id=${encodeURIComponent(r.id)}">📖 View Solutions</a><a class="btn secondary" href="live-tests.html">Live Tests</a></div></section><section class="card expired"><h2>Previous Daily Live Tests</h2><p>Previous Daily Live Tests are treated as expired here. Their solutions are not available from this result page.</p></section>`}
async function load(u){try{if(!liveTestId&&!resultId)throw Error('No Daily Live Test result was selected.');let r=null;if(resultId){const s=await getDoc(doc(db,'results',resultId));if(!s.exists()||s.data().uid!==u.uid)throw Error('Result not found.');r={id:s.id,...s.data()}}else{const snap=await getDocs(query(collection(db,'results'),where('uid','==',u.uid)));const a=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.liveTestId===liveTestId&&x.isDailyLive);a.sort((x,y)=>ms(y.submittedAt)-ms(x.submittedAt));r=a[0]||null}if(!r||!r.isDailyLive||!r.liveTestId)throw Error('Daily Live Test result not found.');if(!today(ms(r.submittedAt))){renderExpired();return}render(r)}catch(e){$('app').innerHTML=`<div class="card error"><h2>Result unavailable</h2><p class="meta">${esc(e.message||'Unable to load your Daily Live Test result.')}</p><div class="actions" style="justify-content:center"><a class="btn secondary" href="live-tests.html">Back to Live Tests</a></div></div>`}}
onAuthStateChanged(auth,u=>{if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}load(u)});
</script></body></html>
