<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#090b10">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Today's Live Test Result · True Revise</title>
<style>
:root{--bg:#090b10;--panel:#12161e;--panel2:#1b202a;--line:#2d3543;--text:#f7f8fb;--muted:#aab3c2;--blue:#3267ff;--green:#20d47a;--red:#ef4b55;--gray:#9aa7b8;--gold:#f4c95d}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(circle at 50% -10%,#17213b 0,#090b10 38%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit}
.page{width:min(760px,calc(100% - 28px));margin:0 auto;padding:18px 0 calc(36px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:7px;color:#b8c6ff;text-decoration:none;font-size:13px;font-weight:800;padding:9px 0}
.brand{font-size:11px;letter-spacing:.12em;color:#7f8a9b;font-weight:900}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#16264d,#101721 72%);border:1px solid #30466f;border-radius:20px;padding:25px 22px;text-align:center;box-shadow:0 16px 40px #0005}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-90px;top:-105px;background:#315cff20}
.badge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#123a29;border:1px solid #236b49;color:#7bf0ad;font-size:10px;font-weight:900;letter-spacing:.04em}
.hero h1{position:relative;z-index:1;font-size:25px;line-height:1.25;margin:14px auto 7px;max-width:620px}
.meta{position:relative;z-index:1;margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.attempt{position:relative;z-index:1;margin-top:9px;color:#b9c8ff;font-size:12px;font-weight:800}
.card{background:linear-gradient(145deg,#171c25,#11151c);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.section-title{font-size:14px;font-weight:900;margin:0 0 13px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid #252d39;border-radius:15px;padding:16px 12px;text-align:center;min-width:0}
.stat span{display:block;color:var(--muted);font-size:12px;font-weight:700}
.stat b{display:block;margin-top:6px;font-size:27px;line-height:1.1}
.stat.score{border-top:3px solid var(--blue)}
.stat.correct{border-top:3px solid var(--green)}
.stat.wrong{border-top:3px solid var(--red)}
.stat.skip{border-top:3px solid var(--gray)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 15px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:900;border:1px solid transparent;background:var(--blue);color:#fff;box-shadow:0 8px 18px #3267ff25}
.btn.secondary{background:#222935;border-color:#3a4555;box-shadow:none}
.note{display:flex;gap:11px;align-items:flex-start;background:#1e1b12;border:1px solid #5c4b24;border-radius:14px;padding:14px;color:#d8c78e;font-size:12px;line-height:1.55}
.note strong{display:block;color:#f5d36d;margin-bottom:2px}
.note-icon{font-size:18px;line-height:1}
.expired{background:#171a20;border-color:#514728}
.expired h2{margin:0 0 7px;font-size:18px;color:var(--gold)}
.expired p{margin:0;color:#c5b98e;font-size:13px;line-height:1.6}
.error{text-align:center;padding:30px 20px}
.error h2{margin:0 0 8px;font-size:20px}
.error .actions{grid-template-columns:1fr}
.footer{text-align:center;color:#667184;font-size:11px;margin-top:18px}
.hidden{display:none!important}
@media(max-width:560px){.page{width:calc(100% - 18px);padding-top:10px}.header{margin-bottom:10px}.brand{font-size:10px}.hero{padding:22px 15px;border-radius:18px}.hero h1{font-size:21px}.card{padding:15px;border-radius:16px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px 9px}.stat b{font-size:24px}.actions{grid-template-columns:1fr}.btn{width:100%}}
@media(max-width:360px){.stats{grid-template-columns:1fr}.hero h1{font-size:20px}}
</style>
</head>
<body>
<main class="page">
<header class="header">
<a class="back" href="live-tests.html">← <span>Live Tests</span></a>
<div class="brand">TRUE REVISE</div>
</header>
<div id="app">
<section class="hero"><span class="badge">⚡ DAILY LIVE TEST</span><h1>Loading your result…</h1><p class="meta">Please wait while we securely load your submission.</p></section>
</div>
<div class="footer">Today's Live Test result · True Revise</div>
</main>
<script type="module">
import{auth,db}from'./firebase-config.js';
import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
import{collection,getDocs,getDoc,doc,query,where}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),resultId=p.get('resultId'),liveTestId=p.get('liveTestId');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const ms=v=>v?.toDate?v.toDate().getTime():v?.seconds?v.seconds*1000:new Date(v||0).getTime();
const pct=r=>Number(r.totalQuestions||0)>0?Math.round(Number(r.score||0)/Number(r.totalQuestions||0)*100):0;
const isToday=t=>{const d=new Date(t),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()};
function renderExpired(){
 $('app').innerHTML=`<section class="card expired"><h2>Live Test expired</h2><p>This result belongs to a previous Daily Live Test. Previous daily tests are not available from this page, and their detailed solutions cannot be opened.</p></section><div class="actions"><a class="btn secondary" href="live-tests.html">Back to Live Tests</a></div>`;
}
function render(r){
 const score=Number(r.score||0),total=Number(r.totalQuestions||0),pc=pct(r);
 $('app').innerHTML=`<section class="hero"><span class="badge">✓ SUBMITTED TODAY</span><h1>${esc(r.title||'Daily Live Test')}</h1><p class="meta">${esc(r.exam||'')}${r.subject?' · '+esc(r.subject):''}</p>${r.attemptNo?`<div class="attempt">Attempt ${esc(r.attemptNo)}</div>`:''}</section>
 <section class="card"><h2 class="section-title">Your Performance</h2><div class="stats"><div class="stat score"><span>Marks</span><b>${score} / ${total}</b></div><div class="stat"><span>Percentage</span><b>${pc}%</b></div><div class="stat correct"><span>Correct Answers</span><b>${Number(r.correctCount||0)}</b></div><div class="stat wrong"><span>Wrong Answers</span><b>${Number(r.wrongCount||0)}</b></div><div class="stat skip"><span>Not Attempted</span><b>${Number(r.notAttemptedCount||0)}</b></div></div>
 <div class="actions"><a class="btn" href="review.html?id=${encodeURIComponent(r.id)}">📖 View Solutions</a><a class="btn secondary" href="live-tests.html">⚡ Live Tests</a></div></section>
 <section class="card"><div class="note"><span class="note-icon">🔒</span><div><strong>Today's result only</strong>This page is dedicated to your submitted Daily Live Test. Previous Daily Live Tests are treated as expired and their solutions are unavailable.</div></div></section>`;
}
async function load(u){
 try{
  if(!liveTestId&&!resultId)throw Error('No Daily Live Test result was selected.');
  let r=null;
  if(resultId){const s=await getDoc(doc(db,'results',resultId));if(!s.exists()||s.data().uid!==u.uid)throw Error('Result not found.');r={id:s.id,...s.data()}}
  else{const snap=await getDocs(query(collection(db,'results'),where('uid','==',u.uid)));const a=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.liveTestId===liveTestId&&x.isDailyLive);a.sort((x,y)=>ms(y.submittedAt)-ms(x.submittedAt));r=a[0]||null}
  if(!r||!r.isDailyLive||!r.liveTestId)throw Error('Daily Live Test result not found.');
  if(!isToday(ms(r.submittedAt))){renderExpired();return}
  render(r);
 }catch(e){$('app').innerHTML=`<section class="card error"><h2>Result unavailable</h2><p class="meta">${esc(e.message||'Unable to load your Daily Live Test result.')}</p><div class="actions"><a class="btn secondary" href="live-tests.html">Back to Live Tests</a></div></section>`}
}
onAuthStateChanged(auth,u=>{if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}load(u)});
</script>
</body>
</html>
