<!doctype html>
<html lang="en">
<head>
<!-- TrueRevise Private Page -->
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<title>Review | True Revise</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#202326;--panel:#292c31;--panel2:#30343a;--line:#3b4048;--text:#f5f7fb;--muted:#aeb6c2;--green:#20d47a;--red:#ef4b55;--blue:#4b8dff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}body{padding-bottom:82px}.header{position:sticky;top:0;z-index:20;background:#2a2d31;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-right{display:flex;align-items:center;gap:9px}.counter{color:#d4dae4;font-size:13px;font-weight:800}.menu,.back{background:transparent;border:0;color:#fff;text-decoration:none;cursor:pointer;font-size:26px}.wrap{max-width:900px;margin:auto;padding:10px 14px}.summary{background:#25282d;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.summary h2{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:12px;line-height:1.55}.modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#25282d;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}.mode-text b{display:block;font-size:13px}.mode-text span{color:var(--muted);font-size:11px}.switch{position:relative;width:52px;height:30px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:999px;background:#39434b;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#aab3bf;transition:.2s}.switch input:checked+.slider{background:#1f4650}.switch input:checked+.slider:before{transform:translateX(22px);background:#4b8dff}.question-card{background:#2a2d31;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.qtop{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin-bottom:12px}.qnum{background:#aeb7c2;color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;flex:0 0 auto}.question{font-size:18px;line-height:1.5;font-weight:800;margin-bottom:15px}.option{width:100%;background:#303338;border:2px solid transparent;border-radius:7px;padding:14px 16px;margin:9px 0;color:#f1f3f7;text-align:left;display:flex;align-items:center;gap:10px;font:inherit;line-height:1.45;cursor:pointer}.option:hover{border-color:#56606d}.option:disabled{cursor:default}.option .letter{color:#aeb6c2;font-weight:800;min-width:26px}.option.correct{background:#395a43;border-color:#5fba73}.option.wrong{background:#65494c;border-color:#ef625f}.mark{margin-left:auto;font-size:22px;font-weight:900}.result-line{margin-top:14px;font-size:16px;font-weight:800}.result-line.correct{color:#d9ffe7}.result-line.wrong{color:#ffb7b7}.answer-line{margin-top:6px;font-size:14px;color:#d7dde6}.solution-wrap{margin-top:14px}.solution-btn{width:100%;padding:12px;border:1px solid #4b8dff;border-radius:8px;background:transparent;color:#5d9aff;font-weight:900;cursor:pointer}.explanation{display:none;margin-top:10px;background:#25282d;border-radius:8px;padding:13px;color:#e3e7ed;line-height:1.65;font-size:14px}.explanation.show{display:block}.locked{background:#332514;border:1px solid #6b4b1e;color:#fbbf24;padding:14px;border-radius:10px;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#292c31;border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:9px}.nav button{flex:1;min-height:50px;border:0;border-radius:50%;background:#4b8dff;color:#fff;font-size:25px;font-weight:800;cursor:pointer}.nav button:disabled{opacity:.35}.drawer{display:none;position:fixed;inset:0;z-index:50}.drawer.show{display:block}.scrim{position:absolute;inset:0;background:#0009}.side{position:absolute;right:0;top:0;bottom:0;width:min(390px,88vw);background:#282b30;padding:17px;overflow:auto}.side-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #41464f;padding-bottom:12px}.close{background:transparent;color:#fff;border:0;font-size:28px;cursor:pointer}.legend{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0;color:#cbd5e1;font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:21px;height:21px;border-radius:50%;border:2px solid #9aa5b5;display:inline-block}.dot.correct{background:var(--green);border-color:var(--green)}.dot.wrong{background:var(--red);border-color:var(--red)}.dot.pending{background:#30343a}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.palette button{aspect-ratio:1;border-radius:50%;background:#30343a;border:2px solid #9aa5b5;color:#fff;font-weight:800;cursor:pointer}.palette button.correct{background:var(--green);border-color:var(--green)}.palette button.wrong{background:var(--red);border-color:var(--red)}.palette button.current{box-shadow:0 0 0 2px #fff inset}.backlink{display:inline-block;color:#b9c8ff;text-decoration:none;font-size:12px;font-weight:800;margin-bottom:8px}
@media(max-width:520px){.wrap{padding:8px 9px}.question{font-size:16px}.option{padding:13px}.palette{grid-template-columns:repeat(5,1fr)}.modebar{padding:10px}.summary{padding:11px}}
</style>
</head>
<body>
<header class="header">
  <div class="head-right"><a class="back" href="student-results.html" aria-label="Back">‹</a><div class="title" id="headerTitle">Solutions</div></div>
  <div class="head-right"><span id="counter" class="counter">—</span><button id="menu" class="menu" aria-label="Question navigation">☰</button></div>
</header>
<main class="wrap">
  <a class="backlink" href="student-results.html">← My Results</a>
  <section id="summary" class="summary">Loading...</section>
  <section class="modebar">
    <div class="mode-text"><b>Reattempt Mode</b><span id="modeHint">Choose an option again. The answer is revealed only after you tap an option.</span></div>
    <label class="switch" aria-label="Reattempt Mode"><input id="reattempt" type="checkbox" checked><span class="slider"></span></label>
  </section>
  <section id="questionCard" class="question-card">Loading Solutions...</section>
</main>
<div class="nav"><button id="prev" aria-label="Previous question">←</button><button id="next" aria-label="Next question">→</button></div>
<div id="drawer" class="drawer"><div id="scrim" class="scrim"></div><aside class="side"><div class="side-head"><div><b>Questions</b><div id="sideInfo" class="meta"></div></div><button id="close" class="close">×</button></div><div class="legend"><span><i class="dot correct"></i>Correct</span><span><i class="dot wrong"></i>Wrong</span><span><i class="dot pending"></i>Not Attempted</span></div><div id="palette" class="palette"></div></aside></div>
<script type="module">
import{auth,db}from'./firebase-config.js';
import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
const $=id=>document.getElementById(id),resultId=new URLSearchParams(location.search).get('id');
let solutions=[],current=0,isDailyLive=false,reattempt=true,revealed=new Set(),selectedNow=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setValues(v){if(Array.isArray(v))return v.map(x=>String(x).trim().toUpperCase()).filter(Boolean).sort();if(typeof v==='string')return v.split(/[,|]/).map(x=>x.trim().toUpperCase()).filter(Boolean).sort();return[]}
function answerKey(v){const a=setValues(v);return a.join('|')}
function isCorrect(q,answer){const type=String(q.answerType||'SINGLE').toUpperCase();if(['DELETED','ALL_AWARDED','ALL-ANWARDED','ALL'].includes(type))return true;if(type==='MULTIPLE'){const a=setValues(answer),b=setValues(q.correctAnswer);return a.length>0&&a.length===b.length&&a.every((v,i)=>v===b[i])}return String(answer||'').trim().toUpperCase()===String(q.correctAnswer||'').trim().toUpperCase()}
function optionText(q,l){return q['option'+l]||q.options?.[l]||''}
function currentAnswer(q){return selectedNow.has(q._i)?selectedNow.get(q._i):q.selectedAnswer}
function displayCorrect(q){return setValues(q.correctAnswer).join(', ')||'—'}
function revealQuestion(i,answer){selectedNow.set(i,answer);revealed.add(i);renderQuestion()}
function renderPalette(){const p=$('palette');p.innerHTML='';solutions.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;const ans=currentAnswer(q);if(revealed.has(i))b.className=isCorrect(q,ans)?'correct':'wrong';if(i===current)b.classList.add('current');b.onclick=()=>{current=i;$('drawer').classList.remove('show');renderQuestion()};p.appendChild(b)});const done=solutions.filter((q,i)=>revealed.has(i)).length;const good=solutions.filter((q,i)=>revealed.has(i)&&isCorrect(q,currentAnswer(q))).length;$('sideInfo').textContent=`${done} answered · ${good} correct · ${solutions.length-done} pending`}
function renderQuestion(){
 if(!solutions.length)return;
 const q=solutions[current],ans=currentAnswer(q),hasRevealed=revealed.has(current),correct=setValues(q.correctAnswer),type=String(q.answerType||'SINGLE').toUpperCase();
 $('counter').textContent=`${current+1} / ${solutions.length}`;
 const letters=['A','B','C','D'];
 const options=letters.map(l=>{const isC=hasRevealed&&correct.includes(l),isS=hasRevealed&&setValues(ans).includes(l);let cls='';if(isC)cls='correct';else if(isS)cls='wrong';const mark=isC?'✓':isS?'✕':'';const disabled=hasRevealed?'disabled':'';return `<button class="option ${cls}" data-option="${l}" ${disabled}><span class="letter">${l}.</span><span>${esc(optionText(q,l))}</span>${mark?`<span class="mark">${mark}</span>`:''}</button>`}).join('');
 let footer='';
 if(hasRevealed){const ok=isCorrect(q,ans);footer=`<div class="result-line ${ok?'correct':'wrong'}">${ok?'✓ Correct Answer':'✕ Your Answer is Incorrect'}</div><div class="answer-line"><b>Correct Answer:</b> ${esc(displayCorrect(q))}</div><div class="solution-wrap"><button id="solutionBtn" class="solution-btn">View Solution</button><div id="explanation" class="explanation"><b>Solution</b><br>${esc(q.explanation||'No explanation available.')}</div></div>`}
 else if(!reattempt){footer=`<div class="answer-line"><b>Correct Answer:</b> ${esc(displayCorrect(q))}</div><div class="solution-wrap"><button id="solutionBtn" class="solution-btn">View Solution</button><div id="explanation" class="explanation"><b>Solution</b><br>${esc(q.explanation||'No explanation available.')}</div></div>`}
 $('questionCard').innerHTML=`<div class="qtop"><span class="qnum">${current+1}</span><span>${hasRevealed?'Answer revealed':reattempt?'Tap an option to reveal the answer':'Answer shown'}</span></div><div class="question">${current+1}. ${esc(q.question||'Question not available')}</div>${options}${footer}`;
 $('questionCard').querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>{if(reattempt&&!revealed.has(current))revealQuestion(current,btn.dataset.option)}));
 const sb=$('solutionBtn');if(sb)sb.onclick=()=>{$('explanation').classList.toggle('show');sb.textContent=$('explanation').classList.contains('show')?'Hide Solution':'View Solution'};
 $('prev').disabled=current===0;$('next').disabled=current===solutions.length-1;renderPalette();window.scrollTo({top:0,behavior:'smooth'});
}
async function load(user){
 try{
  if(!resultId)throw Error('Result ID not found.');
  const snap=await getDoc(doc(db,'results',resultId));
  if(!snap.exists()||snap.data().uid!==user.uid)throw Error('Result not found.');
  const result=snap.data();
  isDailyLive=!!result.liveTestId||result.isDailyLive===true;
  $('headerTitle').textContent=result.title||result.exam||'Solutions';
  $('summary').innerHTML=`<h2>${esc(result.title||result.exam||'Test')}</h2><div class="meta">${result.exam?`Exam: ${esc(result.exam)} · `:''}${result.subject?`Subject: ${esc(result.subject)} · `:''}Score: <b>${Number(result.score)||0}/${Number(result.totalQuestions)||0}</b>${isDailyLive?' · ⚡ Daily Live Test':''}</div>`;
  solutions=Array.isArray(result.solutions)?result.solutions.map((q,i)=>({...q,_i:i})):[];
  if(isDailyLive&&!solutions.length){
   const live=await getDoc(doc(db,'dailyLiveTests',result.liveTestId));
   if(live.exists()){
    const t=live.data();
    const qs=await Promise.all((t.questionIds||[]).map(id=>getDoc(doc(db,'questions',id))));
    solutions=qs.filter(s=>s.exists()).map((s,i)=>{const q=s.data(),o=q.options||{};return{_i:i,question:q.question||'',optionA:q.optionA??o.A??'',optionB:q.optionB??o.B??'',optionC:q.optionC??o.C??'',optionD:q.optionD??o.D??'',selectedAnswer:(result.answers||[])[i]||'',correctAnswer:q.answer??q.correctAnswer??'',answerType:q.answerType||'SINGLE',explanation:q.explanation||''}});
   }
  }
  if(!solutions.length){$('questionCard').innerHTML='<div class="locked">No question-by-question solutions were saved for this attempt.</div>';return}
  if(!isDailyLive){$('modebar')?.remove();$('questionCard').innerHTML='<div class="locked">🔒 Detailed explanations are available with Premium Pass.</div>';return}
  renderQuestion();
 }catch(e){console.error(e);$('summary').innerHTML=`<div class="locked">Unable to load solutions: ${esc(e.message||'Please try again.')}</div>`}
}
$('reattempt').addEventListener('change',e=>{reattempt=e.target.checked;$('modeHint').textContent=reattempt?'Choose an option again. The answer is revealed only after you tap an option.':'Correct and selected answers are shown immediately.';renderQuestion()});
$('prev').onclick=()=>{if(current>0){current--;renderQuestion()}};
$('next').onclick=()=>{if(current<solutions.length-1){current++;renderQuestion()}};
$('menu').onclick=()=>$('drawer').classList.add('show');
$('close').onclick=()=>$('drawer').classList.remove('show');
$('scrim').onclick=()=>$('drawer').classList.remove('show');
onAuthStateChanged(auth,u=>u?load(u):location.replace('login.html?next='+encodeURIComponent(location.href)));
</script>
</body>
</html>
