<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/review.html">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>body{margin:0;padding:15px;background:#0f1117;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#1b1e24;border:1px solid #303640;padding:16px;border-radius:14px;margin:14px 0}.summary{background:#181b22;padding:16px;border-radius:14px}.question{font-size:18px;font-weight:800;line-height:1.5;margin-bottom:14px}.answer{padding:12px;border-radius:9px;margin-top:10px}.correct{background:#003b2b;border-left:4px solid #00c853}.wrong{background:#3b0000;border-left:4px solid #f44336}.unanswered{background:#333;border-left:4px solid #999}.label{font-weight:800;display:block;margin-bottom:5px}.explanation{background:#242933;padding:13px;border-radius:9px;margin-top:14px;line-height:1.6}.locked{background:#332514;border:1px solid #6b4b1e;color:#fbbf24;padding:14px;border-radius:12px;line-height:1.5}.back{width:100%;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-weight:800;margin:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#163a2a;color:#86efac;font-size:12px;font-weight:800}.source{color:#8fa7ff;font-size:13px;font-weight:800}@media(max-width:600px){.card{padding:14px}.question{font-size:16px}}</style></head><body><main class="wrap"><div class="top"><h2>Solutions</h2><span id="plan" class="badge">Checking plan…</span></div><div id="resultInfo"></div><div id="solutions">Loading Solutions...</div><button class="back" onclick="history.back()">← Back to Results</button></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const resultId=new URLSearchParams(location.search).get('id'),$=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function answerText(q,a){if(!a)return'Not Answered';return q['option'+a]||a}async function load(user){if(!resultId){$('solutions').innerHTML='<div class="locked">Result ID not found.</div>';return}try{const resultSnap=await getDoc(doc(db,'results',resultId));if(!resultSnap.exists()||resultSnap.data().uid!==user.uid)throw new Error('Result not found.');const data=resultSnap.data();const studentSnap=await getDoc(doc(db,'students',user.uid));const until=studentSnap.exists()?Number(studentSnap.data().premiumUntil||0):0;const premium=until>Date.now();$('plan').textContent=premium?'👑 Premium Active':'🆓 Free Plan';let solutions=Array.isArray(data.solutions)?data.solutions:[];let sourceTitle=data.title||'Test';const isLive=!!data.liveTestId;if(isLive){const liveSnap=await getDoc(doc(db,'dailyLiveTests',data.liveTestId));if(liveSnap.exists())sourceTitle=liveSnap.data().title||sourceTitle;if(!solutions.length&&Array.isArray(data.answers)&&liveSnap.exists()){const t=liveSnap.data();const qs=await Promise.all((t.questionIds||[]).map(qid=>getDoc(doc(db,'questions',qid))));solutions=qs.filter(s=>s.exists()).map((s,i)=>{const q=s.data(),o=q.options||{};return{question:q.question||'',optionA:q.optionA??o.A??'',optionB:q.optionB??o.B??'',optionC:q.optionC??o.C??'',optionD:q.optionD??o.D??'',selectedAnswer:data.answers[i]||'',correctAnswer:q.answer??q.correctAnswer??'',explanation:q.explanation||''}})}}$('resultInfo').innerHTML=`<div class="summary"><p><b>Exam:</b> ${esc(data.exam||'N/A')}</p><p><b>Subject:</b> ${esc(data.subject||'N/A')}</p><p><b>Test:</b> ${esc(sourceTitle)}</p>${isLive?'<p class="source">⚡ Solutions loaded from this Daily Live Test attempt</p>':''}<p><b>Score:</b> ${Number(data.score)||0} / ${Number(data.totalQuestions)||0}</p></div>`;if(!solutions.length){$('solutions').innerHTML='<div class="locked">No solutions were saved for this attempt.</div>';return}if(!premium){$('solutions').innerHTML='<div class="locked">🔒 <b>Detailed explanations are a Premium feature.</b><br><br>Upgrade to the ₹20 Premium Pass to unlock explanations for your attempts.</div>'}else{$('solutions').innerHTML='';solutions.forEach((q,i)=>{const selected=q.selectedAnswer||'',correct=q.correctAnswer||'',ok=selected&&selected===correct;const card=document.createElement('div');card.className='card';card.innerHTML=`<div class="question">${i+1}. ${esc(q.question||'Question not available')}</div><div class="answer ${!selected?'unanswered':ok?'correct':'wrong'}"><span class="label">Your Answer:</span>${esc(selected?selected+' - '+answerText(q,selected):'Not Answered')}</div><div class="answer correct"><span class="label">Correct Answer:</span>${esc(correct+' - '+answerText(q,correct))}</div><div class="explanation"><span class="label">Explanation:</span>${esc(q.explanation||'No explanation available.')}</div>`;$('solutions').appendChild(card)})}}catch(e){console.error(e);$('solutions').innerHTML=`<div class="locked"><b>Unable to load solutions.</b><br><br>${esc(e.message||'Please try again.')}</div>`}}onAuthStateChanged(auth,u=>u?load(u):location.replace('login.html'));</script></body></html>
