<!doctype html><html lang="en"><head>

<title>Review | True Revise</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#202326;--panel:#292c31;--line:#3b4048;--muted:#aeb6c2;--green:#20d47a;--red:#ef4b55;--blue:#4b8dff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fb;font-family:Inter,Arial,sans-serif;padding-bottom:82px}.header{position:sticky;top:0;z-index:20;background:#2a2d31;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}.head{display:flex;align-items:center;gap:9px}.header button,.header a{background:transparent;border:0;color:#fff;text-decoration:none;font-size:25px;cursor:pointer}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.counter{font-size:13px;color:#d4dae4;font-weight:800}.wrap{max-width:900px;margin:auto;padding:10px 14px}.backlink{display:inline-block;color:#b9c8ff;text-decoration:none;font-size:12px;font-weight:800;margin-bottom:8px}.summary,.modebar,.question-card,.scorebox{background:#25282d;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.summary h2{margin:6px 0 5px;font-size:18px}.meta{color:var(--muted);font-size:12px;line-height:1.55}.badge{display:inline-block;background:#173b2a;color:#79e5aa;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.modebar{display:flex;align-items:center;justify-content:space-between;gap:12px}.mode-text b{display:block;font-size:13px}.mode-text span{color:var(--muted);font-size:11px}.switch{position:relative;width:52px;height:30px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#39434b;border-radius:999px}.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#aab3bf;transition:.2s}.switch input:checked+.slider{background:#1f4650}.switch input:checked+.slider:before{transform:translateX(22px);background:#4b8dff}.scorebox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#151d2b;border-color:#315a9c}.scoretitle{font-size:12px;color:#aeb6c2}.scorevalue{font-size:23px;font-weight:900;color:#fff}.scoremeta{font-size:11px;color:#aeb6c2;text-align:right}.qtop{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin-bottom:12px}.qnum{background:#aeb7c2;color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900}.question{font-size:18px;line-height:1.5;font-weight:800;margin-bottom:15px}.option{width:100%;background:#303338;border:2px solid transparent;border-radius:7px;padding:14px 16px;margin:9px 0;color:#f1f3f7;text-align:left;display:flex;align-items:center;gap:10px;font:inherit;line-height:1.45;cursor:pointer}.option.correct{background:#395a43;border-color:#5fba73}.option.wrong{background:#65494c;border-color:#ef625f}.option:disabled{cursor:default}.letter{color:#aeb6c2;font-weight:800;min-width:26px}.mark{margin-left:auto;font-size:22px;font-weight:900}.result-line{margin-top:14px;font-size:16px;font-weight:800}.result-line.correct{color:#d9ffe7}.result-line.wrong{color:#ffb7b7}.answer-line{margin-top:6px;font-size:14px;color:#d7dde6}.solution-btn{width:100%;padding:12px;border:1px solid var(--blue);border-radius:8px;background:transparent;color:#5d9aff;font-weight:900;cursor:pointer;margin-top:14px}.explanation{display:none;margin-top:10px;background:#25282d;border-radius:8px;padding:13px;line-height:1.65;font-size:14px}.explanation.show{display:block}.locked{background:#332514;border:1px solid #6b4b1e;color:#fbbf24;padding:14px;border-radius:10px;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#292c31;border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:9px}.nav button{flex:1;min-height:50px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:25px;font-weight:800;cursor:pointer}.nav button:disabled{opacity:.35}.drawer{display:none;position:fixed;inset:0;z-index:50}.drawer.show{display:block}.scrim{position:absolute;inset:0;background:#0009}.side{position:absolute;right:0;top:0;bottom:0;width:min(390px,88vw);background:#282b30;padding:17px;overflow:auto}.sidehead{display:flex;justify-content:space-between;border-bottom:1px solid #41464f;padding-bottom:12px}.close{background:transparent;color:#fff;border:0;font-size:28px}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}.palette button{aspect-ratio:1;border-radius:50%;background:#30343a;border:2px solid #9aa5b5;color:#fff;font-weight:800}.palette button.correct{background:var(--green);border-color:var(--green)}.palette button.wrong{background:var(--red);border-color:var(--red)}.palette button.current{box-shadow:0 0 0 2px #fff inset}@media(max-width:520px){.wrap{padding:8px 9px}.question{font-size:16px}.palette{grid-template-columns:repeat(5,1fr)}.scorevalue{font-size:21px}}</style></head><body><header class="header"><div class="head"><a href="student-results.html" aria-label="Back">‹</a><div class="title" id="headerTitle">Solutions</div></div><div class="head"><span id="counter" class="counter">—</span><button id="menu">☰</button></div></header><main class="wrap"><a class="backlink" href="student-results.html">← My Results</a><section id="summary" class="summary">Loading...</section><section id="modebar" class="modebar"><div class="mode-text"><b>Reattempt Mode</b><span id="modeHint">Choose an option again. The answer is revealed only after you tap an option.</span></div><label class="switch"><input id="reattempt" type="checkbox" checked><span class="slider"></span></label></section><section id="scorebox" class="scorebox" style="display:none"><div><div class="scoretitle">Temporary Reattempt Score</div><div id="tempScore" class="scorevalue">0</div></div><div id="scoreMeta" class="scoremeta">0 answered<br>0 correct · 0 wrong</div></section><section id="questionCard" class="question-card">Loading Solutions...</section></main><div class="nav"><button id="prev">←</button><button id="next">→</button></div><div id="drawer" class="drawer"><div id="scrim" class="scrim"></div><aside class="side"><div class="sidehead"><div><b>Questions</b><div id="sideInfo" class="meta"></div></div><button id="close" class="close">×</button></div><div id="palette" class="palette"></div></aside></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id),resultId=new URLSearchParams(location.search).get('id');let solutions=[],current=0,isDailyLive=false,reattempt=true,revealed=new Set(),selectedNow=new Map(),positive=2,negative=.5;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function vals(v){if(Array.isArray(v))return v.map(x=>String(x).trim().toUpperCase()).filter(Boolean).sort();if(typeof v==='string')return v.split(/[,|]/).map(x=>x.trim().toUpperCase()).filter(Boolean).sort();return[]}function isCorrect(q,a){const t=String(q.answerType||'SINGLE').toUpperCase();if(['DELETED','ALL_AWARDED','ALL-ANWARDED','ALL'].includes(t))return true;if(t==='MULTIPLE'){const x=vals(a),y=vals(q.correctAnswer);return x.length>0&&x.length===y.length&&x.every((v,i)=>v===y[i])}return String(a||'').trim().toUpperCase()===String(q.correctAnswer||'').trim().toUpperCase()}function ans(q){return selectedNow.has(q._i)?selectedNow.get(q._i):q.selectedAnswer}function opt(q,l){return q['option'+l]||q.options?.[l]||''}function correctText(q){return vals(q.correctAnswer).join(', ')||'—'}function updateScore(){if(!isDailyLive||!reattempt){$('scorebox').style.display='none';return}const done=[...revealed];const good=done.filter(i=>isCorrect(solutions[i],selectedNow.get(i))).length;const bad=done.length-good;const score=(good*positive)-(bad*negative);$('scorebox').style.display='flex';$('tempScore').textContent=`${score.toFixed(score%1?1:0)} / ${solutions.length*positive}`;$('scoreMeta').innerHTML=`${done.length} answered<br>${good} correct · ${bad} wrong`;}$('sideInfo').textContent='';function palette(){const p=$('palette');p.innerHTML='';solutions.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;if(revealed.has(i))b.className=isCorrect(q,ans(q))?'correct':'wrong';if(i===current)b.classList.add('current');b.onclick=()=>{current=i;$('drawer').classList.remove('show');render()};p.appendChild(b)});const done=solutions.filter((q,i)=>revealed.has(i)).length,good=solutions.filter((q,i)=>revealed.has(i)&&isCorrect(q,ans(q))).length;$('sideInfo').textContent=`${done} answered · ${good} correct · ${solutions.length-done} pending`}function render(){if(!solutions.length)return;const q=solutions[current],a=ans(q),show=revealed.has(current),c=vals(q.correctAnswer);$('counter').textContent=`${current+1} / ${solutions.length}`;const buttons=['A','B','C','D'].map(l=>{const isC=show&&c.includes(l),isA=show&&vals(a).includes(l),cls=isC?'correct':isA?'wrong':'',mark=isC?'✓':isA?'✕':'';return`<button class="option ${cls}" data-o="${l}" ${show?'disabled':''}><span class="letter">${l}.</span><span>${esc(opt(q,l))}</span>${mark?`<span class="mark">${mark}</span>`:''}</button>`}).join('');let foot='';if(show){const ok=isCorrect(q,a);foot=`<div class="result-line ${ok?'correct':'wrong'}">${ok?'✓ Correct Answer':'✕ Your Answer is Incorrect'}</div><div class="answer-line"><b>Correct Answer:</b> ${esc(correctText(q))}</div><button id="solutionBtn" class="solution-btn">View Solution</button><div id="explanation" class="explanation"><b>Solution</b><br>${esc(q.explanation||'No explanation available.')}</div>`}else if(!reattempt){foot=`<div class="answer-line"><b>Correct Answer:</b> ${esc(correctText(q))}</div><button id="solutionBtn" class="solution-btn">View Solution</button><div id="explanation" class="explanation"><b>Solution</b><br>${esc(q.explanation||'No explanation available.')}</div>`}$('questionCard').innerHTML=`<div class="qtop"><span class="qnum">${current+1}</span><span>${show?'Answer revealed':reattempt?'Tap an option to reveal the answer':'Answer shown'}</span></div><div class="question">${current+1}. ${esc(q.question||'Question not available')}</div>${buttons}${foot}`;$('questionCard').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(reattempt&&!show){selectedNow.set(q._i,b.dataset.o);revealed.add(current);updateScore();render()}});const sb=$('solutionBtn');if(sb)sb.onclick=()=>{const e=$('explanation');e.classList.toggle('show');sb.textContent=e.classList.contains('show')?'Hide Solution':'View Solution'};$('prev').disabled=current===0;$('next').disabled=current===solutions.length-1;palette();updateScore();scrollTo({top:0,behavior:'smooth'})}function expiry(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;if(typeof v==='number')return v;const n=new Date(v).getTime();return Number.isFinite(n)?n:0}async function premium(u){const s=await getDoc(doc(db,'students',u.uid));return s.exists()&&expiry(s.data().premiumUntil)>Date.now()}async function load(u){try{if(!resultId)throw Error('Result ID not found.');const snap=await getDoc(doc(db,'results',resultId));if(!snap.exists()||snap.data().uid!==u.uid)throw Error('Result not found.');const r=snap.data();isDailyLive=!!r.liveTestId||r.isDailyLive===true;if(!isDailyLive&&!await premium(u)){$('modebar').style.display='none';$('questionCard').innerHTML='<div class="locked">🔒 Detailed explanations and reattempt are available with Premium Pass.</div>';return}positive=Number(r.positiveMarks??r.marksPerQuestion??r.markPerQuestion??2)||2;negative=Number(r.negativeMarks??r.negativeMarking??.5);if(negative<0)negative=Math.abs(negative);$('headerTitle').textContent=r.title||r.exam||'Solutions';$('summary').innerHTML=`<span class="badge">${isDailyLive?'⚡ DAILY LIVE TEST':'👑 PREMIUM SOLUTIONS'}</span><h2>${esc(r.title||r.exam||'Test')}</h2><div class="meta">${r.exam?`Exam: ${esc(r.exam)} · `:''}${r.subject?`Subject: ${esc(r.subject)} · `:''}Original Score: <b>${Number(r.score)||0}/${Number(r.totalQuestions)||0}</b></div>`;solutions=Array.isArray(r.solutions)?r.solutions.map((q,i)=>({...q,_i:i})):[];if(isDailyLive&&!solutions.length){const live=await getDoc(doc(db,'dailyLiveTests',r.liveTestId));if(live.exists()){const t=live.data();const qs=await Promise.all((t.questionIds||[]).map(id=>getDoc(doc(db,'questions',id))));solutions=qs.filter(s=>s.exists()).map((s,i)=>{const q=s.data(),o=q.options||{};return{_i:i,question:q.question||'',optionA:q.optionA??o.A??'',optionB:q.optionB??o.B??'',optionC:q.optionC??o.C??'',optionD:q.optionD??o.D??'',selectedAnswer:(r.answers||[])[i]||'',correctAnswer:q.answer??q.correctAnswer??'',answerType:q.answerType||'SINGLE',explanation:q.explanation||''}})}}if(!solutions.length){$('questionCard').innerHTML='<div class="locked">No question-by-question solutions were saved for this attempt.</div>';return}render()}catch(e){console.error(e);$('summary').innerHTML=`<div class="locked">Unable to load solutions: ${esc(e.message||'Please try again.')}</div>`}}$('reattempt').onchange=e=>{reattempt=e.target.checked;$('modeHint').textContent=reattempt?'Choose an option again. The answer is revealed only after you tap an option.':'Correct and selected answers are shown immediately.';updateScore();render()};$('prev').onclick=()=>{if(current>0){current--;render()}};$('next').onclick=()=>{if(current<solutions.length-1){current++;render()}};$('menu').onclick=()=>$('drawer').classList.add('show');$('close').onclick=()=>$('drawer').classList.remove('show');$('scrim').onclick=()=>$('drawer').classList.remove('show');onAuthStateChanged(auth,u=>u?load(u):location.replace('login.html?next='+encodeURIComponent(location.href)));</script></body></html>
