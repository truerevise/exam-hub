<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solutions</title>

    <style>
        body {
            margin: 0;
            padding: 15px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .summary {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .answer {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .your-answer {
            background: #332b00;
            border-left: 4px solid #ff9800;
        }

        .correct-answer {
            background: #003b2b;
            border-left: 4px solid #00c853;
        }

        .wrong-answer {
            background: #3b0000;
            border-left: 4px solid #f44336;
        }

        .not-answered {
            background: #333;
            border-left: 4px solid #999;
        }

        .label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .explanation {
            background: #333;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .error {
            background: #3b0000;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .backBtn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h2>Solutions</h2>

    <div id="resultInfo"></div>

    <div id="solutions">
        Loading Solutions...
    </div>

    <button class="backBtn" id="backBtn">
        ← Back to Results
    </button>


    <script type="module">

        import { db } from "./firebase-config.js";

        import {
            collection,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


        const params =
            new URLSearchParams(window.location.search);

        const resultId =
            params.get("id");


        const solutionsDiv =
            document.getElementById("solutions");

        const resultInfo =
            document.getElementById("resultInfo");


        document.getElementById("backBtn").onclick = function () {
            history.back();
        };


        async function loadSolutions() {

            try {

                if (!resultId) {

                    solutionsDiv.innerHTML = `
                        <div class="error">
                            <b>Result ID not found.</b>
                        </div>
                    `;

                    return;
                }


                /*
                 * IMPORTANT:
                 * Get the results COLLECTION first,
                 * then get the individual document.
                 */

                const resultRef = doc(db, "results", resultId);

const resultSnap = await getDoc(resultRef);
            


                if (!resultSnap.exists()) {

                    solutionsDiv.innerHTML = `
                        <div class="error">
                            <b>Result not found.</b>
                            <br><br>
                            The selected test result could not be found.
                        </div>
                    `;

                    return;
                }


                const data =
                    resultSnap.data();


                /*
                 * TEST SUMMARY
                 */

                resultInfo.innerHTML = `
                    <div class="summary">

                        <p>
                            <b>Exam:</b>
                            ${data.exam || "N/A"}
                        </p>

                        <p>
                            <b>Subject:</b>
                            ${data.subject || "N/A"}
                        </p>

                        <p>
                            <b>Score:</b>
                            ${data.score ?? 0}
                        </p>

                        <p>
                            <b>Total Questions:</b>
                            ${data.totalQuestions ?? 0}
                        </p>

                    </div>
                `;


                /*
                 * GET SAVED SOLUTIONS
                 */

                let solutions =
                    data.solutions || [];


                if (typeof solutions === "string") {

                    try {
                        solutions =
                            JSON.parse(solutions);
                    }

                    catch (e) {
                        solutions = [];
                    }
                }


                if (!Array.isArray(solutions)) {
                    solutions = [];
                }


                /*
                 * NO SOLUTIONS
                 */

                if (solutions.length === 0) {

                    solutionsDiv.innerHTML = `
                        <div class="error">

                            <b>No solutions are saved for this attempt.</b>

                            <br><br>

                            Please take a NEW test attempt and
                            submit it again.

                        </div>
                    `;

                    return;
                }


                /*
                 * DISPLAY SOLUTIONS
                 */

                solutionsDiv.innerHTML = "";


                solutions.forEach(function (q, index) {


                    const selectedAnswer =
                        q.selectedAnswer || "";

                    const correctAnswer =
                        q.correctAnswer || "";


                    /*
                     * YOUR ANSWER TEXT
                     */

                    let selectedText =
                        "Not Answered";


                    if (selectedAnswer === "A") {
                        selectedText = q.optionA || "";
                    }

                    else if (selectedAnswer === "B") {
                        selectedText = q.optionB || "";
                    }

                    else if (selectedAnswer === "C") {
                        selectedText = q.optionC || "";
                    }

                    else if (selectedAnswer === "D") {
                        selectedText = q.optionD || "";
                    }

                    else if (selectedAnswer !== "") {
                        selectedText = selectedAnswer;
                    }


                    /*
                     * CORRECT ANSWER TEXT
                     */

                    let correctText =
                        correctAnswer;


                    if (correctAnswer === "A") {
                        correctText = q.optionA || "";
                    }

                    else if (correctAnswer === "B") {
                        correctText = q.optionB || "";
                    }

                    else if (correctAnswer === "C") {
                        correctText = q.optionC || "";
                    }

                    else if (correctAnswer === "D") {
                        correctText = q.optionD || "";
                    }


                    /*
                     * CHECK ANSWER
                     */

                    const isCorrect =
                        selectedAnswer !== "" &&
                        selectedAnswer === correctAnswer;


                    /*
                     * CREATE CARD
                     */

                    const card =
                        document.createElement("div");

                    card.className =
                        "card";


                    /*
                     * QUESTION
                     */

                    const question =
                        document.createElement("div");

                    question.className =
                        "question";

                    question.textContent =
                        (index + 1) + ". " +
                        (q.question || "Question not available");


                    card.appendChild(question);


                    /*
                     * YOUR ANSWER
                     */

                    const yourAnswer =
                        document.createElement("div");


                    if (selectedAnswer === "") {

                        yourAnswer.className =
                            "answer not-answered";

                    }

                    else if (isCorrect) {

                        yourAnswer.className =
                            "answer correct-answer";

                    }

                    else {

                        yourAnswer.className =
                            "answer wrong-answer";
                    }


                    yourAnswer.innerHTML = `
                        <span class="label">
                            Your Answer:
                        </span>

                        ${
                            selectedAnswer === ""
                            ? "Not Answered"
                            : selectedAnswer + " - " + selectedText
                        }
                    `;


                    card.appendChild(yourAnswer);


                    /*
                     * CORRECT ANSWER
                     */

                    const correctAnswerBox =
                        document.createElement("div");

                    correctAnswerBox.className =
                        "answer correct-answer";


                    correctAnswerBox.innerHTML = `
                        <span class="label">
                            Correct Answer:
                        </span>

                        ${correctAnswer} - ${correctText}
                    `;


                    card.appendChild(correctAnswerBox);


                    /*
                     * EXPLANATION
                     */

                    const explanation =
                        document.createElement("div");

                    explanation.className =
                        "explanation";


                    explanation.innerHTML = `
                        <span class="label">
                            Explanation:
                        </span>

                        ${
                            q.explanation ||
                            "No explanation available."
                        }
                    `;


                    card.appendChild(explanation);


                    solutionsDiv.appendChild(card);

                });

            }


            catch (error) {

                console.error(
                    "Solutions Error:",
                    error
                );


                solutionsDiv.innerHTML = `
                    <div class="error">

                        <b>Unable to load solutions.</b>

                        <br><br>

                        Error:
                        ${error.message}

                    </div>
                `;

            }

        }


        loadSolutions();

    </script>

</body>

</html>
