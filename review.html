<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/review.html"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>:root{--bg:#101216;--panel:#1b1e24;--line:#343b47;--text:#f5f7fb;--muted:#aeb6c2;--green:#19c463;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;padding-bottom:78px}.header{position:sticky;top:0;z-index:20;background:#181b21;border-bottom:1px solid var(--line);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{display:flex;align-items:center;gap:8px}.menu{background:transparent;border:0;color:#fff;font-size:27px}.wrap{max-width:900px;margin:auto;padding:14px}.summary,.question-card{background:var(--panel);border:1px solid var(--line);padding:15px;border-radius:14px;margin-bottom:13px}.summary h2{margin:7px 0}.meta{color:var(--muted);font-size:13px;line-height:1.6}.question{font-size:18px;line-height:1.55;font-weight:800;margin-bottom:16px}.qtop{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:12px}.option{background:#282d35;border:2px solid transparent;border-radius:9px;padding:13px;margin:10px 0;line-height:1.5;display:flex;gap:10px;align-items:center}.option.correct{background:#174e2f;border-color:var(--green)}.option.wrong{background:#54272b;border-color:var(--red)}.mark{margin-left:auto;font-size:21px;font-weight:900}.explanation{margin-top:17px;background:#252a32;border-radius:10px;padding:14px;line-height:1.65}.label{font-weight:900;display:block;margin-bottom:5px}.status{font-weight:900}.status.correct{color:#70e3a1}.status.wrong{color:#ff8b8b}.status.skip{color:#c4ccd7}.nav{position:fixed;bottom:0;left:0;right:0;background:#101318f7;border-top:1px solid var(--line);padding:10px;display:flex;gap:9px;z-index:15}.nav button{flex:1;min-height:48px;border:1px solid #566276;background:#252d39;color:#fff;border-radius:10px;font-weight:800}.drawer{display:none;position:fixed;inset:0;z-index:50}.drawer.show{display:block}.scrim{position:absolute;inset:0;background:#0009}.side{position:absolute;right:0;top:0;bottom:0;width:min(380px,88vw);background:#252a31;padding:18px;overflow:auto}.side-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #414854;padding-bottom:14px}.close{background:transparent;border:0;color:#fff;font-size:28px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;color:#cbd5e1;font-size:12px}.legend span{display:flex;align-items:center;gap:7px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid #9aa5b5;display:inline-block}.dot.correct{background:var(--green);border-color:var(--green)}.dot.wrong{background:var(--red);border-color:var(--red)}.dot.skip{background:#9aa5b5;border-color:#9aa5b5}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.palette button{aspect-ratio:1;border-radius:50%;background:#242b35;border:2px solid #98a4b4;color:#fff;font-weight:800}.palette button.correct{background:var(--green);border-color:var(--green)}.palette button.wrong{background:var(--red);border-color:var(--red)}.palette button.skip{background:#9aa5b5;border-color:#9aa5b5}.palette button.current{box-shadow:0 0 0 2px #fff inset}.badge{display:inline-block;background:#173b2a;color:#79e5aa;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.locked{background:#332514;border:1px solid #6b4b1e;color:#fbbf24;padding:14px;border-radius:12px;line-height:1.5}@media(max-width:520px){.wrap{padding:10px}.question{font-size:16px}.palette{grid-template-columns:repeat(5,1fr)}} </style></head><body><header class="header"><div class="title" id="headerTitle">Solutions</div><div class="right"><span id="counter">—</span><button id="menu" class="menu">☰</button></div></header><main class="wrap"><div id="summary" class="summary">Loading...</div><div id="questionCard" class="question-card">Loading Solutions...</div></main><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div><div id="drawer" class="drawer"><div id="scrim" class="scrim"></div><aside class="side"><div class="side-head"><div><b>Questions</b><div id="sideInfo" class="meta"></div></div><button id="close" class="close">×</button></div><div class="legend"><span><i class="dot correct"></i> Correct</span><span><i class="dot wrong"></i> Wrong</span><span><i class="dot skip"></i> Not Attempted</span><span><i class="dot"></i> Unseen</span></div><div id="palette" class="palette"></div></aside></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const resultId=new URLSearchParams(location.search).get('id'),$=id=>document.getElementById(id);let solutions=[],current=0,result=null,premium=false;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function isCorrect(q){return!!q.selectedAnswer&&String(q.selectedAnswer).trim().toUpperCase()===String(q.correctAnswer||'').trim().toUpperCase()}function renderPalette(){const p=$('palette');p.innerHTML='';solutions.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=isCorrect(q)?'correct':q.selectedAnswer?'wrong':'skip';if(i===current)b.classList.add('current');b.onclick=()=>{current=i;$('drawer').classList.remove('show');renderQuestion()};p.appendChild(b)});$('sideInfo').textContent=`${solutions.filter(isCorrect).length} correct · ${solutions.filter(q=>q.selectedAnswer&&!isCorrect(q)).length} wrong · ${solutions.filter(q=>!q.selectedAnswer).length} not attempted`}function renderQuestion(){const q=solutions[current],selected=q.selectedAnswer||'',correct=q.correctAnswer||'',ok=isCorrect(q);$('counter').textContent=`${current+1} / ${solutions.length}`;$('questionCard').innerHTML=`<div class="qtop"><span>Question ${current+1}</span><span class="status ${!selected?'skip':ok?'correct':'wrong'}">${!selected?'NOT ATTEMPTED':ok?'✓ CORRECT':'✕ WRONG'}</span></div><div class="question">${current+1}. ${esc(q.question||'Question not available')}</div>${['A','B','C','D'].map(l=>{const cls=l===correct?'correct':l===selected?'wrong':'';const mark=l===correct?'✓':l===selected?'✕':'';return`<div class="option ${cls}"><b>${l}.</b><span>${esc(q['option'+l]||'')}</span>${mark?`<span class="mark">${mark}</span>`:''}</div>`}).join('')}<div class="explanation"><span class="label">Explanation</span>${esc(q.explanation||'No explanation available.')}</div>`;$('prev').disabled=current===0;$('next').disabled=current===solutions.length-1;renderPalette();window.scrollTo({top:0,behavior:'smooth'})}async function load(user){try{const snap=await getDoc(doc(db,'results',resultId));if(!snap.exists()||snap.data().uid!==user.uid)throw Error('Result not found.');result=snap.data();const student=await getDoc(doc(db,'students',user.uid));premium=student.exists()&&Number(student.data().premiumUntil||0)>Date.now();$('headerTitle').textContent=result.title||result.exam||'Solutions';$('summary').innerHTML=`<span class="badge">${result.liveTestId?'⚡ DAILY LIVE TEST':'TEST SOLUTIONS'}</span><h2>${esc(result.title||result.exam||'Test')}</h2><div class="meta">${result.exam?`Exam: ${esc(result.exam)} · `:''}${result.subject?`Subject: ${esc(result.subject)} · `:''}Score: <b>${Number(result.score)||0}/${Number(result.totalQuestions)||0}</b></div>`;solutions=Array.isArray(result.solutions)?result.solutions:[];if(result.liveTestId&&!solutions.length){const live=await getDoc(doc(db,'dailyLiveTests',result.liveTestId));if(live.exists()){const t=live.data();const qs=await Promise.all((t.questionIds||[]).map(id=>getDoc(doc(db,'questions',id))));solutions=qs.filter(s=>s.exists()).map((s,i)=>{const q=s.data(),o=q.options||{};return{question:q.question||'',optionA:q.optionA??o.A??'',optionB:q.optionB??o.B??'',optionC:q.optionC??o.C??'',optionD:q.optionD??o.D??'',selectedAnswer:(result.answers||[])[i]||'',correctAnswer:q.answer??q.correctAnswer??'',explanation:q.explanation||''}})}}if(!solutions.length){$('questionCard').innerHTML='<div class="locked">No question-by-question solutions were saved for this attempt.</div>';return}if(!premium){$('questionCard').innerHTML='<div class="locked">🔒 Detailed explanations are available with Premium Pass.</div>';return}renderQuestion()}catch(e){console.error(e);$('summary').innerHTML=`<div class="locked">Unable to load solutions: ${esc(e.message||'Please try again.')}</div>`}}$('prev').onclick=()=>{if(current>0){current--;renderQuestion()}};$('next').onclick=()=>{if(current<solutions.length-1){current++;renderQuestion()}};$('menu').onclick=()=>$('drawer').classList.add('show');$('close').onclick=()=>$('drawer').classList.remove('show');$('scrim').onclick=()=>$('drawer').classList.remove('show');onAuthStateChanged(auth,u=>u?load(u):location.replace('login.html'));</script></body></html>
