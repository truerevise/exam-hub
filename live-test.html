const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);let qs=[],ans=[],i=0,left=0,timer,submitting=false,user=null,testData=null,allowedAttempts=1,usedAttempts=0,savedIds=new Set(),saving=false,currentLang='en',translationCache=new Map(),translationRequest=0;const attemptId=()=>user&&id?`${user.uid}_${id}`:'';const norm=(d,qid)=>{const o=d.options||{};return{...d,id:qid,A:d.optionA??o.A??'',B:d.optionB??o.B??'',C:d.optionC??o.C??'',D:d.optionD??o.D??'',answer:d.answer??d.correctAnswer??''}};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function showLocked(message,link=false){$('box').innerHTML=`<div class="locked"><h2>✓ Attempt limit reached</h2><p class="message">${esc(message)}</p>${link?`<a class="result-link" href="daily-live-results.html?liveTestId=${encodeURIComponent(id)}">View Today's Result →</a>`:''}</div>`;document.querySelector('.btns').style.display='none';$('menu').style.display='none'}function formatTime(v){v=Math.max(0,v);return`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}function startTimer(){if(timer)clearInterval(timer);left=qs.length*60;$('time').textContent=formatTime(left);timer=setInterval(()=>{left--;$('time').textContent=formatTime(left);if(left<=0){clearInterval(timer);submit(true)}},1000)}function updatePalette(){[...$('pal').children].forEach((b,n)=>{b.classList.toggle('answered',!!ans[n]);b.classList.toggle('current',n===i)});$('sideInfo').textContent=`${ans.filter(Boolean).length} of ${qs.length} answered · Attempt ${usedAttempts+1} of ${allowedAttempts}`}function updateSaveButton(){const saved=savedIds.has(qs[i]?.id);$('saveBtn').classList.toggle('saved',saved);$('saveBtn').textContent=saved?'🔖 Saved':'🔖 Save';$('saveBtn').title=saved?'Remove from Saved Questions':'Save question'}async function loadSavedState(){try{const snap=await getDocs(query(collection(db,'savedQuestions'),where('uid',' async function show(){if(!qs[i])return;const q=qs[i],request=++translationRequest;$('no').textContent=`Question ${i+1} / ${qs.length}`;$('progress').textContent=`${ans.filter(Boolean).length} of ${qs.length} answered · Attempt ${usedAttempts+1} of ${allowedAttempts}`;$('prev').disabled=!i;$('next').style.display=i===qs.length-1?'none':'block';$('submit').style.display=i===qs.length-1?'block':'none';updatePalette();updateSaveButton();['A','B','C','D'].forEach(x=>$(x).classList.toggle('sel',ans[i]===x));if(currentLang==='en'){$('q').innerHTML=`<span class="qnum">${i+1}.</span>${esc(q.question||'Question unavailable')}`;['A','B','C','D'].forEach(x=>$(x).textContent=x+'. '+(q[x]||''));$('translateStatus').textContent='English · Original';return}const teOpts=q.optionsTe||{},providedQuestion=String(q.questionTe||'').trim(),providedOptions={A:q.ATe||teOpts.A||'',B:q.BTe||teOpts.B||'',C:q.CTe||teOpts.C||'',D:q.DTe||teOpts.D||''};$('translateStatus').textContent='🇮🇳 Loading Telugu translation…';const sources=[q.question||'',q.A||'',q.B||'',q.C||'',q.D||''];const translated=await Promise.all(sources.map(translateText));if(request!==translationRequest)return;$('q').innerHTML=`<span class="qnum">${i+1}.</span>${esc(providedQuestion||translated[0]||q.question||'')}`;['A','B','C','D'].forEach((x,n)=>$(x).textContent=x+'. '+(providedOptions[x]||translated[n+1]||q[x]||''));$('translateStatus').textContent=providedQuestion?'తెలుగు · Saved translation'+(Object.values(providedOptions).some(Boolean)?'':' · Options translated automatically'):(translated.some(Boolean)?'తెలుగు · Auto-translated':'⚠️ Translation unavailable · Showing English')}function make(){$('pal').innerHTML='';qs.forEach((_,n)=>{const b=document.createElement('button');b.textContent=n+1;b.onclick=()=>{i=n;$('drawer').classList.remove('show');show();window.scrollTo({top:0,behavior:'smooth'})};$('pal').appendChild(b)});updatePalette()}

['A','B','C','D'].forEach(x=>$(x).onclick=()=>{ans[i]=x;show()});$('translateBtn').onclick=toggleTranslation;$('saveBtn').onclick=toggleSave;$('prev').onclick=()=>{if(i){i--;show();window.scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(i<qs.length-1){i++;show();window.scrollTo({top:0,behavior:'smooth'})}};$('menu').onclick=()=>$('drawer').classList.add('show');$('close').onclick=()=>$('drawer').classList.remove('show');$('scrim').onclick=()=>$('drawer').classList.remove('show');$('sideSubmit').onclick=()=>submit(false);async function submit(auto=false){if(submitting)return;if(!auto&&!confirm('Submit this test now?'))return;submitting=true;if(timer)clearInterval(timer);if(!user){location.href='login.html?next='+encodeURIComponent(location.href);return}try{let score=0,correct=0,wrong=0,notAttempted=0;qs.forEach((q,n)=>{if(!ans[n])notAttempted++;else if(String(ans[n]).trim().toUpperCase()===String(q.answer||'').trim().toUpperCase()){correct++;score+=Number(q.marks??1)}else{wrong++;score-=Number(q.negativeMarks??0)}});const solutions=qs.map((q,n)=>({question:q.question||'',optionA:q.A||'',optionB:q.B||'',optionC:q.C||'',optionD:q.D||'',selectedAnswer:ans[n]||'',correctAnswer:q.answer||'',answerType:q.answerType||'SINGLE',marks:Number(q.marks??1),negativeMarks:Number(q.negativeMarks??0),explanation:q.explanation||''}));const attemptRef=doc(db,'dailyAttempts',attemptId()),resultRef=doc(collection(db,'results')),leaderRef=doc(db,'dailyLiveLeaderboard',`${user.uid}_${id}`);await runTransaction(db,async tx=>{const state=await tx.get(attemptRef);const leader=await tx.get(leaderRef);const latestUsed=state.exists()?Number(state.data().attemptsUsed||0):0;if(latestUsed>=allowedAttempts)throw Error('Your allowed attempt limit has already been reached. Please refresh the page.');const attemptNo=latestUsed+1;tx.set(attemptRef,{uid:user.uid,liveTestId:id,attemptsUsed:attemptNo,lastAttemptAt:new Date(),questionCount:qs.length},{merge:false});tx.set(resultRef,{uid:user.
