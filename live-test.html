<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow,noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>True Revise | Daily Live Test</title><style>:root{--bg:#080b12;--panel:#111722;--panel2:#151e2c;--line:#273244;--text:#f5f7fb;--muted:#9aa5b5;--blue:#3b6cff;--green:#35d69a;--gold:#f4c65e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18233b 0,#080b12 42%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.header{background:rgba(10,17,29,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;gap:10px}.head-left{display:flex;align-items:center;gap:12px;min-width:0}.brand{font-size:13px;font-weight:900;color:#aab9ff}.timer{font-weight:900;background:#172033;border:1px solid var(--line);padding:8px 11px;border-radius:999px;white-space:nowrap}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:22px 0 45px}.card{background:linear-gradient(145deg,#111722,#0e141e);border:1px solid var(--line);padding:18px;border-radius:18px;box-shadow:0 15px 40px rgba(0,0,0,.22);margin-bottom:14px}.title-card h2{margin:0 0 7px}.title-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.live{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(53,214,154,.1);border:1px solid rgba(53,214,154,.18);color:#62e3b1;font-size:10px;font-weight:900;margin-bottom:10px}.question{font-size:18px;line-height:1.65;margin:0 0 18px;font-weight:800}.qnum{color:#8fa7ff;margin-right:7px}.opt{background:#202a39;border:1px solid #2c384a;padding:13px;margin:9px 0;border-radius:11px;cursor:pointer;line-height:1.5;transition:.15s}.opt:hover{border-color:#48659b}.sel{background:#245bd4;border-color:#4d7dff}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.btns button{min-height:48px}button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.submit-btn{grid-column:1/-1;background:linear-gradient(90deg,#2563eb,#4f46e5);font-size:15px}.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:15px}.pal button{background:#1b2534;border:1px solid #334158}.pal button.done{background:#15803d;border-color:#35d69a}.message{color:#fbbf24;line-height:1.6}.locked{text-align:center;padding:28px}.locked h2{margin-top:0}.result-link{display:inline-block;margin-top:10px;color:#8fa7ff;text-decoration:none;font-weight:800}.progress{color:var(--muted);font-size:12px;margin-top:4px}@media(max-width:520px){.header{padding:10px}.brand{font-size:12px}.wrap{width:calc(100% - 20px);padding-top:14px}.card{padding:15px;border-radius:15px}.question{font-size:16px}.pal{grid-template-columns:repeat(5,1fr)}.btns{position:sticky;bottom:8px;z-index:8;background:rgba(8,11,18,.94);padding:8px;border-radius:14px;backdrop-filter:blur(8px)}} </style></head><body><header class="header"><div class="head-left"><div class="brand">True Revise · Daily Live</div><b id="no">Loading...</b></div><div class="timer">⏱ <span id="time">--:--</span></div></header><main class="wrap"><div id="title" class="card title-card"><span class="live">● LIVE</span><h2>Loading...</h2><p>Checking today's test...</p></div><div id="box" class="card"><h3 id="q">Loading...</h3><div class="opt" id="A"></div><div class="opt" id="B"></div><div class="opt" id="C"></div><div class="opt" id="D"></div><div id="progress" class="progress"></div></div><div class="btns"><button id="prev">Previous</button><button id="next">Next</button><button id="submit" class="submit-btn">Submit Test</button></div><div id="pal" class="pal"></div></main><script type="module">import{auth,db}from'./firebase-config.js';import{doc,getDoc,setDoc,addDoc,collection}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);let qs=[],ans=[],i=0,left=0,timer,submitting=false,user=null,testData=null;const attemptId=()=>user&&id?`${user.uid}_${id}`:'';const norm=d=>{const o=d.options||{};return{...d,A:d.optionA??o.A??'',B:d.optionB??o.B??'',C:d.optionC??o.C??'',D:d.optionD??o.D??'',answer:d.answer??d.correctAnswer??''}};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function showLocked(message,link=false){$('box').innerHTML=`<div class="locked"><h2>✓ Attempt already used</h2><p class="message">${esc(message)}</p>${link?'<a class="result-link" href="student-results.html">View My Results →</a>':''}</div>`;document.querySelector('.btns').style.display='none';$('pal').style.display='none'}function formatTime(v){v=Math.max(0,v);return`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}function startTimer(){if(timer)clearInterval(timer);left=qs.length*60;$('time').textContent=formatTime(left);timer=setInterval(()=>{left--;$('time').textContent=formatTime(left);if(left<=0){clearInterval(timer);submit(true)}},1000)}function show(){if(!qs[i])return;$('no').textContent=`Question ${i+1} / ${qs.length}`;$('q').innerHTML=`<span class="qnum">${i+1}.</span>${esc(qs[i].question||'Question unavailable')}`;['A','B','C','D'].forEach(x=>{$(x).textContent=x+'. '+(qs[i][x]||'');$(x).classList.toggle('sel',ans[i]===x)});$('progress').textContent=`${ans.filter(Boolean).length} of ${qs.length} answered`;$('prev').disabled=!i;$('next').style.display=i===qs.length-1?'none':'block';$('submit').style.display=i===qs.length-1?'block':'block';$('submit').textContent=i===qs.length-1?'✓ Submit Test':'Submit Test';[...$('pal').children].forEach((b,n)=>b.classList.toggle('done',!!ans[n]))}function make(){ $('pal').innerHTML='';qs.forEach((_,n)=>{const b=document.createElement('button');b.textContent=n+1;b.setAttribute('aria-label',`Question ${n+1}`);b.onclick=()=>{i=n;show();window.scrollTo({top:0,behavior:'smooth'})};$('pal').appendChild(b)})}async function load(){try{if(!id)throw Error('Daily Live Test was not selected.');const s=await getDoc(doc(db,'dailyLiveTests',id));if(!s.exists())throw Error('Daily Live Test not found.');testData=s.data();const start=testData.publishedAt?.seconds?testData.publishedAt.seconds*1000:Date.parse(testData.publishedAt||0),end=start+86400000;if(!start||Date.now()>=end)throw Error('This Daily Live Test has expired.');$('title').innerHTML=`<span class="live">● LIVE · 24 HOURS</span><h2>${esc(testData.title||'Daily Live Test')}</h2><p>Ends ${new Date(end).toLocaleString()} · ${testData.questionIds?.length||0} questions</p>`;const existing=await getDoc(doc(db,'dailyAttempts',attemptId()));if(existing.exists()){showLocked('You have already attempted this Daily Live Test. Each Daily Live Test allows one attempt only.',true);return}const ds=await Promise.all((testData.questionIds||[]).map(x=>getDoc(doc(db,'questions',x))));qs=ds.filter(x=>x.exists()).map(x=>norm(x.data()));if(!qs.length)throw Error('No questions found.');ans=new Array(qs.length).fill('');make();show();startTimer()}catch(e){console.error(e);$('box').innerHTML=`<div class="locked"><h3>Unable to open this test</h3><p class="message">${esc(e.message||'Please try again.')}</p></div>`;document.querySelector('.btns').style.display='none';$('pal').style.display='none'}}['A','B','C','D'].forEach(x=>$(x).onclick=()=>{ans[i]=x;show()});$('prev').onclick=()=>{if(i){i--;show();window.scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(i<qs.length-1){i++;show();window.scrollTo({top:0,behavior:'smooth'})}};async function submit(auto=false){if(submitting)return;if(!auto&&!confirm('Submit this test now?'))return;submitting=true;if(timer)clearInterval(timer);if(!user){location.href='login.html?next='+encodeURIComponent(location.href);return}try{const attemptRef=doc(db,'dailyAttempts',attemptId());await setDoc(attemptRef,{uid:user.uid,liveTestId:id,submittedAt:new Date(),questionCount:qs.length},{merge:false});let score=0,correct=0,wrong=0,notAttempted=0;qs.forEach((q,n)=>{if(!ans[n])notAttempted++;else if(ans[n]===q.answer){correct++;score+=Number(q.marks||1)}else wrong++});const solutions=qs.map((q,n)=>({question:q.question||'',optionA:q.A||'',optionB:q.B||'',optionC:q.C||'',optionD:q.D||'',selectedAnswer:ans[n]||'',correctAnswer:q.answer||'',explanation:q.explanation||''}));const resultRef=await addDoc(collection(db,'results'),{uid:user.uid,email:user.email||'',name:user.displayName||'',title:testData?.title||'Daily Live Test',exam:testData?.exam||'',subject:testData?.subject||'',liveTestId:id,isDailyLive:true,score,totalQuestions:qs.length,correctCount:correct,wrongCount:wrong,notAttemptedCount:notAttempted,answers:ans,solutions,submittedAt:new Date()});try{await setDoc(doc(db,'dailyLiveLeaderboard',`${user.uid}_${id}`),{uid:user.uid,liveTestId:id,name:user.displayName||user.email?.split('@')[0]||'Student',score,totalQuestions:qs.length,correctCount:correct,wrongCount:wrong,notAttemptedCount:notAttempted,submittedAt:new Date()},{merge:false})}catch(le){console.warn('Leaderboard save failed',le)}location.href=`student-results.html?liveTestId=${encodeURIComponent(id)}&resultId=${encodeURIComponent(resultRef.id)}`}catch(e){console.error(e);submitting=false;if(e?.code==='permission-denied'){showLocked('Your attempt could not be saved because Firestore permissions rejected the request. Please check the Daily Live Test rules.',true)}else{$('box').innerHTML='<div class="locked"><p class="message">Could not save your attempt. Please check your internet connection and try again.</p></div>'}}}$('submit').onclick=()=>submit(false);onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}user=u;await load()});</script></body></html>
