<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Live Test</title><style>body{background:#111;color:#fff;font-family:Arial;margin:0}header{background:#1e3a8a;padding:15px;display:flex;justify-content:space-between}.wrap{padding:15px}.card{background:#222;padding:15px;border-radius:12px}.opt{background:#333;padding:13px;margin:9px 0;border-radius:9px;cursor:pointer}.sel{background:#2563eb}.btns{display:flex;gap:8px;margin-top:15px}.btns button{flex:1}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:12px}.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}.done{background:#15803d}</style></head><body><header><b id="no">Loading...</b><b>⏱ <span id="time">--:--</span></b></header><main class="wrap"><div id="title" class="card"></div><div id="box" class="card"><h3 id="q">Loading...</h3><div class="opt" id="A"></div><div class="opt" id="B"></div><div class="opt" id="C"></div><div class="opt" id="D"></div></div><div class="btns"><button id="prev">Previous</button><button id="next">Next</button><button id="submit" style="display:none">Submit</button></div><div id="pal" class="pal"></div></main><script type="module">import{auth,db}from'./firebase-config.js';import{doc,getDoc,addDoc,collection}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);let qs=[],ans=[],i=0,left=0,timer;const norm=d=>{const o=d.options||{};return{...d,A:d.optionA??o.A??'',B:d.optionB??o.B??'',C:d.optionC??o.C??'',D:d.optionD??o.D??'',answer:d.answer??d.correctAnswer??''}};async function load(){try{const s=await getDoc(doc(db,'dailyLiveTests',id));if(!s.exists())throw Error('Live test not found.');const t=s.data(),start=t.publishedAt?.seconds?t.publishedAt.seconds*1000:Date.parse(t.publishedAt||0),end=start+86400000;if(!start||Date.now()>=end)throw Error('This Daily Live Test has expired.');$('title').innerHTML=`<h2>⚡ ${t.title||'Daily Live Test'}</h2><p>Live until ${new Date(end).toLocaleString()} • ${t.questionIds?.length||0} questions</p>`;left=Math.floor((end-Date.now())/1000);const ds=await Promise.all((t.questionIds||[]).map(x=>getDoc(doc(db,'questions',x))));qs=ds.filter(x=>x.exists()).map(x=>norm(x.data()));if(!qs.length)throw Error('No questions found.');ans=new Array(qs.length).fill('');make();show();timer=setInterval(()=>{left--;let m=Math.floor(left/60),s=left%60;$('time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(left<=0){clearInterval(timer);submit(true)}},1000)}catch(e){$('box').innerHTML='<p>'+e.message+'</p>';document.querySelector('.btns').style.display='none'}}function show(){$('no').textContent=`Question ${i+1} / ${qs.length}`;$('q').textContent=qs[i].question;['A','B','C','D'].forEach(x=>{$(x).textContent=x+'. '+qs[i][x];$(x).classList.toggle('sel',ans[i]===x)});$('prev').disabled=!i;$('next').style.display=i===qs.length-1?'none':'block';$('submit').style.display=i===qs.length-1?'block':'none';[...$('pal').children].forEach((b,n)=>b.classList.toggle('done',!!ans[n]))}function make(){$('pal').innerHTML='';qs.forEach((_,n)=>{let b=document.createElement('button');b.textContent=n+1;b.onclick=()=>{i=n;show()};$('pal').appendChild(b)})}['A','B','C','D'].forEach(x=>$(x).onclick=()=>{ans[i]=x;show()});$('prev').onclick=()=>{if(i){i--;show()}};$('next').onclick=()=>{if(i<qs.length-1){i++;show()}};async function submit(auto){if(!auto&&!confirm('Submit this test now?'))return;clearInterval(timer);const user=auth.currentUser;if(!user){location.href='login.html';return}let score=0;qs.forEach((q,n)=>{if(ans[n]===q.answer)score+=Number(q.marks||1)});await addDoc(collection(db,'results'),{uid:user.uid,email:user.email||'',name:user.displayName||'',title:$('title').querySelector('h2').textContent.replace('⚡ ','').trim(),liveTestId:id,score,totalQuestions:qs.length,solutions:qs.map((q,n)=>({question:q.question,optionA:q.A,optionB:q.B,optionC:q.C,optionD:q.D,selectedAnswer:ans[n]||'',correctAnswer:q.answer,explanation:q.explanation||''})),submittedAt:new Date()});location.href='student-results.html'}$('submit').onclick=()=>submit(false);onAuthStateChanged(auth,u=>u?load():location.href='login.html');</script></body></html>
