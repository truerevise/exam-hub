<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#080b12;--panel:#111722;--line:#273244;--text:#f5f7fb;--muted:#9aa5b5;--blue:#3b6cff;--green:#35d69a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:82px}.header{background:#0a111d;border-bottom:1px solid var(--line);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;gap:10px}.head-left{display:flex;align-items:center;gap:12px;min-width:0}.brand{font-size:12px;font-weight:900;color:#aab9ff}.timer{font-weight:900;background:#172033;border:1px solid var(--line);padding:8px 11px;border-radius:999px;white-space:nowrap}.menu{background:transparent;border:0;color:#fff;font-size:27px;padding:2px 7px}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:18px 0}.card{background:linear-gradient(145deg,#111722,#0e141e);border:1px solid var(--line);padding:18px;border-radius:18px;margin-bottom:14px}.title-card h2{margin:0 0 7px}.title-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.live{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(53,214,154,.1);color:#62e3b1;font-size:10px;font-weight:900;margin-bottom:10px}.attempt{display:inline-block;margin-left:8px;padding:5px 9px;border-radius:999px;background:#182b52;color:#9ec0ff;font-size:10px;font-weight:900}.question-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.question{font-size:18px;line-height:1.65;margin:0 0 18px;font-weight:800}.qnum{color:#8fa7ff;margin-right:7px}.save-btn{border:1px solid #46546b;background:#202a39;color:#dbe5ff;border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:800;font-size:12px;white-space:nowrap}.save-btn.saved{background:#23385d;border-color:#5b8cff;color:#fff}.save-btn:disabled{opacity:.55;cursor:wait}.opt{background:#202a39;border:1px solid #2c384a;padding:13px;margin:9px 0;border-radius:11px;cursor:pointer;line-height:1.5}.opt.sel{background:#245bd4;border-color:#4d7dff}.progress{color:var(--muted);font-size:12px;margin-top:6px}.btns{position:fixed;bottom:0;left:0;right:0;background:rgba(8,11,18,.96);border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;z-index:15}.btns button{flex:1;min-height:48px;background:#222b38;color:#fff;border:1px solid #536176;border-radius:10px;font-weight:800}.btns #submit{background:#2563eb;border-color:#2563eb}#submit{display:none}.locked{text-align:center;padding:28px}.message{color:#fbbf24;line-height:1.6}.result-link{display:inline-block;margin-top:10px;color:#8fa7ff;text-decoration:none;font-weight:800}.drawer{display:none;position:fixed;inset:0;z-index:50}.drawer.show{display:block}.scrim{position:absolute;inset:0;background:#0009}.side{position:absolute;right:0;top:0;bottom:0;width:min(380px,88vw);background:#20252d;padding:18px;overflow:auto}.side-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #414854;padding-bottom:14px}.close{background:transparent;border:0;color:#fff;font-size:28px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;color:#cbd5e1;font-size:12px}.legend span{display:flex;align-items:center;gap:7px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid #9aa5b5;display:inline-block}.dot.answered{background:var(--blue);border-color:var(--blue)}.dot.current{box-shadow:0 0 0 2px #fff inset;border-color:var(--blue)}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.palette button{aspect-ratio:1;border-radius:50%;background:#242b35;border:2px solid #98a4b4;color:#fff;font-weight:800}.palette button.answered{background:var(--blue);border-color:var(--blue)}.palette button.current{box-shadow:0 0 0 2px #fff inset}.side-submit{width:100%;margin-top:22px;background:#8aa5b5;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:900}@media(max-width:520px){.wrap{width:calc(100% - 20px);padding-top:14px}.card{padding:15px}.question{font-size:16px}.palette{grid-template-columns:repeat(5,1fr)}.save-btn{padding:8px 9px;font-size:11px}}</style></head><body><header class="header"><div class="head-left"><div class="brand">True Revise · Daily Live</div><b id="no">Loading...</b><div class="timer">⏱ <span id="time">--:--</span></div></div><button id="menu" class="menu" aria-label="Question navigation">☰</button></header><main class="wrap"><div id="title" class="card title-card"><span class="live">● LIVE</span><h2>Loading...</h2><p>Checking today's test...</p></div><div id="box" class="card"><div class="question-head"><h3 id="q" class="question">Loading...</h3><button id="saveBtn" class="save-btn" type="button">🔖 Save</button></div><div class="opt" id="A"></div><div class="opt" id="B"></div><div class="opt" id="C"></div><div class="opt" id="D"></div><div id="progress" class="progress"></div></div></main><div class="btns"><button id="prev">← Previous</button><button id="next">Next →</button><button id="submit">✓ Submit Test</button></div><div id="drawer" class="drawer"><div id="scrim" class="scrim"></div><aside class="side"><div class="side-head"><div><b>Question Navigation</b><div id="sideInfo" style="color:#9aa5b5;font-size:12px;margin-top:4px"></div></div><button id="close" class="close">×</button></div><div class="legend"><span><i class="dot answered"></i> Answered</span><span><i class="dot"></i> Unanswered</span><span><i class="dot current"></i> Current</span></div><div id="pal" class="palette"></div><button id="sideSubmit" class="side-submit">SUBMIT TEST</button></aside></div><script type="module">
import{auth,db}from'./firebase-config.js';import{doc,getDoc,collection,runTransaction,query,where,getDocs,setDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);let qs=[],ans=[],i=0,left=0,timer,submitting=false,user=null,testData=null,allowedAttempts=1,usedAttempts=0,savedIds=new Set(),saving=false;const attemptId=()=>user&&id?`${user.uid}_${id}`:'';const norm=(d,qid)=>{const o=d.options||{};return{...d,id:qid,A:d.optionA??o.A??'',B:d.optionB??o.B??'',C:d.optionC??o.C??'',D:d.optionD??o.D??'',answer:d.answer??d.correctAnswer??''}};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function showLocked(message,link=false){$('box').innerHTML=`<div class="locked"><h2>✓ Attempt limit reached</h2><p class="message">${esc(message)}</p>${link?`<a class="result-link" href="daily-live-results.html?liveTestId=${encodeURIComponent(id)}">View Today's Result →</a>`:''}</div>`;document.querySelector('.btns').style.display='none';$('menu').style.display='none'}function formatTime(v){v=Math.max(0,v);return`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}function startTimer(){if(timer)clearInterval(timer);left=qs.length*60;$('time').textContent=formatTime(left);timer=setInterval(()=>{left--;$('time').textContent=formatTime(left);if(left<=0){clearInterval(timer);submit(true)}},1000)}function updatePalette(){[...$('pal').children].forEach((b,n)=>{b.classList.toggle('answered',!!ans[n]);b.classList.toggle('current',n===i)});$('sideInfo').textContent=`${ans.filter(Boolean).length} of ${qs.length} answered · Attempt ${usedAttempts+1} of ${allowedAttempts}`}function updateSaveButton(){const saved=savedIds.has(qs[i]?.id);$('saveBtn').classList.toggle('saved',saved);$('saveBtn').textContent=saved?'🔖 Saved':'🔖 Save';$('saveBtn').title=saved?'Remove from Saved Questions':'Save question'}async function loadSavedState(){try{const snap=await getDocs(query(collection(db,'savedQuestions'),where('uid','==',user.uid)));savedIds=new Set(snap.docs.map(d=>d.data().questionId).filter(Boolean))}catch(e){console.warn('Saved questions unavailable:',e.message);savedIds=new Set()}}function savedDocId(q){return`${user.uid}_${encodeURIComponent(q.id)}`}async function toggleSave(){const q=qs[i];if(!q||!user||saving)return;saving=true;$('saveBtn').disabled=true;const sid=savedDocId(q);try{if(savedIds.has(q.id)){await deleteDoc(doc(db,'savedQuestions',sid));savedIds.delete(q.id)}else{await setDoc(doc(db,'savedQuestions',sid),{uid:user.uid,questionId:q.id,question:q.question||'',options:{A:q.A||'',B:q.B||'',C:q.C||'',D:q.D||''},optionA:q.A||'',optionB:q.B||'',optionC:q.C||'',optionD:q.D||'',answer:q.answer||'',correctAnswer:q.answer||'',answerType:q.answerType||'SINGLE',marks:Number(q.marks??1),negativeMarks:Number(q.negativeMarks??0),explanation:q.explanation||'',exam:q.exam||testData?.exam||'',subject:q.subject||testData?.subject||'',tags:Array.isArray(q.tags)?q.tags:[],savedAt:serverTimestamp()},{merge:true});savedIds.add(q.id)}updateSaveButton()}catch(e){console.error(e);alert('Could not save this question. Please try again.')}finally{saving=false;$('saveBtn').disabled=false}}
async function resolveAttemptLimit(){const baseSnap=await getDoc(doc(db,'dailyLiveAccess',id));const userSnap=await getDoc(doc(db,'dailyLiveAccess',id,'users',user.uid));const studentSnap=await getDoc(doc(db,'students',user.uid));const base=baseSnap.exists()?baseSnap.data():{};const group=studentSnap.exists()?String(studentSnap.data().group||''):'';const userLimit=userSnap.exists()?Number(userSnap.data().attempts||0):0;const groupLimit=Number(base.groupAttempts?.[group]||0);allowedAttempts=userLimit>0?userLimit:(groupLimit>0?groupLimit:Number(base.allAttempts||1));allowedAttempts=Math.max(1,Math.min(50,allowedAttempts));const state=await getDoc(doc(db,'dailyAttempts',attemptId()));usedAttempts=state.exists()?Number(state.data().attemptsUsed||0):0}
function show(){if(!qs[i])return;$('no').textContent=`Question ${i+1} / ${qs.length}`;$('q').innerHTML=`<span class="qnum">${i+1}.</span>${esc(qs[i].question||'Question unavailable')}`;['A','B','C','D'].forEach(x=>{$(x).textContent=x+'. '+(qs[i][x]||'');$(x).classList.toggle('sel',ans[i]===x)});$('progress').textContent=`${ans.filter(Boolean).length} of ${qs.length} answered · Attempt ${usedAttempts+1} of ${allowedAttempts}`;$('prev').disabled=!i;$('next').style.display=i===qs.length-1?'none':'block';$('submit').style.display=i===qs.length-1?'block':'none';updatePalette();updateSaveButton()}function make(){$('pal').innerHTML='';qs.forEach((_,n)=>{const b=document.createElement('button');b.textContent=n+1;b.onclick=()=>{i=n;$('drawer').classList.remove('show');show();window.scrollTo({top:0,behavior:'smooth'})};$('pal').appendChild(b)});updatePalette()}
async function load(){try{if(!id)throw Error('Daily Live Test was not selected.');const s=await getDoc(doc(db,'dailyLiveTests',id));if(!s.exists())throw Error('Daily Live Test not found.');testData=s.data();const start=testData.publishedAt?.seconds?testData.publishedAt.seconds*1000:(testData.startAt?.seconds?testData.startAt.seconds*1000:Date.parse(testData.publishedAt||testData.startAt||0));const explicitEnd=testData.endAt?.seconds?testData.endAt.seconds*1000:Date.parse(testData.endAt||0);const end=explicitEnd||((start||Date.now())+86400000);if(start&&Date.now()<start)throw Error('This Daily Live Test has not started yet.');if(Date.now()>=end)throw Error('This Daily Live Test has expired.');await resolveAttemptLimit();$('title').innerHTML=`<span class="live">● LIVE · 24 HOURS</span><span class="attempt">Attempt ${Math.min(usedAttempts+1,allowedAttempts)} of ${allowedAttempts}</span><h2>${esc(testData.title||'Daily Live Test')}</h2><p>Ends ${new Date(end).toLocaleString()} · ${testData.questionIds?.length||0} questions</p>`;if(usedAttempts>=allowedAttempts){showLocked(`You have used all ${allowedAttempts} allowed attempt${allowedAttempts===1?'':'s'} for this Daily Live Test.`,true);return}const ds=await Promise.all((testData.questionIds||[]).map(x=>getDoc(doc(db,'questions',x))));qs=ds.filter(x=>x.exists()).map(x=>norm(x.data(),x.id));if(!qs.length)throw Error('No questions found.');ans=new Array(qs.length).fill('');await loadSavedState();make();show();startTimer()}catch(e){console.error(e);$('box').innerHTML=`<div class="locked"><h3>Unable to open this test</h3><p class="message">${esc(e.message||'Please try again.')}</p></div>`;document.querySelector('.btns').style.display='none';$('menu').style.display='none'}}
['A','B','C','D'].forEach(x=>$(x).onclick=()=>{ans[i]=x;show()});$('saveBtn').onclick=toggleSave;$('prev').onclick=()=>{if(i){i--;show();window.scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(i<qs.length-1){i++;show();window.scrollTo({top:0,behavior:'smooth'})}};$('menu').onclick=()=>$('drawer').classList.add('show');$('close').onclick=()=>$('drawer').classList.remove('show');$('scrim').onclick=()=>$('drawer').classList.remove('show');$('sideSubmit').onclick=()=>submit(false);async function submit(auto=false){if(submitting)return;if(!auto&&!confirm('Submit this test now?'))return;submitting=true;if(timer)clearInterval(timer);if(!user){location.href='login.html?next='+encodeURIComponent(location.href);return}try{let score=0,correct=0,wrong=0,notAttempted=0;qs.forEach((q,n)=>{if(!ans[n])notAttempted++;else if(String(ans[n]).trim().toUpperCase()===String(q.answer||'').trim().toUpperCase()){correct++;score+=Number(q.marks??1)}else{wrong++;score-=Number(q.negativeMarks??0)}});const solutions=qs.map((q,n)=>({question:q.question||'',optionA:q.A||'',optionB:q.B||'',optionC:q.C||'',optionD:q.D||'',selectedAnswer:ans[n]||'',correctAnswer:q.answer||'',answerType:q.answerType||'SINGLE',marks:Number(q.marks??1),negativeMarks:Number(q.negativeMarks??0),explanation:q.explanation||''}));const attemptRef=doc(db,'dailyAttempts',attemptId()),resultRef=doc(collection(db,'results')),leaderRef=doc(db,'dailyLiveLeaderboard',`${user.uid}_${id}`);await runTransaction(db,async tx=>{const state=await tx.get(attemptRef);const leader=await tx.get(leaderRef);const latestUsed=state.exists()?Number(state.data().attemptsUsed||0):0;if(latestUsed>=allowedAttempts)throw Error('Your allowed attempt limit has already been reached. Please refresh the page.');const attemptNo=latestUsed+1;tx.set(attemptRef,{uid:user.uid,liveTestId:id,attemptsUsed:attemptNo,lastAttemptAt:new Date(),questionCount:qs.length},{merge:false});tx.set(resultRef,{uid:user.uid,email:user.email||'',name:user.displayName||'',title:testData?.title||'Daily Live Test',exam:testData?.exam||'',subject:testData?.subject||'',liveTestId:id,isDailyLive:true,attemptNo,score,totalQuestions:qs.length,correctCount:correct,wrongCount:wrong,notAttemptedCount:notAttempted,answers:ans,solutions,submittedAt:new Date()});const oldScore=leader.exists()?Number(leader.data().score||-Infinity):-Infinity;if(!leader.exists()||score>=oldScore)tx.set(leaderRef,{uid:user.uid,liveTestId:id,name:user.displayName||user.email?.split('@')[0]||'Student',score,totalQuestions:qs.length,correctCount:correct,wrongCount:wrong,notAttemptedCount:notAttempted,attemptNo,submittedAt:new Date()},{merge:false})});location.href=`daily-live-results.html?liveTestId=${encodeURIComponent(id)}&resultId=${encodeURIComponent(resultRef.id)}`}catch(e){console.error(e);submitting=false;if(e?.code==='permission-denied')showLocked('Your attempt could not be saved because Firestore permissions rejected the request.',true);else{$('box').innerHTML=`<div class="locked"><p class="message">${esc(e.message||'Could not save your attempt. Please try again.')}</p></div>`}}}$('submit').onclick=()=>submit(false);onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}user=u;await load()});</script><script type="module" src="./question-report.js"></script></body></html>
