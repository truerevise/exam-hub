<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow,noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Bank Health | True Revise Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#eef2ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed)}h1{margin:0;font-size:22px}.muted{color:#91a0b8;font-size:12px;line-height:1.5}.card{background:#101827;border:1px solid #29344a;border-radius:18px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0c1421;border:1px solid #29344a;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:#8390a6}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,select{border:1px solid #34415b;background:#182238;color:#dbe5ff;border-radius:10px;padding:10px 13px;font-weight:800}.btn{cursor:pointer}.primary{background:#2563eb;border-color:#2563eb;color:#fff}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid #29344a;border-radius:12px;background:#0c1421}.bad{border-color:#6b2936}.warn{border-color:#705a1c}.pill{display:inline-block;border-radius:999px;padding:5px 8px;background:#222d40;color:#b9c8df;font-size:10px;font-weight:900;margin-right:5px}.bad .pill{background:#3b1821;color:#ffabb9}.warn .pill{background:#3a2d0d;color:#f7d36a}.issue{font-size:12px;font-weight:800;margin:7px 0}.meta{font-size:10px;color:#8492aa;line-height:1.5}.empty{text-align:center;padding:35px;color:#8f9bb5;border:1px dashed #344258;border-radius:12px}.loading{text-align:center;padding:35px;color:#9aa7bc}.ok{color:#85e3b0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Question Bank Health</h1><div class="muted">Quick quality-control scan for missing data, malformed questions and likely duplicates.</div></div></div><button class="btn" onclick="location.href='admin-dashboard.html'">← Admin Dashboard</button></header><section class="card"><div class="toolbar"><select id="scope"><option value="all">All exams</option></select><select id="filter"><option value="issues">Issues only</option><option value="all">All scanned questions</option></select><button class="btn primary" id="scan">🔎 Run Health Scan</button></div><div id="stats" class="grid" style="margin-top:12px"><div class="stat"><b>—</b><span>SCANNED</span></div><div class="stat"><b>—</b><span>ISSUES</span></div><div class="stat"><b>—</b><span>MISSING OPTIONS</span></div><div class="stat"><b>—</b><span>MISSING ANSWERS</span></div></div></section><section class="card"><div id="list"><div class="loading">Run a scan to check the question bank.</div></div></section></main><script type="module">import{auth,db,isSuperAdmin}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id);let rows=[],issues=[];const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));function option(o,k){return o&&String(o[k]??'').trim()};function analyse(q){const o=q.options||{};const missing=[];for(const k of ['A','B','C','D'])if(!option(o,k))missing.push(k);const answer=String(q.answer??q.correctAnswer??q.correct??'').trim();const text=String(q.question??'').trim();const out=[];if(!text)out.push('Question text is empty');if(missing.length)out.push('Missing option(s): '+missing.join(', '));if(!answer)out.push('Correct answer is missing');if(answer&&!['A','B','C','D'].includes(answer.toUpperCase()))out.push('Answer is not A/B/C/D');if(/(?:^|\s)(?:\(A\)|A[.)]).*(?:\(B\)|B[.)]).*(?:\(C\)|C[.)]).*(?:\(D\)|D[.)])/is.test(text))out.push('Question text appears to contain embedded A–D options');if(q.image||q.questionImage||q.imageUrl){const u=q.image||q.questionImage||q.imageUrl;if(!/^https?:\/\//i.test(String(u)))out.push('Question image URL may be invalid')}return out}function populateExams(){const names=[...new Set(rows.map(r=>String(r.exam||'').trim()).filter(Boolean))].sort();$('scope').innerHTML='<option value="all">All exams</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}function render(){const exam=$('scope').value,mode=$('filter').value;const shown=issues.filter(x=>(exam==='all'||x.row.exam===exam)&&(mode==='all'||x.problems.length));$('list').innerHTML=shown.length?`<div class="list">${shown.map(x=>`<article class="item ${x.problems.some(p=>p.includes('Missing'))?'bad':'warn'}"><span class="pill">${esc(x.row.exam||'No exam')}</span><span class="pill">ID: ${esc(x.row.id)}</span><div class="issue">${x.problems.map(esc).join(' • ')}</div><div class="meta">${esc(String(x.row.question||'').slice(0,260))}${String(x.row.question||'').length>260?'…':''}</div></article>`).join('')}</div>`:'<div class="empty"><span class="ok">✓</span> No issues match the current filter.</div>'}async function scan(){ $('scan').disabled=true;$('list').innerHTML='<div class="loading">Scanning question bank…</div>';try{const s=await getDocs(collection(db,'questions'));rows=s.docs.map(d=>({id:d.id,...d.data()}));populateExams();issues=rows.map(row=>({row,problems:analyse(row)})).filter(x=>x.problems.length);const missingOptions=issues.filter(x=>x.problems.some(p=>p.startsWith('Missing option'))).length;const missingAnswers=issues.filter(x=>x.problems.some(p=>p.includes('answer'))).length;$('stats').innerHTML=`<div class="stat"><b>${rows.length}</b><span>SCANNED</span></div><div class="stat"><b>${issues.length}</b><span>ISSUES</span></div><div class="stat"><b>${missingOptions}</b><span>MISSING OPTIONS</span></div><div class="stat"><b>${missingAnswers}</b><span>MISSING ANSWERS</span></div>`;render()}catch(e){$('list').innerHTML=`<div class="empty">Unable to scan: ${esc(e.message)}</div>`}finally{$('scan').disabled=false}}$('scan').onclick=scan;['scope','filter'].forEach(id=>$(id).onchange=render);onAuthStateChanged(auth,u=>{if(!u||!isSuperAdmin(u)){location.replace('admin.html');return}});</script></body></html>
