<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Exam Hub</title>
<style>
body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;min-height:100vh;padding:20px;box-sizing:border-box}.container{width:min(500px,100%);margin:30px auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top a{color:#60a5fa;text-decoration:none}.card{background:#171a21;border:1px solid #2b3240;border-radius:18px;padding:24px}.avatar{width:72px;height:72px;border-radius:50%;background:#2563eb;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 12px}.title{text-align:center;color:#60a5fa}.label{display:block;color:#9aa4b2;font-size:13px;margin-top:14px;margin-bottom:6px}input{width:100%;padding:13px;background:#1e232d;color:#fff;border:1px solid #394354;border-radius:9px;box-sizing:border-box}input[disabled]{opacity:.7}button{width:100%;padding:13px;margin-top:18px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.secondary{background:#3f1d24;color:#fca5a5}.message{text-align:center;min-height:20px;margin-top:12px}.loading{text-align:center;color:#9aa4b2}
</style>
</head>
<body>
<div class="container">
<div class="top"><a href="dashboard.html">← Dashboard</a></div>
<div class="card">
<div id="avatar" class="avatar">?</div><h2 class="title">My Profile</h2>
<p id="loading" class="loading">Loading profile...</p>
<div id="form" style="display:none">
<label class="label">Full Name</label><input id="name" type="text" placeholder="Full Name">
<label class="label">Email Address</label><input id="email" type="email" disabled>
<label class="label">Mobile Number</label><input id="mobile" type="tel" placeholder="Mobile Number">
<button id="saveBtn">Save Profile</button>
<button id="logoutBtn" class="secondary">Logout</button>
<p id="message" class="message"></p>
</div>
</div></div>
<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const nameEl=document.getElementById("name"),emailEl=document.getElementById("email"),mobileEl=document.getElementById("mobile"),avatar=document.getElementById("avatar"),loading=document.getElementById("loading"),form=document.getElementById("form"),message=document.getElementById("message");
onAuthStateChanged(auth,async user=>{if(!user){location.href="login.html";return;}emailEl.value=user.email||"";try{const snap=await getDoc(doc(db,"students",user.uid));const data=snap.exists()?snap.data():{};nameEl.value=data.name||user.displayName||"";mobileEl.value=data.mobile||"";avatar.textContent=(nameEl.value||user.email||"?").charAt(0).toUpperCase();}catch(e){message.textContent="Could not load profile details.";message.style.color="#fca5a5";}loading.style.display="none";form.style.display="block";});
document.getElementById("saveBtn").addEventListener("click",async()=>{const user=auth.currentUser;if(!user)return;const name=nameEl.value.trim(),mobile=mobileEl.value.trim();if(!name){message.textContent="Please enter your name.";message.style.color="#fca5a5";return;}try{await setDoc(doc(db,"students",user.uid),{name,email:user.email||"",mobile},{merge:true});message.style.color="#86efac";message.textContent="Profile updated successfully.";avatar.textContent=name.charAt(0).toUpperCase();}catch(e){message.style.color="#fca5a5";message.textContent="Unable to save profile.";}});
document.getElementById("logoutBtn").addEventListener("click",async()=>{await signOut(auth);location.href="index.html";});
</script>
</body>
</html>
