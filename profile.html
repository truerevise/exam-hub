<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>*{box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;background:#0f1115;color:#fff;margin:0;min-height:100vh;padding:16px}.container{width:min(500px,100%);margin:20px auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top a{color:#60a5fa;text-decoration:none}.card{background:#171a21;border:1px solid #2b3240;border-radius:18px;padding:24px}.avatar{width:72px;height:72px;border-radius:50%;background:#2563eb;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 12px}.title{text-align:center;color:#60a5fa}.label{display:block;color:#9aa4b2;font-size:13px;margin-top:14px;margin-bottom:6px}input{width:100%;padding:13px;background:#1e232d;color:#fff;border:1px solid #394354;border-radius:9px}input[disabled]{opacity:.7}.verify{color:#86efac;font-size:12px;margin-top:6px}button{width:100%;padding:13px;margin-top:18px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.secondary{background:#3f1d24;color:#fca5a5}.message{text-align:center;min-height:20px;margin-top:12px}.loading{text-align:center;color:#9aa4b2}@media(max-width:520px){.container{margin:8px auto}.card{padding:18px}.avatar{width:64px;height:64px;font-size:27px}}</style></head><body><div class="container"><div class="top"><a href="dashboard.html">← Dashboard</a></div><div class="card"><div id="avatar" class="avatar">?</div><h2 class="title">My Profile</h2><p id="loading" class="loading">Loading profile...</p><div id="form" style="display:none"><label class="label">Full Name</label><input id="name" type="text" placeholder="Full Name" autocomplete="name"><label class="label">Email Address</label><input id="email" type="email" disabled><div id="emailVerify" class="verify">✓ Verified email</div><label class="label">Mobile Number</label><input id="mobile" type="tel" disabled><div id="phoneVerify" class="verify">✓ Verified mobile number</div><button id="saveBtn">Save Name</button><button id="logoutBtn" class="secondary">Logout</button><p id="message" class="message"></p></div></div></div>
<script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id),nameEl=$('name'),emailEl=$('email'),mobileEl=$('mobile'),avatar=$('avatar'),loading=$('loading'),form=$('form'),message=$('message');async function loadSettings(){try{const s=await getDoc(doc(db,'appSettings','site'));const d=s.exists()?s.data():{};return{emailRequired:d.emailVerificationRequired===true,mobileRequired:d.mobileVerificationRequired===true}}catch(_){return{emailRequired:false,mobileRequired:false}}}onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html';return}try{const settings=await loadSettings();await user.reload();if((settings.emailRequired&&!user.emailVerified)||(settings.mobileRequired&&!user.phoneNumber)){location.href='verify-account.html';return}emailEl.value=user.email||'';mobileEl.value=user.phoneNumber||'';const snap=await getDoc(doc(db,'students',user.uid)),data=snap.exists()?snap.data():{};nameEl.value=data.name||user.displayName||'';avatar.textContent=(nameEl.value||user.email||'?').charAt(0).toUpperCase();$('emailVerify').style.display=settings.emailRequired?'block':'none';$('phoneVerify').style.display=settings.mobileRequired?'block':'none';loading.style.display='none';form.style.display='block'}catch(e){message.textContent='Could not load profile details.';message.style.color='#fca5a5';loading.style.display='none';form.style.display='block'}});$('saveBtn').onclick=async()=>{const user=auth.currentUser;if(!user)return;const name=nameEl.value.trim();if(!name){message.textContent='Please enter your name.';message.style.color='#fca5a5';return}try{await setDoc(doc(db,'students',user.uid),{name},{merge:true});message.style.color='#86efac';message.textContent='Profile updated successfully.';avatar.textContent=name.charAt(0).toUpperCase()}catch(e){message.style.color='#fca5a5';message.textContent='Unable to save profile.'}};$('logoutBtn').onclick=async()=>{await signOut(auth);location.href='index.html'};</script></body></html>
