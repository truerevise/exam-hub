<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Exam Hub | Students</title>
<link rel="stylesheet" href="css/style.css">
<style>
.page{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:26px;font-weight:800}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2962ff;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#30343b}.card{background:#1f1f1f;border:1px solid #333;border-radius:16px;padding:16px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{display:block;font-size:25px}.muted{color:#aaa}.search{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#171717;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #333}th{color:#aaa;font-size:13px}tr:hover{background:#252525}.msg{padding:12px;border-radius:10px;margin-top:12px}.error{background:#3a171d;color:#ff9ca8}.ok{color:#77e0a8}.back{color:#7db0ff;text-decoration:none}@media(max-width:650px){.page{padding:12px}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="title">👥 Students</div></div>
    <div class="actions"><button class="btn secondary" id="refreshBtn">Refresh</button><button class="btn" id="logoutBtn">Logout</button></div>
  </div>
  <div class="stats">
    <div class="card"><span class="muted">Registered Students</span><strong id="count">—</strong></div>
    <div class="card"><span class="muted">With Mobile</span><strong id="mobileCount">—</strong></div>
    <div class="card"><span class="muted">With Name</span><strong id="nameCount">—</strong></div>
  </div>
  <div class="card">
    <input id="search" class="search" placeholder="Search by name, email or mobile...">
    <div id="message"></div>
  </div>
  <div class="card table-wrap">
    <table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Mobile</th><th>Student ID</th></tr></thead><tbody id="studentsBody"><tr><td colspan="5" class="muted">Loading students...</td></tr></tbody></table>
  </div>
</div>
<script type="module">
import {auth,db} from './firebase-config.js';
import {onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
import {collection,getDocs} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
const ADMIN_EMAIL='kiransingh.smile@gmail.com'.toLowerCase();
const body=document.getElementById('studentsBody'),search=document.getElementById('search'),message=document.getElementById('message');
let students=[];
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function render(){const q=search.value.trim().toLowerCase();const rows=students.filter(s=>[s.name,s.email,s.mobile,s.id].some(v=>String(v??'').toLowerCase().includes(q)));if(!rows.length){body.innerHTML='<tr><td colspan="5" class="muted">No students found.</td></tr>';return;}body.innerHTML=rows.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name||'—')}</td><td>${esc(s.email||'—')}</td><td>${esc(s.mobile||'—')}</td><td title="${esc(s.id)}">${esc(s.id||'—')}</td></tr>`).join('');}
async function load(){body.innerHTML='<tr><td colspan="5" class="muted">Loading students...</td></tr>';message.innerHTML='';try{const snap=await getDocs(collection(db,'students'));students=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));document.getElementById('count').textContent=students.length;document.getElementById('mobileCount').textContent=students.filter(s=>s.mobile).length;document.getElementById('nameCount').textContent=students.filter(s=>s.name).length;render();}catch(e){console.error(e);body.innerHTML='<tr><td colspan="5" class="muted">Unable to load students.</td></tr>';message.innerHTML='<div class="msg error">Firebase could not read the students collection. Check Firestore rules if this message remains.</div>';}}
onAuthStateChanged(auth,user=>{if(!user||!user.email||user.email.toLowerCase()!==ADMIN_EMAIL){location.replace('admin.html');return;}load();});
search.addEventListener('input',render);document.getElementById('refreshBtn').addEventListener('click',load);document.getElementById('logoutBtn').addEventListener('click',async()=>{await signOut(auth);location.replace('admin.html');});
</script>
</body>
</html>
