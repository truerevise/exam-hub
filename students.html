<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam Hub | Students</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.back{color:#8fb5ff;text-decoration:none}.title{font-size:27px;font-weight:800;margin-top:5px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800}.secondary{background:#182238;border:1px solid #31405d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#12192b;border:1px solid #263149;border-radius:17px;padding:16px;margin-bottom:15px}.stat span{color:#8f9bb5;font-size:13px}.stat strong{display:block;font-size:27px;margin-top:6px}.search{width:100%;padding:13px;border-radius:11px;border:1px solid #34415b;background:#0f1627;color:#fff;outline:0}.search:focus{border-color:#4f7edb}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px;border-bottom:1px solid #29344a}th{color:#8290aa;font-size:12px;text-transform:uppercase}tr:hover{background:#172036}.muted{color:#8f9bb5}.error{color:#ff9aa7;background:#351923;padding:12px;border-radius:10px;margin-top:12px}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="title">👥 Students</div></div><div class="actions"><button class="btn secondary" id="refresh">Refresh</button><button class="btn" id="logout">Logout</button></div></div><section class="stats"><div class="card stat"><span>Registered Students</span><strong id="count">—</strong></div><div class="card stat"><span>With Mobile</span><strong id="mobile">—</strong></div><div class="card stat"><span>With Name</span><strong id="names">—</strong></div></section><section class="card"><input id="search" class="search" placeholder="🔎 Search name, email or mobile..."><div id="message"></div></section><section class="card table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Mobile</th><th>Student ID</th></tr></thead><tbody id="body"><tr><td colspan="5" class="muted">Loading students...</td></tr></tbody></table></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const $=id=>document.getElementById(id);let students=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('search').value.toLowerCase();const r=students.filter(s=>[s.name,s.email,s.mobile,s.id].some(v=>String(v??'').toLowerCase().includes(q)));$('body').innerHTML=r.length?r.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name||'—')}</td><td>${esc(s.email||'—')}</td><td>${esc(s.mobile||'—')}</td><td>${esc(s.id||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No students found.</td></tr>'}async function load(){try{const snap=await getDocs(collection(db,'students'));students=snap.docs.map(d=>({id:d.id,...d.data()}));$('count').textContent=students.length;$('mobile').textContent=students.filter(s=>s.mobile).length;$('names').textContent=students.filter(s=>s.name).length;render()}catch(e){console.error(e);$('body').innerHTML='<tr><td colspan="5" class="muted">Unable to load students.</td></tr>';$('message').innerHTML='<div class="error">Could not read students from Firebase. Check Firestore rules.</div>'}}onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()===ADMIN.toLowerCase())load();else location.replace('admin.html')});$('search').oninput=render;$('refresh').onclick=load;$('logout').onclick=async()=>{await signOut(auth);location.replace('admin.html')};</script></body></html>
