<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eef2ff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.back{color:#78aaff;text-decoration:none}.title{font-size:28px;font-weight:800;margin-top:6px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#182238;border:1px solid #31405d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#101827;border:1px solid #263149;border-radius:18px;padding:16px;margin-bottom:15px}.stat span{color:#8f9bb5;font-size:13px}.stat strong{display:block;font-size:26px;margin-top:6px}.search{width:100%;padding:13px;border-radius:11px;border:1px solid #34415b;background:#0b1220;color:#fff;outline:0}.search:focus{border-color:#4f7edb}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:13px;border-bottom:1px solid #29344a;vertical-align:middle}th{color:#8290aa;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:hover{background:#141e31}.muted{color:#8f9bb5}.pass{display:flex;align-items:center;gap:8px;min-width:180px}.pass-dot{width:8px;height:8px;border-radius:50%;background:#64748b}.pass-dot.active{background:#4ade80;box-shadow:0 0 9px #4ade80}.pass-text{font-size:12px}.active-text{color:#86efac}.no-pass{color:#94a3b8}.grant{background:#2563eb;padding:8px 10px;border-radius:9px;border:0;color:#fff;font-weight:800;cursor:pointer}.revoke{background:#351923;border:1px solid #713042;color:#ff9eac;padding:8px 10px;border-radius:9px;font-weight:800;cursor:pointer}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.error{color:#ff9aa7;background:#351923;padding:12px;border-radius:10px;margin-top:12px}.ok{color:#86efac;background:#10281d;padding:10px;border-radius:10px;margin-top:12px}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(430px,100%);background:#101827;border:1px solid #33415d;border-radius:20px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.45)}.modal h3{margin:0 0 7px}.modal p{color:#9aa7bd;font-size:13px}.modal label{display:block;color:#9aa7bd;font-size:12px;margin:15px 0 7px}.modal select,.modal input{width:100%;padding:12px;border-radius:10px;border:1px solid #34415b;background:#0b1220;color:#fff}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions button{flex:1}.hidden{display:none}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:500px){.wrap{padding:13px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.stats{grid-template-columns:1fr 1fr}.title{font-size:24px}}
</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="title">👥 Student Management</div></div><div class="actions"><button class="btn secondary" id="refresh">Refresh</button><button class="btn" id="logout">Logout</button></div></div><section class="stats"><div class="card stat"><span>Registered Students</span><strong id="count">—</strong></div><div class="card stat"><span>With Mobile</span><strong id="mobile">—</strong></div><div class="card stat"><span>With Name</span><strong id="names">—</strong></div><div class="card stat"><span>Active Premium</span><strong id="premium">—</strong></div></section><section class="card"><input id="search" class="search" placeholder="🔎 Search name, email, mobile or student ID..."><div id="message"></div></section><section class="card table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Mobile</th><th>Student ID</th><th>Premium Status</th><th>Admin Access</th></tr></thead><tbody id="body"><tr><td colspan="7" class="muted">Loading students...</td></tr></tbody></table></section></main><div class="modal-bg" id="modalBg"><div class="modal"><h3 id="modalTitle">Give Premium Pass</h3><p id="modalStudent"></p><label>Validity</label><select id="duration"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="180">180 days</option><option value="365">1 year</option><option value="custom">Custom</option></select><div id="customBox" class="hidden"><label>Custom validity (days)</label><input id="customDays" type="number" min="1" max="3650" placeholder="Enter number of days"></div><div class="modal-actions"><button class="btn secondary" id="cancelModal">Cancel</button><button class="btn" id="confirmPass">Give / Extend Pass</button></div></div></div><script type="module">const SUPER_ADMINS=['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com'];function isSuperAdmin(u){return !!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()));}import{auth,db}from'./firebase-config.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,doc,updateDoc,Timestamp,deleteField}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const $=id=>document.getElementById(id);let students=[];let selectedStudent=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function getExpiry(s){const v=s.premiumUntil;if(!v)return null;if(typeof v.toDate==='function')return v.toDate();if(v instanceof Date)return v;if(typeof v==='number')return new Date(v);if(typeof v==='string'){const d=new Date(v);return isNaN(d)?null:d}return null}function isActive(s){const d=getExpiry(s);return d&&d.getTime()>Date.now()}function formatDate(d){return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):''}function render(){const q=$('search').value.toLowerCase().trim();const r=students.filter(s=>[s.name,s.email,s.mobile,s.id].some(v=>String(v??'').toLowerCase().includes(q)));$('body').innerHTML=r.length?r.map((s,i)=>{const active=isActive(s),expiry=getExpiry(s);return `<tr><td>${i+1}</td><td><b>${esc(s.name||'—')}</b></td><td>${esc(s.email||'—')}</td><td>${esc(s.mobile||'—')}</td><td>${esc(s.id||'—')}</td><td><div class="pass"><span class="pass-dot ${active?'active':''}"></span><div class="pass-text ${active?'active-text':'no-pass'}">${active?'Active until '+formatDate(expiry):'No active pass'}</div></div></td><td><div class="row-actions"><button class="grant" data-grant="${esc(s.id)}">${active?'Extend Pass':'Give Pass'}</button>${active?`<button class="revoke" data-revoke="${esc(s.id)}">Revoke</button>`:''}</div></td></tr>`}).join(''):'<tr><td colspan="7" class="muted">No students found.</td></tr>';$('premium').textContent=students.filter(isActive).length;document.querySelectorAll('[data-grant]').forEach(b=>b.onclick=()=>openModal(b.dataset.grant));document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>revokePass(b.dataset.revoke))}async function load(){try{const snap=await getDocs(collection(db,'students'));students=snap.docs.map(d=>({id:d.id,...d.data()}));$('count').textContent=students.length;$('mobile').textContent=students.filter(s=>s.mobile).length;$('names').textContent=students.filter(s=>s.name).length;render()}catch(e){console.error(e);$('body').innerHTML='<tr><td colspan="7" class="muted">Unable to load students.</td></tr>';$('message').innerHTML='<div class="error">Could not read students from Firebase. Check Firestore rules.</div>'}}function openModal(id){selectedStudent=students.find(s=>s.id===id);if(!selectedStudent)return;$('modalTitle').textContent=isActive(selectedStudent)?'Extend Premium Pass':'Give Premium Pass';$('modalStudent').textContent=(selectedStudent.name||'Student')+' • '+(selectedStudent.email||selectedStudent.id);$('duration').value='30';$('customBox').classList.add('hidden');$('modalBg').style.display='flex'}async function confirmPass(){if(!selectedStudent)return;let days=$('duration').value==='custom'?Number($('customDays').value):Number($('duration').value);if(!Number.isFinite(days)||days<1){alert('Enter a valid number of days.');return}const old=getExpiry(selectedStudent);const base=old&&old.getTime()>Date.now()?old:new Date();const expiry=new Date(base.getTime()+days*86400000);try{await updateDoc(doc(db,'students',selectedStudent.id),{premiumUntil:Timestamp.fromDate(expiry),premiumGrantedBy:auth.currentUser?.email||'',premiumGrantedAt:Timestamp.now()});$('message').innerHTML='<div class="ok">✓ Premium Pass updated successfully.</div>';$('modalBg').style.display='none';selectedStudent=null;await load()}catch(e){console.error(e);$('message').innerHTML='<div class="error">Unable to update Premium Pass. Check Firebase permissions.</div>'}}async function revokePass(id){const s=students.find(x=>x.id===id);if(!s)return;if(!confirm(`Revoke Premium Pass for ${s.name||s.email||'this student'}?`))return;try{await updateDoc(doc(db,'students',id),{premiumUntil:deleteField(),premiumGrantedBy:deleteField(),premiumGrantedAt:deleteField()});$('message').innerHTML='<div class="ok">✓ Premium Pass revoked.</div>';await load()}catch(e){console.error(e);$('message').innerHTML='<div class="error">Unable to revoke Premium Pass. Check Firebase permissions.</div>'}}onAuthStateChanged(auth,u=>{if(isSuperAdmin(u))load();else location.replace('admin.html')});$('search').oninput=render;$('refresh').onclick=load;$('logout').onclick=async()=>{await signOut(auth);location.replace('admin.html')};$('duration').onchange=()=>{if($('duration').value==='custom')$('customBox').classList.remove('hidden');else $('customBox').classList.add('hidden')};$('cancelModal').onclick=()=>{$('modalBg').style.display='none';selectedStudent=null};$('confirmPass').onclick=confirmPass;$('modalBg').onclick=e=>{if(e.target===$('modalBg')){$('modalBg').style.display='none';selectedStudent=null}};</script></body></html>
