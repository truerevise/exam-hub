<style>
:root{--bg:#0b0f17;--panel:#171d27;--line:#303b4b;--text:#f5f7fb;--muted:#9ba7b8;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh;padding-bottom:82px}.header{background:#121a29;border-bottom:1px solid var(--line);padding:10px 13px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.head-left{display:flex;align-items:center;gap:12px}.question-no{font-weight:900}.timer{color:#cbd5e1}.menu-btn{background:transparent;color:#fff;border:0;font-size:28px;padding:3px 7px;cursor:pointer}.lang-wrap{position:relative}.lang-btn{background:#fff;color:#111;border:0;border-radius:999px;padding:8px 11px;font-weight:900;font-size:12px}.lang-menu{position:absolute;right:0;top:43px;display:none;background:#fff;border-radius:12px;padding:6px;min-width:190px;box-shadow:0 12px 30px #0008}.lang-menu.show{display:block}.lang-menu button{display:block;width:100%;text-align:left;border:0;background:#fff;color:#111;padding:10px;border-radius:8px}.container{padding:15px;max-width:900px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);padding:17px;border-radius:15px}.question-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:17px}.question-text{font-size:18px;line-height:1.6;margin:0;font-weight:800}.save-btn{border:1px solid #46546b;background:#202a39;color:#dbe5ff;border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:800;font-size:12px}.save-btn.saved{background:#23385d;border-color:#5b8cff}.save-btn:disabled{opacity:.55}.option{background:#303844;border:1px solid #3b4656;padding:13px;margin:10px 0;border-radius:10px;cursor:pointer;line-height:1.5}.option.selected{background:#2563eb;border-color:#6194ff}.option-content{display:flex;flex-direction:column;gap:10px}.option-image,.question-image{display:block;max-width:100%;max-height:300px;width:auto;height:auto;object-fit:contain;border-radius:8px;background:#fff;padding:8px;border:1px solid #596579;margin-top:8px}.buttons{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,22,.96);border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;z-index:30}.buttons button{flex:1;min-height:48px;background:#222b38;color:#fff;border:1px solid #536176;border-radius:10px;font-weight:800}.buttons #submitBtn{background:#2563eb;border-color:#2563eb}.buttons button:disabled{opacity:.45}.translate-status{text-align:center;color:var(--muted);font-size:12px;min-height:18px;margin:8px}.message{background:#3b1d1d;padding:15px;border-radius:10px}.success-message{background:#10351f;border:1px solid #1f8b4c;padding:15px;border-radius:10px}.premium{background:#172554;border:1px solid #3b82f6;padding:16px;border-radius:12px}.premium button{width:100%;margin-top:12px}.drawer{position:fixed;inset:0;z-index:50;display:none}.drawer.show{display:block}.scrim{position:absolute;inset:0;background:#0009}.side{position:absolute;right:0;top:0;bottom:0;width:min(380px,88vw);background:#20252d;padding:18px;overflow:auto}.side-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #38404d;padding-bottom:14px}.close{background:transparent;color:#fff;border:0;font-size:27px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:#cbd5e1;font-size:12px;margin:18px 0}.legend span{display:flex;align-items:center;gap:7px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid #9aa5b5;display:inline-grid;place-items:center}.dot.answered{background:var(--blue);border-color:var(--blue)}.dot.current{border-color:#fff;box-shadow:0 0 0 2px var(--blue) inset}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.palette button{width:100%;aspect-ratio:1;border-radius:50%;background:#242b35;border:2px solid #98a4b4;color:#fff;font-weight:800}.palette button.answered{background:var(--blue);border-color:var(--blue)}.palette button.current{box-shadow:0 0 0 2px #fff inset;border-color:var(--blue)}.side-submit{width:100%;margin-top:22px;background:#8aa5b5;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:900}.loading-state{padding:18px;text-align:center;color:#cbd5e1}.loading-state .spinner{width:30px;height:30px;border:3px solid #334155;border-top-color:#3b82f6;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:520px){.container{padding:10px}.question-text{font-size:16px}.palette{grid-template-columns:repeat(5,1fr)}.save-btn{padding:8px 9px;font-size:11px}.question-head{gap:8px}.buttons{padding:8px}.buttons button{min-height:50px;font-size:13px}}

<body>
<header class="header"><div class="head-left"><div id="questionNo" class="question-no">Loading...</div><div class="timer">⏱ <span id="timer">60:00</span></div></div><div style="display:flex;align-items:center;gap:6px"><div class="lang-wrap"><button id="languageBtn" class="lang-btn" type="button">🌐 EN ↔ తెలుగు</button><div id="langMenu" class="lang-menu"><button data-lang="en">🇬🇧 English (Original)</button><button data-lang="te">🇮🇳 తెలుగు (Google Translate)</button></div></div><button id="menuBtn" class="menu-btn" aria-label="Question navigation">☰</button></div></header>
<div class="container"><div id="translateStatus" class="translate-status">🌐 Use the language button to translate into Telugu.</div><div id="testArea" class="card"><div class="loading-state"><div class="spinner"></div><b>Loading questions…</b><div style="font-size:12px;color:#9ba7b8;margin-top:6px">Preparing your test</div></div></div></div>
<div class="buttons"><button id="prevBtn">← Previous</button><button id="nextBtn">Next →</button><button id="submitBtn" style="display:none">✓ Submit Test</button></div>
<div id="drawer" class="drawer"><div id="scrim" class="scrim"></div><aside class="side"><div class="side-head"><div><b>Question Navigation</b><div id="sideCount" style="color:#9ba7b8;font-size:12px;margin-top:4px"></div></div><button id="closeDrawer" class="close">×</button></div><div class="legend"><span><i class="dot answered"></i> Answered</span><span><i class="dot"></i> Unanswered</span><span><i class="dot current"></i> Current</span></div><div id="palette" class="palette"></div><button id="sideSubmit" class="side-submit" style="display:none">SUBMIT TEST</button></aside></div>
<script type="module">
import{auth,db}from'./firebase-config.js';
import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
import{collection,query,where,getDocs,addDoc,doc,getDoc,setDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
const p=new URLSearchParams(location.search),exam=p.get('exam')||'',subject=p.get('subject')||'',batchId=p.get('batchId')||'';
let questions=[],currentQuestion=0,answers=[],remainingSeconds=3600,timerId=null,submitting=false,user=null,currentLang='en',translationCache=new Map(),savedIds=new Set(),saving=false;
const $=id=>document.getElementById(id);
const withTimeout=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out after '+ms+'ms')),ms))]);
function expiry(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;if(typeof v==='number')return v;const d=new Date(v).getTime();return Number.isFinite(d)?d:0}
function clean(v){return String(v??'').trim().replace(/\s+/g,' ')}
function examKey(v){return clean(v).toLowerCase()}
function canonicalExam(v){return examKey(v).replace(/[^a-z0-9]+/g,' ')}
function examCandidates(v){const k=canonicalExam(v);if(['tg set','ts set','telangana set','telangana state eligibility test'].includes(k))return['TG SET','TS SET','Telangana SET','Telangana State Eligibility Test'];if(['tg police','telangana police','police'].includes(k))return['TG Police','Telangana Police','Police'];return[clean(v)]}
function examMatches(raw,target){const a=canonicalExam(raw),b=canonicalExam(target);if(a===b)return true;const aliases=examCandidates(target).map(c=>canonicalExam(c));return aliases.some(x=>x===a||a.includes(x)||x.includes(a))}
const SUBJECT_ALIASES={education:['education','educational studies'],commerce:['commerce'],economics:['economics','economy'],english:['english'],telugu:['telugu'],hindi:['hindi'],history:['history'],geography:['geography'],sociology:['sociology'],psychology:['psychology'],mathematics:['mathematics','maths','math'],physics:['physics'],chemistry:['chemistry'],reasoning:['reasoning'],politicalscience:['political science','politics'],publicadministration:['public administration'],physicaleducation:['physical education'],socialstudies:['social studies'],generalstudies:['general studies','general knowledge'],computerscience:['computer science','computers'],lifesciences:['life sciences','life science'],botany:['botany'],zoology:['zoology'],management:['management'],accounting:['accounting']};
function subjectKey(v){return clean(v).toLowerCase().replace(/[^a-z0-9]+/g,'')}
function subjectMatches(raw,target){const r=clean(raw),t=subjectKey(target);if(subjectKey(r)===t)return true;const aliases=SUBJECT_ALIASES[t]||[clean(target).toLowerCase()];const x=r.toLowerCase();return aliases.some(a=>new RegExp('(?:^|[^a-z])'+a.replace(/\s+/g,'\\s+')+'(?:$|[^a-z])','i').test(x))}
function batchValue(data){return data.testBatchId??data.batchId??data.uploadBatchId??data.paperBatchId??data.testId??''}
function norm(data,id){const o=data.options||{},oi=data.optionImages||data.optionImageUrls||{};return{...data,id,optionA:data.optionA??o.A??'',optionB:data.optionB??o.B??'',optionC:data.optionC??o.C??'',optionD:data.optionD??o.D??'',optionImages:{A:oi.A||'',B:oi.B||'',C:oi.C||'',D:oi.D||''},answer:data.answer??data.correctAnswer??'',answerType:String(data.answerType||'SINGLE').toUpperCase()}}
function answerSet(v){if(Array.isArray(v))return v.map(x=>String(x).trim().toUpperCase()).filter(Boolean).sort();if(typeof v==='string')return v.split(/[,|]/).map(x=>x.trim().toUpperCase()).filter(Boolean).sort();return[]}
function correct(q,s){const t=String(q.answerType||'SINGLE').toUpperCase();if(['DELETED','ALL_AWARDED','ALL-ANWARDED','ALL'].includes(t))return true;if(t==='MULTIPLE'){const e=answerSet(q.answer),a=answerSet(s);return e.length>0&&e.length===a.length&&e.every((x,i)=>x===a[i])}return String(s||'').trim().toUpperCase()===String(q.answer||'').trim().toUpperCase()}
async function hasAccess(){try{const st=await withTimeout(getDoc(doc(db,'students',user.uid)),9000,'Student access check');const pass=st.exists()?expiry(st.data().premiumUntil):0;return pass>Date.now()}catch(e){console.error('Premium access check failed',e);return false}}
function premiumMessage(){$('testArea').innerHTML='<div class="premium"><h3>👑 Premium Pass Required</h3><p>This exam requires an active Premium Pass.</p><button onclick="location.href=\'pass-access.html\'">View Premium Pass</button></div>';$('prevBtn').style.display=$('nextBtn').style.display=$('submitBtn').style.display='none';$('sideSubmit').style.display='none'}
function savedId(q){return`${user.uid}_${encodeURIComponent(q.id)}`}
async function loadSaved(){try{const s=await withTimeout(getDocs(query(collection(db,'savedQuestions'),where('uid','==',user.uid))),8000,'Saved questions');savedIds=new Set(s.docs.map(d=>d.data().questionId).filter(Boolean))}catch{savedIds=new Set()}}
async function toggleSave(){const q=questions[currentQuestion];if(!q||saving)return;saving=true;const b=$('saveBtn');b.disabled=true;const id=savedId(q);try{if(savedIds.has(q.id)){await deleteDoc(doc(db,'savedQuestions',id));savedIds.delete(q.id)}else{await setDoc(doc(db,'savedQuestions',id),{uid:user.uid,questionId:q.id,question:q.question||'',options:{A:q.optionA||'',B:q.optionB||'',C:q.optionC||'',D:q.optionD||''},optionA:q.optionA||'',optionB:q.optionB||'',optionC:q.optionC||'',optionD:q.optionD||'',optionImages:q.optionImages||{},answer:q.answer||'',correctAnswer:q.answer||'',answerType:q.answerType||'SINGLE',marks:Number(q.marks??1),negativeMarks:Number(q.negativeMarks??0),explanation:q.explanation||'',exam:q.exam||exam,subject:q.subject||subject,tags:Array.isArray(q.tags)?q.tags:[],savedAt:serverTimestamp()},{merge:true});savedIds.add(q.id)}updateSave()}catch(e){console.error(e);alert('Could not save this question. Please try again.')}finally{saving=false;b.disabled=false}}
function updateSave(){const yes=savedIds.has(questions[currentQuestion]?.id);$('saveBtn').classList.toggle('saved',yes);$('saveBtn').textContent=yes?'🔖 Saved':'🔖 Save'}
async function googleTranslate(text){const source=String(text||'').trim();if(!source||currentLang==='en')return source;const key='en-te:'+source;if(translationCache.has(key))return translationCache.get(key);const urls=[`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=te&dt=t&ie=UTF-8&oe=UTF-8&q=${encodeURIComponent(source)}`,`https://translate.google.com/translate_a/single?client=gtx&sl=en&tl=te&dt=t&ie=UTF-8&oe=UTF-8&q=${encodeURIComponent(source)}`];for(const url of urls){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);const r=await fetch(url,{method:'GET',headers:{Accept:'application/json,text/plain,*/*'},signal:controller.signal});clearTimeout(timer);if(!r.ok)continue;const d=await r.json();const t=(Array.isArray(d?.[0])?d[0]:[]).map(x=>x?.[0]||'').join('').trim();if(t){translationCache.set(key,t);return t}}catch(e){console.warn('Google Telugu translation:',e.message)}}return''}
function renderOption(l,text,q=questions[currentQuestion]){const el=$('option'+l);if(!el)return;el.innerHTML='';const wrap=document.createElement('div');wrap.className='option-content';const span=document.createElement('span');span.textContent=`${l}. ${text||''}`;wrap.appendChild(span);const src=(q?.optionImages||{})[l];if(src){const img=document.createElement('img');img.className='option-image';img.src=src;img.alt=`Option ${l}`;img.loading='lazy';wrap.appendChild(img)}el.appendChild(wrap)}
function updatePalette(){[...$('palette').children].forEach((b,n)=>{b.classList.toggle('answered',!!answers[n]);b.classList.toggle('current',n===currentQuestion)});$('sideCount').textContent=`${answers.filter(Boolean).length} of ${questions.length} answered`}
function createPalette(){const p=$('palette');p.innerHTML='';questions.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=async()=>{currentQuestion=i;$('drawer').classList.remove('show');await renderQuestion();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)});updatePalette()}
async function renderQuestion(){const q=questions[currentQuestion];if(!q)return;$('questionNo').textContent=`Question ${currentQuestion+1} / ${questions.length}`;$('prevBtn').disabled=currentQuestion===0;$('nextBtn').style.display=currentQuestion===questions.length-1?'none':'block';$('submitBtn').style.display=currentQuestion===questions.length-1?'block':'none';$('sideSubmit').style.display=currentQuestion===questions.length-1?'block':'none';['A','B','C','D'].forEach(l=>$('option'+l).classList.toggle('selected',answers[currentQuestion]===l));updatePalette();updateSave();if(currentLang==='en'){$('question').textContent=`${currentQuestion+1}. ${q.question||'Question not available'}`;['A','B','C','D'].forEach(l=>renderOption(l,q['option'+l]||'',q));$('translateStatus').textContent='English • Original question text';return}$('translateStatus').textContent='🇮🇳 Translating with Google…';const t=await Promise.all([q.question,q.optionA,q.optionB,q.optionC,q.optionD].map(googleTranslate));$('question').textContent=`${currentQuestion+1}. ${t[0]||q.question||''}`;['A','B','C','D'].forEach((l,i)=>renderOption(l,t[i+1]||q['option'+l]||'',q));$('translateStatus').textContent=t.some(Boolean)?'🇮🇳 Telugu • Google Translate':'⚠️ Telugu translation unavailable — showing English';}
async function submitTest(auto=false){if(submitting)return;if(!auto&&!confirm('Submit this test now?'))return;submitting=true;if(timerId)clearInterval(timerId);let score=0,correctCount=0,wrongCount=0,notAttemptedCount=0;questions.forEach((q,i)=>{if(!answers[i])notAttemptedCount++;else if(correct(q,answers[i])){score+=Number(q.marks??1);correctCount++}else{score-=Number(q.negativeMarks??0);wrongCount++}});const solutions=questions.map((q,i)=>({questionId:q.questionId||q.id,question:q.question,optionA:q.optionA,optionB:q.optionB,optionC:q.optionC,optionD:q.optionD,optionImages:q.optionImages||{},selectedAnswer:answers[i]||'',correctAnswer:q.answer,answerType:q.answerType||'SINGLE',marks:Number(q.marks??1),negativeMarks:Number(q.negativeMarks??0),explanation:q.explanation||''}));try{const ref=await withTimeout(addDoc(collection(db,'results'),{uid:user.uid,email:user.email||'',name:user.displayName||'',exam,subject,testBatchId:batchId||null,title:`${exam} - ${subject}`,score,correctCount,wrongCount,notAttemptedCount,totalQuestions:questions.length,solutions,answers,submittedAt:new Date()}),12000,'Result save');location.href=`student-results.html?resultId=${encodeURIComponent(ref.id)}`}catch(e){console.error(e);submitting=false;alert('Could not save your result. Please check your internet connection and try again.')}}
async function queryBatch(field,value){if(!value)return[];try{const snap=await withTimeout(getDocs(query(collection(db,'questions'),where(field,'==',value))),8000,field+' question query');return snap.docs.map(d=>norm(d.data(),d.id))}catch(e){console.warn(e.message);return[]}}
async function fetchExamQuestions(){const rowsById=new Map();const candidates=examCandidates(exam);for(const candidate of candidates){try{const snap=await withTimeout(getDocs(query(collection(db,'questions'),where('exam','==',candidate))),9000,'Exam question query');snap.docs.forEach(d=>rowsById.set(d.id,norm(d.data(),d.id)))}catch(e){console.warn('Exam query failed:',e.message)}}return[...rowsById.values()]}
async function loadQuestions(){const started=Date.now();try{if(!exam||!subject){$('testArea').innerHTML='<div class="message">Exam or subject was not selected.</div>';return}const accessPromise=hasAccess();let rows=[];if(batchId){for(const field of ['testBatchId','batchId','uploadBatchId','paperBatchId','testId']){rows=await queryBatch(field,batchId);if(rows.length)break}}if(!rows.length){const all=await fetchExamQuestions();rows=all.filter(q=>examMatches(q.exam,exam)&&subjectMatches(q.subject,subject));}if(!rows.length){try{const snap=await withTimeout(getDocs(collection(db,'questions')),10000,'Question bank read');const all=snap.docs.map(d=>norm(d.data(),d.id));rows=all.filter(q=>examMatches(q.exam,exam)&&subjectMatches(q.subject,subject));if(batchId){const wanted=String(batchId).trim();const exact=rows.filter(q=>String(batchValue(q)).trim()===wanted);if(exact.length)rows=exact}}catch(e){throw e}}questions=rows.sort((a,b)=>Number(a.questionNumber??a.questionNo??a.number??0)-Number(b.questionNumber??b.questionNo??b.number??0));if(!questions.length){$('testArea').innerHTML='<div class="message"><h3>No questions found for this test</h3><p>The test opened, but its question records could not be matched to this exam, subject, or batch.</p><button onclick="location.reload()" style="margin-top:8px;padding:10px 14px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:800">Refresh Test</button></div>';return}const access=await accessPromise;if(!access){premiumMessage();return}answers=new Array(questions.length).fill('');$('testArea').innerHTML='<div class="question-head"><h3 id="question" class="question-text">Loading Question...</h3><button id="saveBtn" class="save-btn" type="button">🔖 Save</button></div><div class="option" id="optionA"></div><div class="option" id="optionB"></div><div class="option" id="optionC"></div><div class="option" id="optionD"></div><div id="message"></div>';['A','B','C','D'].forEach(l=>$("option"+l).onclick=()=>{answers[currentQuestion]=l;renderQuestion()});$('saveBtn').onclick=toggleSave;createPalette();await renderQuestion();startTimer();loadSaved().then(updateSave).catch(()=>{});console.log('TrueRevise test loaded',questions.length,'questions in',Date.now()-started,'ms')}catch(e){console.error('Test question loading failed',e);$('testArea').innerHTML='<div class="message"><h3>Unable to load this test</h3><p>We could not load the questions right now. Please refresh once.</p><p style="font-size:12px;color:#9ba7b8">Reason: '+String(e.message||'Unknown error').replace(/[<>]/g,'')+'</p><button onclick="location.reload()" style="margin-top:8px;padding:10px 14px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:800">Refresh Test</button></div>'}}
function startTimer(){timerId=setInterval(()=>{remainingSeconds--;const m=Math.floor(remainingSeconds/60),s=remainingSeconds%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(remainingSeconds<=0){clearInterval(timerId);submitTest(true)}},1000)}
$('prevBtn').onclick=async()=>{if(currentQuestion>0){currentQuestion--;await renderQuestion()}};$('nextBtn').onclick=async()=>{if(currentQuestion<questions.length-1){currentQuestion++;await renderQuestion()}};$('submitBtn').onclick=()=>submitTest(false);$('menuBtn').onclick=()=>$('drawer').classList.add('show');$('closeDrawer').onclick=()=>$('drawer').classList.remove('show');$('scrim').onclick=()=>$('drawer').classList.remove('show');$('sideSubmit').onclick=()=>submitTest(false);$('languageBtn').onclick=()=>$('langMenu').classList.toggle('show');document.querySelectorAll('#langMenu button').forEach(b=>b.onclick=async()=>{$('langMenu').classList.remove('show');currentLang=b.dataset.lang;if(currentLang==='te')$('translateStatus').textContent='🇮🇳 Preparing Google Telugu translation…';await renderQuestion()});document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap'))$('langMenu').classList.remove('show')});
onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}user=u;await loadQuestions()});
</script>
<script type="module" src="./question-report.js"></script>
</body></html>
