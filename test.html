<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/test.html">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{--bg:#0b0f17;--panel:#171d27;--panel2:#202733;--line:#303b4b;--text:#f5f7fb;--muted:#9ba7b8;--blue:#3b82f6;--green:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh;padding-bottom:82px}.header{background:#121a29;border-bottom:1px solid var(--line);padding:10px 13px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.head-left{display:flex;align-items:center;gap:12px}.question-no{font-weight:900}.timer{color:#cbd5e1}.menu-btn{background:transparent;color:#fff;border:0;font-size:28px;padding:3px 7px;cursor:pointer}.lang-wrap{position:relative}.lang-btn{background:#fff;color:#111;border:0;border-radius:999px;padding:8px 11px;font-weight:900;font-size:12px}.lang-menu{position:absolute;right:0;top:43px;display:none;background:#fff;border-radius:12px;padding:6px;min-width:170px;box-shadow:0 12px 30px #0008}.lang-menu.show{display:block}.lang-menu button{display:block;width:100%;text-align:left;border:0;background:#fff;color:#111;padding:10px;border-radius:8px}.container{padding:15px;max-width:900px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);padding:17px;border-radius:15px}.question-text{font-size:18px;line-height:1.6;margin:0 0 17px}.qnum{color:#9fb5ff;margin-right:6px}.option{background:#303844;border:1px solid #3b4656;padding:13px;margin:10px 0;border-radius:10px;cursor:pointer;line-height:1.5}.option.selected{background:#2563eb;border-color:#6194ff}.buttons{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,22,.96);border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;z-index:15}.buttons button{flex:1;min-height:48px;background:#222b38;color:#fff;border:1px solid #536176;border-radius:10px;font-weight:800}.buttons #submitBtn{background:#2563eb;border-color:#2563eb}.translate-status{text-align:center;color:var(--muted);font-size:12px;min-height:18px;margin:8px}.message{background:#3b1d1d;padding:15px;border-radius:10px}.premium{background:#172554;border:1px solid #3b82f6;padding:16px;border-radius:12px}.premium button{width:100%;margin-top:12px}.drawer{position:fixed;inset:0;z-index:50;display:none}.drawer.show{display:block}.scrim{position:absolute;inset:0;background:#0009}.side{position:absolute;right:0;top:0;bottom:0;width:min(380px,88vw);background:#20252d;padding:18px;overflow:auto;box-shadow:-15px 0 40px #0008}.side-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #38404d;padding-bottom:14px}.close{background:transparent;color:#fff;border:0;font-size:27px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:#cbd5e1;font-size:12px;margin:18px 0}.legend span{display:flex;align-items:center;gap:7px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid #9aa5b5;display:inline-grid;place-items:center}.dot.answered{background:var(--blue);border-color:var(--blue)}.dot.current{border-color:#fff;box-shadow:0 0 0 2px var(--blue) inset}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.palette button{width:100%;aspect-ratio:1;border-radius:50%;background:#242b35;border:2px solid #98a4b4;color:#fff;font-weight:800}.palette button.answered{background:var(--blue);border-color:var(--blue)}.palette button.current{box-shadow:0 0 0 2px #fff inset;border-color:var(--blue)}.side-submit{width:100%;margin-top:22px;background:#8aa5b5;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:900}@media(max-width:520px){.container{padding:10px}.question-text{font-size:16px}.palette{grid-template-columns:repeat(5,1fr)}} </style></head><body><header class="header"><div class="head-left"><div id="questionNo" class="question-no">Loading...</div><div class="timer">⏱ <span id="timer">60:00</span></div></div><div style="display:flex;align-items:center;gap:6px"><div class="lang-wrap"><button id="languageBtn" class="lang-btn" type="button">🌐 EN ↔ తెలుగు</button><div id="langMenu" class="lang-menu"><button data-lang="en">🇬🇧 English (Original)</button><button data-lang="te">🇮🇳 తెలుగు (Translate)</button></div></div><button id="menuBtn" class="menu-btn" aria-label="Question navigation">☰</button></div></header><div class="container"><div id="translateStatus" class="translate-status">🌐 Use the language button to translate into Telugu.</div><div id="testArea" class="card"><h3 id="question" class="question-text">Loading Question...</h3><div class="option" id="optionA"></div><div class="option" id="optionB"></div><div class="option" id="optionC"></div><div class="option" id="optionD"></div></div><div id="message"></div></div><div class="buttons"><button id="prevBtn">← Previous</button><button id="nextBtn">Next →</button><button id="submitBtn">✓ Submit Test</button></div><div id="drawer" class="drawer"><div id="scrim" class="scrim"></div><aside class="side"><div class="side-head"><div><b>Question Navigation</b><div id="sideCount" style="color:#9ba7b8;font-size:12px;margin-top:4px"></div></div><button id="closeDrawer" class="close">×</button></div><div class="legend"><span><i class="dot answered"></i> Answered</span><span><i class="dot"></i> Unanswered</span><span><i class="dot current"></i> Current</span></div><div id="palette" class="palette"></div><button id="sideSubmit" class="side-submit">SUBMIT TEST</button></aside></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,query,where,getDocs,addDoc,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const params=new URLSearchParams(location.search),exam=params.get('exam'),subject=params.get('subject');let questions=[],currentQuestion=0,answers=[],remainingSeconds=3600,timerId=null,submitting=false,user=null,currentLang=localStorage.getItem('trueReviseLang')||'en',translationCache=new Map(),options=['A','B','C','D'];const $=id=>document.getElementById(id);function expiryMs(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;if(typeof v==='number')return v;if(typeof v==='string'){const d=new Date(v).getTime();return isNaN(d)?0:d}return 0}function normQuestion(data){const o=data.options||{};return{...data,optionA:data.optionA??o.A??'',optionB:data.optionB??o.B??'',optionC:data.optionC??o.C??'',optionD:data.optionD??o.D??'',answer:data.answer??data.correctAnswer??'',answerType:String(data.answerType||'SINGLE').toUpperCase()}}function normalizeAnswerSet(v){if(Array.isArray(v))return v.map(x=>String(x).trim().toUpperCase()).filter(Boolean).sort();if(typeof v==='string')return v.split(/[,|]/).map(x=>x.trim().toUpperCase()).filter(Boolean).sort();return[]}function isAnswerCorrect(q,s){const type=String(q.answerType||'SINGLE').toUpperCase();if(['DELETED','ALL_AWARDED','ALL-ANWARDED','ALL'].includes(type))return true;if(type==='MULTIPLE'){const e=normalizeAnswerSet(q.answer),a=normalizeAnswerSet(s);return e.length>0&&e.length===a.length&&e.every((x,i)=>x===a[i])}return String(s||'').trim().toUpperCase()===String(q.answer||'').trim().toUpperCase()}async function hasAccess(){const p=await getDoc(doc(db,'students',user.uid));const pass=p.exists()?expiryMs(p.data().premiumUntil):0;if(pass>Date.now())return true;const s=await getDoc(doc(db,'passSettings','main'));return s.exists()&&(s.data().freeExams||[]).includes(exam)}function showPremiumMessage(){$('testArea').innerHTML=`<div class="premium"><h3>👑 Premium Pass Required</h3><p>This exam requires an active Premium Pass.</p><button onclick="location.href='pass-access.html'">View Premium Pass</button></div>`;$('prevBtn').style.display=$('nextBtn').style.display=$('submitBtn').style.display='none'}async function translateText(text){if(!text||currentLang==='en')return text||'';const key='en-te:'+text;if(translationCache.has(key))return translationCache.get(key);try{const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=te&dt=t&q='+encodeURIComponent(text));if(r.ok){const d=await r.json(),t=(d[0]||[]).map(x=>x[0]||'').join('');if(t){translationCache.set(key,t);return t}}}catch(e){}return text}async function renderLanguage(){document.querySelectorAll('#langMenu button').forEach(b=>b.classList.toggle('active',b.dataset.lang===currentLang));$('languageBtn').textContent=currentLang==='te'?'🌐 తెలుగు ↔ EN':'🌐 EN ↔ తెలుగు';const q=questions[currentQuestion];if(currentLang==='en'){renderQuestionText(q);return}$('translateStatus').textContent='🌐 Translating…';const t=await Promise.all([q.question,q.optionA,q.optionB,q.optionC,q.optionD].map(translateText));$('question').innerHTML=`<span class="qnum">${currentQuestion+1}.</span>${t[0]||q.question}`;options.forEach((l,n)=>$('option'+l).textContent=`${l}. ${t[n+1]||q['option'+l]||''}`);$('translateStatus').textContent='🇮🇳 తెలుగు • English question translated automatically'}function renderQuestionText(q){$('question').innerHTML=`<span class="qnum">${currentQuestion+1}.</span>${q.question||'Question not available'}`;options.forEach(l=>$('option'+l).textContent=`${l}. ${q['option'+l]||''}`);$('translateStatus').textContent='English • Original question text'}function updatePalette(){[...$('palette').children].forEach((b,n)=>{b.classList.toggle('answered',!!answers[n]);b.classList.toggle('current',n===currentQuestion)});$('sideCount').textContent=`${answers.filter(Boolean).length} of ${questions.length} answered`}async function showQuestion(){const q=questions[currentQuestion];$('questionNo').textContent=`Question ${currentQuestion+1} / ${questions.length}`;$('prevBtn').disabled=currentQuestion===0;$('nextBtn').style.display=currentQuestion===questions.length-1?'none':'block';$('submitBtn').style.display='block';options.forEach(l=>$('option'+l).classList.toggle('selected',answers[currentQuestion]===l));updatePalette();await renderLanguage()}function createPalette(){const p=$('palette');p.innerHTML='';questions.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=async()=>{currentQuestion=i;$('drawer').classList.remove('show');await showQuestion();window.scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)});updatePalette()}options.forEach(l=>$('option'+l).onclick=()=>{answers[currentQuestion]=l;showQuestion()});$('prevBtn').onclick=async()=>{if(currentQuestion>0){currentQuestion--;await showQuestion()}};$('nextBtn').onclick=async()=>{if(currentQuestion<questions.length-1){currentQuestion++;await showQuestion()}};$('menuBtn').onclick=()=>$('drawer').classList.add('show');$('closeDrawer').onclick=()=>$('drawer').classList.remove('show');$('scrim').onclick=()=>$('drawer').classList.remove('show');$('sideSubmit').onclick=()=>submitTest(false);function startTimer(){timerId=setInterval(()=>{remainingSeconds--;const m=Math.floor(remainingSeconds/60),s=remainingSeconds%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(remainingSeconds<=0){clearInterval(timerId);submitTest(true)}},1000)}async function submitTest(auto=false){if(submitting)return;if(!auto&&!confirm('Submit this test now?'))return;submitting=true;if(timerId)clearInterval(timerId);let score=0,correctCount=0,wrongCount=0,notAttemptedCount=0;questions.forEach((q,n)=>{if(!answers[n])notAttemptedCount++;else if(isAnswerCorrect(q,answers[n])){score+=Number(q.marks??1);correctCount++}else{score-=Number(q.negativeMarks??0);wrongCount++}});const solutionData=questions.map((q,n)=>({question:q.question,optionA:q.optionA,optionB:q.optionB,optionC:q.optionC,optionD:q.optionD,selectedAnswer:answers[n]||'',correctAnswer:q.answer,answerType:q.answerType||'SINGLE',marks:Number(q.marks??1),negativeMarks:Number(q.negativeMarks??0),explanation:q.explanation||''}));try{const ref=await addDoc(collection(db,'results'),{uid:user.uid,email:user.email||'',name:user.displayName||'',exam,subject,title:`${exam} - ${subject}`,score,correctCount,wrongCount,notAttemptedCount,totalQuestions:questions.length,solutions:solutionData,answers,submittedAt:new Date()});location.href=`student-results.html?resultId=${encodeURIComponent(ref.id)}`}catch(e){console.error(e);submitting=false;alert('Could not save your result. Please check your internet connection and try again.')}}async function loadQuestions(){try{if(!exam||!subject){$('testArea').innerHTML='<div class="message">Exam or subject was not selected.</div>';return}if(!(await hasAccess())){showPremiumMessage();return}const snap=await getDocs(query(collection(db,'questions'),where('exam','==',exam),where('subject','==',subject)));snap.forEach(d=>questions.push(normQuestion(d.data())));if(!questions.length){$('testArea').innerHTML='<div class="message">No questions are available for this test.</div>';return}answers=new Array(questions.length).fill('');createPalette();await showQuestion();startTimer()}catch(e){console.error(e);$('testArea').innerHTML='<div class="message">Unable to load questions. Please try again.</div>'}}$('languageBtn').onclick=()=>$('langMenu').classList.toggle('show');document.querySelectorAll('#langMenu button').forEach(b=>b.onclick=async()=>{$('langMenu').classList.remove('show');currentLang=b.dataset.lang;localStorage.setItem('trueReviseLang',currentLang);await renderLanguage()});document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap'))$('langMenu').classList.remove('show')});onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}user=u;await loadQuestions()});</script></body></html>
