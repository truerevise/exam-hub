<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>True Revise - Test</title><style>body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}header{background:#1e3a8a;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2;gap:10px}.head-left{display:flex;align-items:center;gap:10px}.lang-btn{background:#fff;color:#111;border:0;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}.container{padding:15px}.card{background:#222;padding:15px;border-radius:10px}.option{background:#333;padding:12px;margin:10px 0;border-radius:8px;cursor:pointer}.option:hover{background:#444}.option.selected{background:#2563eb}.buttons{display:flex;gap:10px;justify-content:space-between;margin-top:20px}button{background:#2563eb;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer}.buttons button{flex:1}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:25px}.palette button{padding:10px}.palette button.answered{background:#15803d}.message{background:#3b1d1d;padding:15px;border-radius:10px;margin-top:15px}.premium{background:#172554;border:1px solid #3b82f6;padding:16px;border-radius:12px;margin-top:12px}.premium button{width:100%;margin-top:12px}.translate-note{text-align:center;color:#9ca3af;font-size:12px;margin:8px 0}.goog-te-banner-frame.skiptranslate{display:none!important}body{top:0!important}.goog-te-gadget{display:none!important}#google_translate_element{position:absolute;width:1px;height:1px;overflow:hidden;left:-9999px}@media(max-width:520px){header{padding:10px}.lang-btn{padding:7px 10px;font-size:12px}.container{padding:10px}}
</style></head><body><header><div class="head-left"><div id="questionNo">Loading...</div><div>⏱ <span id="timer">60:00</span></div></div><button id="languageBtn" class="lang-btn" type="button">🌐 తెలుగు</button></header><div id="google_translate_element"></div><div class="container"><div class="translate-note">Use 🌐 to switch between English and Telugu. English questions can be translated automatically.</div><div id="testArea" class="card"><h3 id="question">Loading Question...</h3><div class="option" id="optionA"></div><div class="option" id="optionB"></div><div class="option" id="optionC"></div><div class="option" id="optionD"></div></div><div id="message"></div><div class="buttons"><button id="prevBtn">Previous</button><button id="nextBtn">Next</button><button id="submitBtn" style="display:none">Submit Test</button></div><div class="palette" id="palette"></div></div><script>window.googleTranslateElementInit=function(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'en,te',autoDisplay:false,multilanguagePage:true},'google_translate_element')};</script><script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,query,where,getDocs,addDoc,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const params=new URLSearchParams(location.search),exam=params.get('exam'),subject=params.get('subject');let questions=[],currentQuestion=0,answers=[],remainingSeconds=3600,timerId=null,submitting=false,user=null,currentLang=localStorage.getItem('trueReviseLang')||'en';const $=id=>document.getElementById(id),options=['A','B','C','D'];function expiryMs(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;if(typeof v==='number')return v;if(typeof v==='string'){const d=new Date(v);return isNaN(d)?0:d.getTime()}return 0}function normQuestion(data){const o=data.options||{};return{...data,optionA:data.optionA??o.A??'',optionB:data.optionB??o.B??'',optionC:data.optionC??o.C??'',optionD:data.optionD??o.D??'',answer:data.answer??data.correctAnswer??''}}function showPremiumMessage(){$('testArea').innerHTML=`<div class="premium"><h3>👑 Premium Pass Required</h3><p>This exam requires an active Premium Pass. Your manually granted pass may need a page refresh if it was just assigned.</p><button onclick="location.href='pass-access.html'">View Premium Pass</button></div>`;$('prevBtn').style.display='none';$('nextBtn').style.display='none';$('submitBtn').style.display='none';$('palette').innerHTML='';$('questionNo').textContent='Premium Exam'}async function hasAccess(){if(!user||!exam)return false;await user.getIdToken(true);const p=await getDoc(doc(db,'students',user.uid));const pass=p.exists()?expiryMs(p.data().premiumUntil):0;if(pass>Date.now())return true;const s=await getDoc(doc(db,'passSettings','main'));return!!s.exists()&&((s.data().freeExams||[]).includes(exam))}function applyLanguage(){const btn=$('languageBtn');btn.textContent=currentLang==='te'?'🌐 English':'🌐 తెలుగు';const select=document.querySelector('.goog-te-combo');if(select){select.value=currentLang;select.dispatchEvent(new Event('change'));setTimeout(()=>{if(select.value!==currentLang){select.value=currentLang;select.dispatchEvent(new Event('change'))}},500)}}function requestTranslation(){let tries=0;const timer=setInterval(()=>{tries++;const select=document.querySelector('.goog-te-combo');if(select){clearInterval(timer);select.value=currentLang;select.dispatchEvent(new Event('change'));setTimeout(applyLanguage,700)}if(tries>20)clearInterval(timer)},250)}$('languageBtn').onclick=()=>{currentLang=currentLang==='en'?'te':'en';localStorage.setItem('trueReviseLang',currentLang);requestTranslation()};async function loadQuestions(){try{if(!exam||!subject){$('testArea').innerHTML='<div class="message">Exam or subject was not selected.</div>';return}if(!(await hasAccess())){showPremiumMessage();return}const qref=query(collection(db,'questions'),where('exam','==',exam),where('subject','==',subject));const snapshot=await getDocs(qref);snapshot.forEach(d=>questions.push(normQuestion(d.data())));if(!questions.length){$('testArea').innerHTML=`<div class="message">No questions are available for <b>${exam}</b> / <b>${subject}</b>.</div>`;$('prevBtn').style.display='none';$('nextBtn').style.display='none';return}answers=new Array(questions.length).fill('');createPalette();showQuestion();startTimer();requestTranslation()}catch(error){console.error(error);if(error?.code==='permission-denied')showPremiumMessage();else $('testArea').innerHTML='<div class="message">Unable to load questions. Please refresh and try again.</div>'}}function showQuestion(){const q=questions[currentQuestion];$('questionNo').textContent=`Question ${currentQuestion+1} / ${questions.length}`;$('question').textContent=q.question||'Question not available';options.forEach(letter=>{$('option'+letter).textContent=`${letter}. ${q['option'+letter]||''}`;$('option'+letter).classList.toggle('selected',answers[currentQuestion]===letter)});$('prevBtn').disabled=currentQuestion===0;$('nextBtn').style.display=currentQuestion===questions.length-1?'none':'inline-block';$('submitBtn').style.display=currentQuestion===questions.length-1?'inline-block':'none';updatePalette();if(currentLang==='te')setTimeout(requestTranslation,80)}function createPalette(){const palette=$('palette');palette.innerHTML='';questions.forEach((_,i)=>{const btn=document.createElement('button');btn.textContent=i+1;btn.onclick=()=>{currentQuestion=i;showQuestion()};palette.appendChild(btn)});updatePalette()}function updatePalette(){[...$('palette').children].forEach((btn,i)=>btn.classList.toggle('answered',Boolean(answers[i])))}function selectAnswer(answer){answers[currentQuestion]=answer;showQuestion()}options.forEach(letter=>$('option'+letter).onclick=()=>selectAnswer(letter));$('nextBtn').onclick=()=>{if(currentQuestion<questions.length-1){currentQuestion++;showQuestion()}};$('prevBtn').onclick=()=>{if(currentQuestion>0){currentQuestion--;showQuestion()}};function startTimer(){timerId=setInterval(()=>{remainingSeconds--;const min=Math.floor(remainingSeconds/60),sec=remainingSeconds%60;$('timer').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;if(remainingSeconds<=0){clearInterval(timerId);submitTest(true)}},1000)}async function submitTest(autoSubmit=false){if(submitting)return;submitting=true;if(timerId)clearInterval(timerId);if(!autoSubmit&&!confirm('Submit this test now?')){submitting=false;startTimer();return}if(!user){submitting=false;alert('Please sign in before submitting your test.');return}let score=0;questions.forEach((q,index)=>{if(answers[index]===q.answer)score+=Number(q.marks||1)});const solutionData=questions.map((q,index)=>({question:q.question,optionA:q.optionA,optionB:q.optionB,optionC:q.optionC,optionD:q.optionD,selectedAnswer:answers[index]||'',correctAnswer:q.answer,explanation:q.explanation||''}));try{await addDoc(collection(db,'results'),{uid:user.uid,email:user.email||'',name:user.displayName||'',exam,subject,score,totalQuestions:questions.length,solutions:solutionData,submittedAt:new Date()});location.href='student-results.html'}catch(error){console.error(error);submitting=false;alert('Could not save your result. Please check your internet connection and try again.');startTimer()}}$('submitBtn').onclick=()=>submitTest(false);onAuthStateChanged(auth,async u=>{if(u){user=u;await loadQuestions();setTimeout(applyLanguage,1200)}else location.href='login.html?next='+encodeURIComponent(location.href)});</script></body></html>
