<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/test.html">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;background:#0b0f17;color:#fff;font-family:Inter,Arial,sans-serif}.header{background:#172f78;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;gap:10px}.head-left{display:flex;align-items:center;gap:10px}.lang-wrap{position:relative}.lang-btn{background:#fff;color:#111;border:0;border-radius:999px;padding:9px 13px;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}.lang-menu{position:absolute;right:0;top:46px;display:none;background:#fff;border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.35);min-width:175px}.lang-menu.show{display:block}.lang-menu button{display:block;width:100%;text-align:left;background:#fff;color:#111;padding:10px;border-radius:8px;font-weight:700}.lang-menu button.active{background:#e8efff;color:#1d4ed8}.container{padding:15px;max-width:900px;margin:auto}.card{background:#20252f;padding:15px;border-radius:12px}.option{background:#303640;padding:12px;margin:10px 0;border-radius:8px;cursor:pointer;line-height:1.5}.option:hover{background:#3a4250}.option.selected{background:#2563eb}.buttons{display:flex;gap:10px;justify-content:space-between;margin-top:20px}button{background:#2563eb;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer}.buttons button{flex:1}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:25px}.palette button{padding:10px}.palette button.answered{background:#15803d}.message{background:#3b1d1d;padding:15px;border-radius:10px;margin-top:15px}.premium{background:#172554;border:1px solid #3b82f6;padding:16px;border-radius:12px;margin-top:12px}.premium button{width:100%;margin-top:12px}.translate-status{text-align:center;color:#9ca3af;font-size:12px;min-height:18px;margin:8px 0}.question-text{line-height:1.6}@media(max-width:520px){.header{padding:9px 10px}.lang-btn{padding:8px 10px;font-size:12px}.container{padding:10px}}</style></head><body><header class="header"><div class="head-left"><div id="questionNo">Loading...</div><div>⏱ <span id="timer">60:00</span></div></div><div class="lang-wrap"><button id="languageBtn" class="lang-btn" type="button" aria-label="Change question language">🌐 EN ↔ తెలుగు</button><div id="langMenu" class="lang-menu"><button type="button" data-lang="en">🇬🇧 English (Original)</button><button type="button" data-lang="te">🇮🇳 తెలుగు (Translate)</button></div></div></header><div class="container"><div id="translateStatus" class="translate-status">🌐 Tap EN ↔ తెలుగు to translate English questions into Telugu.</div><div id="testArea" class="card"><h3 id="question" class="question-text">Loading Question...</h3><div class="option" id="optionA"></div><div class="option" id="optionB"></div><div class="option" id="optionC"></div><div class="option" id="optionD"></div></div><div id="message"></div><div class="buttons"><button id="prevBtn">Previous</button><button id="nextBtn">Next</button><button id="submitBtn" style="display:none">Submit Test</button></div><div class="palette" id="palette"></div></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,query,where,getDocs,addDoc,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const params=new URLSearchParams(location.search),exam=params.get('exam'),subject=params.get('subject');let questions=[],currentQuestion=0,answers=[],remainingSeconds=3600,timerId=null,submitting=false,user=null,currentLang=localStorage.getItem('trueReviseLang')||'en',translationCache=new Map();const $=id=>document.getElementById(id),options=['A','B','C','D'];function expiryMs(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;if(typeof v==='number')return v;if(typeof v==='string'){const d=new Date(v);return isNaN(d)?0:d.getTime()}return 0}function normQuestion(data){const o=data.options||{};return{...data,optionA:data.optionA??o.A??'',optionB:data.optionB??o.B??'',optionC:data.optionC??o.C??'',optionD:data.optionD??o.D??'',answer:data.answer??data.correctAnswer??''}}function showPremiumMessage(){$('testArea').innerHTML=`<div class="premium"><h3>👑 Premium Pass Required</h3><p>This exam requires an active Premium Pass.</p><button onclick="location.href='pass-access.html'">View Premium Pass</button></div>`;$('prevBtn').style.display='none';$('nextBtn').style.display='none';$('submitBtn').style.display='none';$('palette').innerHTML='';$('questionNo').textContent='Premium Exam'}async function hasAccess(){if(!user||!exam)return false;await user.getIdToken(true);const p=await getDoc(doc(db,'students',user.uid));const pass=p.exists()?expiryMs(p.data().premiumUntil):0;if(pass>Date.now())return true;const s=await getDoc(doc(db,'passSettings','main'));return!!s.exists()&&((s.data().freeExams||[]).includes(exam))}async function translateText(text){if(!text)return '';if(currentLang==='en')return text;const key='en-te:'+text;if(translationCache.has(key))return translationCache.get(key);try{const google='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=te&dt=t&q='+encodeURIComponent(text);const r=await fetch(google);if(r.ok){const data=await r.json();const translated=(data[0]||[]).map(x=>x[0]||'').join('');if(translated&&translated.trim()&&translated.trim().toLowerCase()!==text.trim().toLowerCase()){translationCache.set(key,translated);return translated}}}catch(e){console.warn('Google translation failed',e)}try{const mm='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|te';const r=await fetch(mm);if(r.ok){const data=await r.json();const translated=data?.responseData?.translatedText;if(translated&&translated.trim()){translationCache.set(key,translated);return translated}}}catch(e){console.warn('Fallback translation failed',e)}return text}function showEnglish(){const q=questions[currentQuestion];$('question').textContent=q.question||'Question not available';options.forEach(l=>$('option'+l).textContent=`${l}. ${q['option'+l]||''}`);$('translateStatus').textContent='English • Original question text';}async function showTranslated(){const q=questions[currentQuestion];$('translateStatus').textContent='🌐 Translating English question to Telugu…';$('question').textContent='తెలుగులోకి అనువదిస్తోంది…';options.forEach(l=>$('option'+l).textContent=`${l}. అనువదిస్తోంది…`);const t=await Promise.all([q.question,q.optionA,q.optionB,q.optionC,q.optionD].map(translateText));$('question').textContent=t[0]||q.question||'Question not available';options.forEach((l,i)=>$('option'+l).textContent=`${l}. ${t[i+1]||q['option'+l]||''}`);$('translateStatus').textContent='🇮🇳 తెలుగు • English question translated automatically';}async function renderLanguage(){const btn=$('languageBtn');btn.textContent=currentLang==='te'?'🌐 తెలుగు ↔ EN':'🌐 EN ↔ తెలుగు';document.querySelectorAll('#langMenu button').forEach(b=>b.classList.toggle('active',b.dataset.lang===currentLang));if(currentLang==='te')await showTranslated();else showEnglish()}$('languageBtn').onclick=()=>$('langMenu').classList.toggle('show');document.querySelectorAll('#langMenu button').forEach(b=>b.onclick=async()=>{$('langMenu').classList.remove('show');currentLang=b.dataset.lang;localStorage.setItem('trueReviseLang',currentLang);await renderLanguage()});document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap'))$('langMenu').classList.remove('show')});async function loadQuestions(){try{if(!exam||!subject){$('testArea').innerHTML='<div class="message">Exam or subject was not selected.</div>';return}if(!(await hasAccess())){showPremiumMessage();return}const qref=query(collection(db,'questions'),where('exam','==',exam),where('subject','==',subject));const snapshot=await getDocs(qref);snapshot.forEach(d=>questions.push(normQuestion(d.data())));if(!questions.length){$('testArea').innerHTML=`<div class="message">No questions are available for <b>${exam}</b> / <b>${subject}</b>.</div>`;$('prevBtn').style.display='none';$('nextBtn').style.display='none';return}answers=new Array(questions.length).fill('');createPalette();await showQuestion();startTimer()}catch(error){console.error(error);if(error?.code==='permission-denied')showPremiumMessage();else $('testArea').innerHTML='<div class="message">Unable to load questions. Please try again.</div>'}}async function showQuestion(){const q=questions[currentQuestion];$('questionNo').textContent=`Question ${currentQuestion+1} / ${questions.length}`;$('prevBtn').disabled=currentQuestion===0;$('nextBtn').style.display=currentQuestion===questions.length-1?'none':'inline-block';$('submitBtn').style.display=currentQuestion===questions.length-1?'inline-block':'none';updatePalette();await renderLanguage();options.forEach(letter=>$('option'+letter).classList.toggle('selected',answers[currentQuestion]===letter))}function createPalette(){const palette=$('palette');palette.innerHTML='';questions.forEach((_,i)=>{const btn=document.createElement('button');btn.textContent=i+1;btn.onclick=async()=>{currentQuestion=i;await showQuestion()};palette.appendChild(btn)});updatePalette()}function updatePalette(){[...$('palette').children].forEach((btn,i)=>btn.classList.toggle('answered',Boolean(answers[i])))}function selectAnswer(answer){answers[currentQuestion]=answer;showQuestion()}options.forEach(letter=>$('option'+letter).onclick=()=>selectAnswer(letter));$('nextBtn').onclick=async()=>{if(currentQuestion<questions.length-1){currentQuestion++;await showQuestion()}};$('prevBtn').onclick=async()=>{if(currentQuestion>0){currentQuestion--;await showQuestion()}};function startTimer(){timerId=setInterval(()=>{remainingSeconds--;const min=Math.floor(remainingSeconds/60),sec=remainingSeconds%60;$('timer').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;if(remainingSeconds<=0){clearInterval(timerId);submitTest(true)}},1000)}async function submitTest(autoSubmit=false){if(submitting)return;submitting=true;if(timerId)clearInterval(timerId);if(!autoSubmit&&!confirm('Submit this test now?')){submitting=false;startTimer();return}if(!user){submitting=false;alert('Please sign in before submitting your test.');return}let score=0;questions.forEach((q,index)=>{if(answers[index]===q.answer)score+=Number(q.marks||1)});const solutionData=questions.map((q,index)=>({question:q.question,optionA:q.optionA,optionB:q.optionB,optionC:q.optionC,optionD:q.optionD,selectedAnswer:answers[index]||'',correctAnswer:q.answer,explanation:q.explanation||''}));try{await addDoc(collection(db,'results'),{uid:user.uid,email:user.email||'',name:user.displayName||'',exam,subject,score,totalQuestions:questions.length,solutions:solutionData,submittedAt:new Date()});location.href='student-results.html'}catch(error){console.error(error);submitting=false;alert('Could not save your result. Please check your internet connection and try again.');startTimer()}}$('submitBtn').onclick=()=>submitTest(false);onAuthStateChanged(auth,async u=>{if(u){user=u;await loadQuestions()}else location.href='login.html?next='+encodeURIComponent(location.href)});</script></body></html>
