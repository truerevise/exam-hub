<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Exam Hub | Mock Test</title><style>body{background:#111;color:white;font-family:Arial,sans-serif;margin:0;padding:20px}.card{background:#222;padding:15px;border-radius:10px;margin-bottom:15px}button{width:100%;padding:14px;background:#2962ff;color:white;border:none;border-radius:10px;margin-top:10px;cursor:pointer}select{width:100%;padding:12px;margin:10px 0;background:#222;color:white;border:1px solid #444;border-radius:10px}.status{font-size:14px;color:#9ca3af;margin-top:10px;min-height:20px}.pass{background:#153b27;color:#86efac;padding:10px;border-radius:10px;margin-top:10px}.lock{background:#3b2614;color:#fbbf24;padding:10px;border-radius:10px;margin-top:10px}</style></head><body><h2>Start Mock Test</h2><div class="card"><select id="examSelect"><option value="">Select Exam</option></select><select id="subjectSelect" disabled><option value="">Select Subject</option></select><div id="access" class="status"></div><button id="startBtn">Start Test</button><div id="status" class="status"></div></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const examSelect=document.getElementById('examSelect'),subjectSelect=document.getElementById('subjectSelect'),status=document.getElementById('status'),access=document.getElementById('access'),params=new URLSearchParams(location.search),requestedExam=params.get('exam'),requestedSubject=params.get('subject');let user=null,settings={freeExams:[]},premiumUntil=0;function setStatus(m){status.textContent=m}async function loadAccess(){const s=await getDoc(doc(db,'passSettings','main'));if(s.exists())settings={...settings,...s.data()};const p=await getDoc(doc(db,'students',user.uid));premiumUntil=p.exists()?Number(p.data().premiumUntil||0):0;updateAccess()}function isFree(){return settings.freeExams?.includes(examSelect.value)}function hasPremium(){return premiumUntil>Date.now()}function updateAccess(){if(!examSelect.value){access.textContent='';access.className='status';return}if(isFree()){access.textContent='🟢 FREE EXAM';access.className='pass'}else if(hasPremium()){access.textContent='👑 PREMIUM PASS ACTIVE';access.className='pass'}else{access.textContent='🔒 PREMIUM — ₹'+(settings.price||20)+' pass required';access.className='lock'}}async function loadExams(){try{setStatus('Loading exams...');const snapshot=await getDocs(collection(db,'exams'));const names=[];snapshot.forEach(d=>{const n=d.data().name;if(n&&!names.includes(n))names.push(n)});names.sort().forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;examSelect.appendChild(o)});if(requestedExam&&names.includes(requestedExam))examSelect.value=requestedExam;if(examSelect.value)await loadSubjects();else setStatus(names.length?'Select an exam and subject.':'No exams are available yet.')}catch(e){console.error(e);setStatus('Unable to load exams.')}}async function loadSubjects(){subjectSelect.innerHTML='<option value="">Select Subject</option>';subjectSelect.disabled=true;if(!examSelect.value)return;try{setStatus('Loading subjects...');const snapshot=await getDocs(collection(db,'questions'));const subjects=new Set();snapshot.forEach(d=>{const x=d.data();if(x.exam===examSelect.value&&x.subject)subjects.add(x.subject)});[...subjects].sort().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;subjectSelect.appendChild(o)});subjectSelect.disabled=!subjects.size;if(requestedSubject&&subjects.has(requestedSubject))subjectSelect.value=requestedSubject;updateAccess();setStatus(subjects.size?`${subjects.size} subject${subjects.size===1?'':'s'} available.`:'No questions are available for this exam yet.')}catch(e){console.error(e);setStatus('Unable to load subjects.')}}examSelect.addEventListener('change',async()=>{await loadSubjects();updateAccess()});document.getElementById('startBtn').onclick=()=>{const exam=examSelect.value,subject=subjectSelect.value;if(!exam||!subject){alert('Please select an exam and subject.');return}if(!isFree()&&!hasPremium()){if(confirm('This exam requires a Premium Pass. Open the Premium Pass page?'))location.href='pass-access.html';return}location.href=`test.html?exam=${encodeURIComponent(exam)}&subject=${encodeURIComponent(subject)}`};onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}user=u;await loadAccess();await loadExams()});</script></body></html>
