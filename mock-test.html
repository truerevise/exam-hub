<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Test</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}
.card{
    background:#222;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}
button{
    width:100%;
    padding:14px;
    background:#2962ff;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:10px;
}
select{
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:10px;
}
</style>

</head>

<body>

<h2>Start Mock Test</h2>

<div class="card">

<select id="examSelect">
<option>Select Exam</option>
</select>

<select id="subjectSelect">
<option>Select Subject</option>
</select>


<button id="startBtn">
Start Test
</button>

</div>
<script type="module">

import { db } from "./firebase-config.js";
import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const examSelect = document.getElementById("examSelect");

async function loadExams(){

const snapshot = await getDocs(collection(db,"exams"));

snapshot.forEach(doc=>{

const option=document.createElement("option");

option.value=doc.data().name;
option.textContent=doc.data().name;

examSelect.appendChild(option);

});

}

loadExams();

examSelect.addEventListener("change", loadSubjects);

async function loadSubjects() {
const subjectSelect = document.getElementById("subjectSelect");

subjectSelect.innerHTML = '<option>Select Subject</option>';

const snapshot = await getDocs(collection(db, "questions"));

const subjects = new Set();

snapshot.forEach(doc => {
    const data = doc.data();

    if (data.exam === examSelect.value) {
        subjects.add(data.subject);
    }
});

subjects.forEach(subject => {
    const option = document.createElement("option");
    option.value = subject;
    option.textContent = subject;
    subjectSelect.appendChild(option);
});
}
document.getElementById("startBtn").addEventListener("click", () => {

    const exam = document.getElementById("examSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    

    window.location.href =
`test.html?exam=${encodeURIComponent(exam)}&subject=${encodeURIComponent(subject)}`;
});
</script>
    
</body>
</html>
