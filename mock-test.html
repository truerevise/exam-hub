<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/mock-test.html">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Tests | TrueRevise"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18233b,#080b12 45%);color:#f5f7fb;font-family:Inter,system-ui,Arial;min-height:100vh;padding:18px 12px 50px}main{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 2px 22px}.brand{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#aebcff}.back{border:1px solid #29364e;background:#111827;color:#cbd5e1;border-radius:10px;padding:9px 12px;font-weight:800}.hero{padding:4px 2px 18px}.eyebrow{display:inline-block;padding:6px 9px;border:1px solid #31518e;border-radius:999px;color:#93c5fd;background:#102344;font-size:10px;font-weight:900}.hero h1{font-size:clamp(28px,6vw,42px);margin:14px 0 7px}.hero p{color:#9aa5b5;line-height:1.6;margin:0;max-width:700px}.panel{background:#101620e8;border:1px solid #293242;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px #0005}.panel-head{padding:18px;border-bottom:1px solid #293242;display:flex;justify-content:space-between;gap:10px;align-items:center}.panel-title{font-size:18px;font-weight:900}.muted{color:#8f9bb5;font-size:12px;margin-top:4px}.count{white-space:nowrap;border:1px solid #29364e;background:#171e2a;border-radius:999px;padding:7px 10px;color:#b8c3d8;font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}.card{border:1px solid #293242;background:linear-gradient(145deg,#151c27,#0e141d);border-radius:17px;padding:16px;color:#f5f7fb}.card:hover{border-color:#3b6cff}.card-top{display:flex;justify-content:space-between;align-items:center}.icon{width:42px;height:42px;border-radius:12px;background:#1d2635;border:1px solid #2c384b;display:grid;place-items:center;color:#91a9ff;font-weight:900}.name{font-size:16px;font-weight:900;margin-top:13px}.meta{color:#9aa5b5;font-size:12px;line-height:1.5;margin-top:6px}.btn{width:100%;margin-top:14px;border:1px solid #4e73e8;border-radius:10px;padding:11px;background:linear-gradient(135deg,#3b6cff,#2d59db);color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#182238;border-color:#31405d}.badge{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:#082f1d;color:#86efac;border:1px solid #14532d}.premium{background:#3a2b0d;color:#fcd34d;border-color:#6d5218}.notice{margin:14px;padding:13px 15px;border-radius:13px;background:#111b2b;border:1px solid #304d80;color:#b8c8ef;font-size:12px;line-height:1.5}.hidden{display:none!important}.subject-toolbar{padding:14px 14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.subject-toolbar button{border:1px solid #34415b;background:#182238;color:#cbd5e1;border-radius:9px;padding:8px 11px;font-weight:800}.subject-grid .card{min-height:150px}.selected{border-color:#3b6cff;box-shadow:0 0 0 1px #3b6cff66}.empty{text-align:center;padding:35px 18px;color:#8f9bb5}.loading{text-align:center;padding:35px;color:#8f9bb5}@media(max-width:620px){body{padding:12px 10px 40px}.grid{grid-template-columns:1fr;padding:11px}.top{padding-bottom:16px}.panel{border-radius:18px}.hero h1{font-size:30px}}
</style></head><body><main><header class="top"><div class="brand">◆ TrueRevise</div><button class="back" onclick="location.href='exam-dashboard.html'">← Exams</button></header><section class="hero"><span class="eyebrow">EXAM-WISE PRACTICE</span><h1 id="title">Mock Tests</h1><p id="intro">Choose an exam, then choose a subject. Only tests belonging to the selected subject will be shown.</p></section><section id="examPanel" class="panel"><div class="panel-head"><div><div class="panel-title">Choose an exam</div><div class="muted">Select your target examination</div></div><span id="examCount" class="count">Loading...</span></div><div id="examGrid" class="grid"><div class="loading">Loading exams...</div></div></section><section id="subjectPanel" class="panel hidden"><div class="panel-head"><div><div class="panel-title" id="subjectTitle">Choose a subject</div><div class="muted" id="subjectHint">Subjects are separated by exam.</div></div><span id="subjectCount" class="count"></span></div><div class="subject-toolbar"><button id="allSubjects">All subjects</button><span class="muted" id="filterLabel"></span></div><div id="subjectGrid" class="grid"></div></section><section id="testsPanel" class="panel hidden" style="margin-top:14px"><div class="panel-head"><div><div class="panel-title" id="testsTitle">Tests</div><div class="muted">Only tests for the selected subject are shown.</div></div><span id="testCount" class="count"></span></div><div id="testGrid" class="grid"></div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,doc,getDoc,query,where}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id);const p=new URLSearchParams(location.search);let requestedExam=p.get('exam'),requestedSubject=p.get('subject'),user=null,premiumUntil=0,allQuestions=[];function canonical(n){const x=String(n||'').trim().toLowerCase();if(['tg set','ts set','telangana set'].includes(x))return'Telangana SET';return String(n||'').trim()}function expiry(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;const d=new Date(v).getTime();return Number.isFinite(d)?d:0}function premium(){return premiumUntil>Date.now()}async function access(){const s=await getDoc(doc(db,'students',user.uid));premiumUntil=s.exists()?expiry(s.data().premiumUntil):0}function examNames(){const s=new Set(['TG Police','UGC NET','TSPSC','Telangana SET']);allQuestions.forEach(x=>{if(x.exam)s.add(String(x.exam).trim())});return[...s].sort((a,b)=>a.localeCompare(b))}function examCard(name){const b=document.createElement('button');b.className='card';b.style.textAlign='left';b.innerHTML=`<div class="card-top"><div class="icon">◆</div><span class="badge">VIEW</span></div><div class="name"></div><div class="meta">Open subjects and tests</div>`;b.querySelector('.name').textContent=name;b.onclick=()=>openExam(name);return b}function subjectCard(subject,count,selected){const d=document.createElement('div');d.className='card'+(selected?' selected':'');d.innerHTML=`<div class="card-top"><div class="icon">◎</div><span class="badge">SUBJECT</span></div><div class="name"></div><div class="meta">${count} question${count===1?'':'s'} available</div><button class="btn">View ${subject} Tests →</button>`;d.querySelector('.name').textContent=subject;d.querySelector('.btn').onclick=()=>openSubject(subject);return d}function testCard(subject,count,i){const d=document.createElement('div');d.className='card';const has=premium();d.innerHTML=`<div class="card-top"><div class="icon">${String(i+1).padStart(2,'0')}</div><span class="badge ${has?'premium':''}">${has?'PREMIUM ACTIVE':'AVAILABLE TO VIEW'}</span></div><div class="name">${subject} Test ${i+1}</div><div class="meta">${count} question${count===1?'':'s'} • Subject-wise mock test</div><button class="btn ${has?'':'secondary'}">${has?'Attempt Test →':'🔒 Get Premium to Attempt'}</button>`;d.querySelector('.btn').onclick=()=>{if(has){location.href=`test.html?exam=${encodeURIComponent(currentExam)}&subject=${encodeURIComponent(subject)}`}else{location.href='pass-access.html?from='+encodeURIComponent(location.href)}};return d}let currentExam='',currentSubject='';async function openExam(name){currentExam=canonical(name);currentSubject='';history.replaceState(null,'',`mock-test.html?exam=${encodeURIComponent(currentExam)}`);$('examPanel').classList.add('hidden');$('subjectPanel').classList.remove('hidden');$('testsPanel').classList.add('hidden');$('title').textContent=currentExam+' Mock Tests';$('intro').textContent=currentExam==='Telangana SET'?'Choose one TG SET subject. After selecting it, only that subject’s tests will be displayed.':'Choose a subject to see only the tests related to it.';const rows=allQuestions.filter(x=>canonical(x.exam)===currentExam);const m=new Map();rows.forEach(x=>{const s=String(x.subject||'').trim()||'Unassigned';m.set(s,(m.get(s)||0)+1)});const list=[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]));$('subjectCount').textContent=`${list.length} subject${list.length===1?'':'s'}`;$('subjectGrid').innerHTML='';if(!list.length){$('subjectGrid').innerHTML='<div class="empty">No subjects/tests are available for this examination yet.</div>';return}list.forEach(([s,c])=>$('subjectGrid').appendChild(subjectCard(s,c,false)));if(requestedSubject&&list.some(([s])=>s===requestedSubject))openSubject(requestedSubject)}function openSubject(subject){currentSubject=subject;history.replaceState(null,'',`mock-test.html?exam=${encodeURIComponent(currentExam)}&subject=${encodeURIComponent(subject)}`);$('filterLabel').textContent='Selected: '+subject;$('testsPanel').classList.remove('hidden');$('testsTitle').textContent=subject+' — Mock Tests';const rows=allQuestions.filter(x=>canonical(x.exam)===currentExam&&String(x.subject||'').trim()===subject);const total=rows.length;const tests=Math.max(1,Math.ceil(total/25));$('testCount').textContent=`${tests} test${tests===1?'':'s'}`;$('testGrid').innerHTML='';for(let i=0;i<tests;i++){$('testGrid').appendChild(testCard(subject,Math.min(25,total-i*25),i))}$('testsPanel').scrollIntoView({behavior:'smooth',block:'start'})}async function load(){const q=await getDocs(collection(db,'questions'));allQuestions=q.docs.map(d=>({id:d.id,...d.data()}));const names=examNames();$('examCount').textContent=`${names.length} available`;$('examGrid').innerHTML='';names.forEach(n=>$('examGrid').appendChild(examCard(n)));if(requestedExam){const n=canonical(requestedExam);if(names.includes(n))await openExam(n)}}$('allSubjects').onclick=()=>{currentSubject='';$('testsPanel').classList.add('hidden');history.replaceState(null,'',`mock-test.html?exam=${encodeURIComponent(currentExam)}`)};onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}user=u;try{await access();await load()}catch(e){console.error(e);$('examGrid').innerHTML='<div class="empty">Unable to load exams. Please refresh.</div>'}});</script></body></html>
