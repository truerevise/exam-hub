<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#080b12"><style>:root{--bg:#080b12;--panel:#111722;--line:#273244;--text:#f5f7fb;--muted:#9aa5b5;--blue:#3b6cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0%,#17233d,#080b12 48%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.admin-wrap{width:min(650px,100%)}.admin-brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:900;margin:0 0 30px}.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#6d4aff);display:grid;place-items:center;box-shadow:0 10px 28px rgba(37,99,235,.25)}.admin-card{background:rgba(17,23,34,.95);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.admin-card h2{margin-top:0}.admin-card p{color:var(--muted);line-height:1.5}.admin-card button{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;font-weight:800;font-size:16px;cursor:pointer}.msg{min-height:24px;margin-top:14px;color:#ff9aa7;line-height:1.4}.ok{color:#55dd99}</style></head><body><div class="admin-wrap"><div class="admin-brand"><span class="mark">⚙️</span>True Revise Admin</div><section class="admin-card"><h2>Admin Login</h2><p>Continue securely with your authorized Google account.</p><button id="googleBtn">🔐 Continue with Google</button><div id="loginMsg" class="msg"></div></section></div><script type="module">import{auth}from'./firebase-config.js';import{GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';const SUPER_ADMINS=['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com'];const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const msg=document.getElementById('loginMsg');function isAdmin(u){return!!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()))}function redirectAdmin(){msg.className='msg ok';msg.textContent='Login successful. Opening Admin Dashboard...';setTimeout(()=>location.replace('./admin-dashboard.html'),150)}onAuthStateChanged(auth,u=>{if(isAdmin(u))redirectAdmin();else if(u){msg.className='msg';msg.textContent='Signed in as '+(u.email||'unknown')+'. This account is not authorized as True Revise Admin.';signOut(auth).catch(console.error)}});document.getElementById('googleBtn').onclick=async()=>{msg.className='msg';msg.textContent='Opening Google sign-in...';try{await setPersistence(auth,browserLocalPersistence);const result=await signInWithPopup(auth,provider);if(isAdmin(result.user))redirectAdmin();else{msg.textContent='This Google account is not authorized as True Revise Admin.';await signOut(auth)}}catch(e){console.error(e);msg.className='msg';msg.textContent='Sign-in error: '+(e?.code||'unknown')+' — '+(e?.message||'Please try again.')}};</script></body></html>
