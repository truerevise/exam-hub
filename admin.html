<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Exam Hub | Admin Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-wrap{max-width:650px;margin:auto;padding:20px}.admin-brand{font-size:28px;font-weight:800;margin:20px 0 70px}.admin-card{background:#1f1f1f;border:1px solid #333;border-radius:16px;padding:28px}.admin-card h2{margin-top:0}.admin-card p{color:#aaa}.admin-card button{width:100%;padding:14px;border:0;border-radius:10px;background:#2962ff;color:white;font-weight:700;font-size:16px}.msg{min-height:24px;margin-top:14px;color:#ff7777;line-height:1.4}.ok{color:#55dd99}
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="admin-brand">🛠️ Exam Hub Admin</div>
  <section class="admin-card">
    <h2>Admin Login</h2>
    <p>Continue securely with your Google account.</p>
    <button id="googleBtn">🔐 Continue with Google</button>
    <div id="loginMsg" class="msg"></div>
  </section>
</div>
<script type="module">
import {auth} from './firebase-config.js';
import {GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
const ADMIN_EMAIL='kiransingh.smile@gmail.com'.toLowerCase();
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});
const msg=document.getElementById('loginMsg');
function isAdmin(u){return !!(u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL);}
function redirectAdmin(){
  msg.className='msg ok';
  msg.textContent='Login successful. Opening Admin Dashboard...';
  setTimeout(()=>location.replace('./admin-dashboard.html'),150);
}
onAuthStateChanged(auth,(u)=>{
  if(isAdmin(u)) redirectAdmin();
  else if(u){
    msg.className='msg';
    msg.textContent='Signed in as '+(u.email||'unknown')+'. This account is not authorized as Exam Hub Admin.';
    signOut(auth).catch(console.error);
  }
});
document.getElementById('googleBtn').onclick=async()=>{
  msg.className='msg';
  msg.textContent='Opening Google sign-in...';
  try{
    await setPersistence(auth,browserLocalPersistence);
    const result=await signInWithPopup(auth,provider);
    if(isAdmin(result.user)) redirectAdmin();
    else {
      msg.textContent='This Google account is not authorized as Exam Hub Admin.';
      await signOut(auth);
    }
  }catch(e){
    console.error(e);
    msg.className='msg';
    msg.textContent='Sign-in error: '+(e?.code||'unknown')+' — '+(e?.message||'Please try again.');
  }
};
</script>
</body>
</html>
