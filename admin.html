
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Hub Admin</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

<header>

<div style="display:flex;justify-content:space-between;align-items:center;">

<div style="display:flex;align-items:center;gap:10px;">
<span class="material-icons">admin_panel_settings</span>
<div class="logo">Exam Hub Admin</div>
</div>

<div style="display:flex;gap:15px;">
<span class="material-icons">notifications</span>
<span class="material-icons">account_circle</span>
</div>

</div>

</header>

<div class="container">

<h2>Admin Dashboard</h2>

<div class="exam-grid">

<div class="card">
<h3>➕ Add Question</h3>
<button onclick="window.location.href='add-question.html'">
Add
</button>
  
</div>

<div class="card">
<h3>📚 Question Bank</h3>
<button>Open</button>
</div>

<div class="card">
<h3>🔥 Create Live Test</h3>
<button>Create</button>
</div>

<div class="card">
<h3>📢 Notifications</h3>
<button>Post</button>
</div>

<div class="card">
<h3>👥 Students</h3>
<button>View</button>
</div>

<div class="card">
<h3>📊 Results</h3>
<button>Open</button>
</div>

<div class="card">
<h3>⚙ Settings</h3>
<button>Open</button>
</div>

<div class="card">
<h3>🚪 Logout</h3>
<button>Logout</button>
</div>

</div>

</div>

</body>
</html>
