<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Exam Hub</title>
<style>
body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
.container{width:min(400px,100%);background:#171a21;border:1px solid #2b3240;padding:28px;border-radius:18px;box-sizing:border-box}
h2{text-align:center;color:#60a5fa;margin-top:0}input{width:100%;padding:13px;margin:9px 0;background:#1e232d;color:#fff;border:1px solid #394354;border-radius:9px;box-sizing:border-box}button{width:100%;padding:13px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-weight:700;font-size:16px;cursor:pointer}button:hover{background:#1d4ed8}.links{text-align:center;margin-top:16px}.links a{color:#60a5fa;text-decoration:none;display:block;margin:9px}.message{text-align:center;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="container">
<h2>Student Login</h2>
<input type="email" id="email" placeholder="Email Address" autocomplete="email">
<input type="password" id="password" placeholder="Password" autocomplete="current-password">
<button id="loginBtn">Login</button>
<p id="message" class="message"></p>
<div class="links"><a href="forgot-password.html">Forgot Password?</a><a href="register.html">Create a new account</a></div>
</div>
<script type="module">
import { auth } from "./firebase-config.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
const email=document.getElementById("email"), password=document.getElementById("password"), message=document.getElementById("message"), btn=document.getElementById("loginBtn");
btn.addEventListener("click",async()=>{message.textContent="";const e=email.value.trim(),p=password.value;if(!e||!p){message.textContent="Please enter email and password.";return;}btn.disabled=true;try{await signInWithEmailAndPassword(auth,e,p);message.style.color="#86efac";message.textContent="Login successful!";setTimeout(()=>location.href="dashboard.html",500);}catch(error){message.style.color="#fca5a5";message.textContent=error.code==="auth/invalid-credential"?"Invalid email or password.":"Unable to login. Please try again.";btn.disabled=false;}});
</script>
</body>
</html>
