<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:0;
}

.container{
width:90%;
max-width:400px;
margin:60px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
color:#0d6efd;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#084298;
}

#message{
text-align:center;
margin-top:10px;
color:red;
}
</style>
</head>

<body>

<div class="container">

<h2>Student Login</h2>

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

<p id="message"></p>

</div>

</body>
</html>
