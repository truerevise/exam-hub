<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><style>:root{--bg:#070b14;--panel:#111827;--line:#273244;--text:#f8fafc;--muted:#94a3b8;--blue:#3b82f6}*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% 0%,#17243d,#070b14 48%);color:var(--text);margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}.container{width:min(410px,100%);background:rgba(17,24,39,.96);border:1px solid var(--line);padding:28px;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.brand{text-align:center;color:#60a5fa;font-weight:900;letter-spacing:.04em;font-size:13px;text-transform:uppercase}.logo{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 10px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:23px}h2{text-align:center;margin:8px 0 6px;font-size:25px}.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 20px}input{width:100%;padding:13px;margin:7px 0;background:#0d1422;color:#fff;border:1px solid #394354;border-radius:10px;outline:none}input:focus{border-color:#4f7ff2;box-shadow:0 0 0 3px rgba(59,130,246,.12)}button{width:100%;padding:13px;margin-top:8px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border:0;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.message{text-align:center;margin-top:12px;min-height:20px;font-size:13px}.links{text-align:center;margin-top:15px}.links a{color:#60a5fa;text-decoration:none;display:block;margin:9px;font-size:13px}.verify{display:none;margin:14px 0 8px;padding:12px;border:1px solid rgba(96,165,250,.25);border-radius:11px;background:rgba(59,130,246,.08);color:#bfdbfe;font-weight:800;text-align:center}.continue{text-align:center;margin:15px 0 0;padding:10px;border:1px solid rgba(96,165,250,.2);border-radius:10px;background:rgba(59,130,246,.07);color:#bfdbfe;font-size:12px;line-height:1.4}</style></head><body><div class="container"><div class="brand"><div class="logo">🎓</div>True Revise</div><h2>Student Login</h2><p class="sub">Login to continue to your dashboard.</p><div id="continueBox" class="continue" style="display:none">Continue to your requested page after login.</div><input type="email" id="email" placeholder="Email Address" autocomplete="email"><input type="password" id="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Login & Continue</button><p id="message" class="message"></p><a id="verifyLink" class="verify" href="#">✓ Verify / Complete My Account</a><div class="links"><a href="forgot-password.html">Forgot Password?</a><a href="register.html">Create a new account</a></div></div><script type="module">import{auth,db,authReady}from'./firebase-config.js';import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const p=new URLSearchParams(location.search),requested=p.get('next'),safeNext=requested&&requested.startsWith('/')&&!requested.startsWith('//')?requested:(requested&&!requested.startsWith('http')&&!requested.includes(':')?requested:'dashboard.html'),email=document.getElementById('email'),password=document.getElementById('password'),message=document.getElementById('message'),btn=document.getElementById('loginBtn'),verifyLink=document.getElementById('verifyLink'),continueBox=document.getElementById('continueBox');if(requested)continueBox.style.display='block';async function getSettings(){try{const s=await getDoc(doc(db,'appSettings','site'));const d=s.exists()?s.data():{};return{emailRequired:d.emailVerificationRequired===true,mobileRequired:d.mobileVerificationRequired===true}}catch(_){return{emailRequired:false,mobileRequired:false}}}async function go(){message.textContent='';const e=email.value.trim(),pw=password.value;if(!e||!pw){message.textContent='Please enter email and password.';return}btn.disabled=true;try{await authReady;const settings=await getSettings();const cred=await signInWithEmailAndPassword(auth,e,pw);await cred.user.reload();const user=auth.currentUser;const emailOk=!settings.emailRequired||!!user.emailVerified,phoneOk=!settings.mobileRequired||!!user.phoneNumber;if(!emailOk||!phoneOk){message.style.color='#fbbf24';message.textContent=!emailOk?'Please verify your email first. Then continue below.':'Please verify your mobile number with OTP. Continue below.';verifyLink.style.display='block';verifyLink.textContent='✓ Verify / Complete My Account';verifyLink.href='verify-account.html?next='+encodeURIComponent(safeNext);return}message.style.color='#86efac';message.textContent='Login successful! Redirecting…';setTimeout(()=>location.href=safeNext,250)}catch(error){message.style.color='#fca5a5';message.textContent=error.code==='auth/invalid-credential'?'Invalid email or password.':'Unable to login. Please try again.'}finally{btn.disabled=false}}btn.addEventListener('click',go);</script></body></html>
