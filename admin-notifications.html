<meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:#101827;border:1px solid #263149;border-radius:16px;padding:18px;margin:14px 0}input,textarea,select{width:100%;padding:11px;border-radius:9px;border:1px solid #33415d;background:#0b1220;color:#fff;margin:7px 0}.btn{padding:11px 15px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:800}.item{padding:14px;border:1px solid #263149;border-radius:12px;margin:10px 0}.muted{color:#8f9bb5;font-size:12px}.danger{background:#7f1d1d}</style></head><body><main class="wrap"><h1>🔔 Notification Center</h1><div class="muted">Publish announcements to the student site. Notifications are stored in Firestore and can be rendered by the student UI.</div><section class="card"><input id="title" placeholder="Notification title"><textarea id="message" rows="5" placeholder="Message"></textarea><select id="type"><option>Announcement</option><option>Live Test</option><option>Premium</option><option>Maintenance</option><option>Important</option></select><button class="btn" id="publish">Publish Notification</button><span id="msg"></span></section><section class="card"><h2>Recent notifications</h2><div id="list">Loading…</div></section><button class="btn" onclick="history.back()">← Back</button></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,addDoc,serverTimestamp,query,orderBy,limit,getDocs,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com',$=x=>document.getElementById(x);let ok=false;onAuthStateChanged(auth,u=>{ok=!!u&&isSuperAdmin(u);if(!ok)return location.replace('admin.html');load()});async function load(){const q=query(collection(db,'notifications'),orderBy('createdAt','desc'),limit(30));const s=await getDocs(q);$('list').innerHTML=s.empty?'<p class="muted">No notifications yet.</p>':s.docs.map(x=>{const d=x.data();return `<div class="item"><b>${esc(d.title)}</b><div class="muted">${esc(d.type||'Announcement')} • ${d.active===false?'Hidden':'Published'}</div><p>${esc(d.message)}</p><button class="btn danger" data-id="${x.id}">Delete</button></div>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this notification?')){await deleteDoc(doc(db,'notifications',b.dataset.id));load()}})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('publish').onclick=async()=>{if(!ok)return;const title=$('title').value.trim(),message=$('message').value.trim();if(!title||!message)return alert('Enter title and message.');await addDoc(collection(db,'notifications'),{title,message,type:$('type').value,active:true,createdAt:serverTimestamp(),createdBy:auth.currentUser.email});await addDoc(collection(db,'auditLogs'),{action:'PUBLISH_NOTIFICATION',admin:auth.currentUser.email,createdAt:serverTimestamp(),details:{title,type:$('type').value}});$('title').value='';$('message').value='';$('msg').textContent=' ✓ Published';setTimeout(()=>$('msg').textContent='',2000);load()}</script></body></html>
