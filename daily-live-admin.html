<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Hub | Daily Live Tests</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.top a{color:#155eef;text-decoration:none}.card{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(20,40,80,.06)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:700;margin:8px 0 6px}.field input,.field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5dce7;border-radius:10px;font-size:15px}.question-list{max-height:520px;overflow:auto;border:1px solid #e1e6ee;border-radius:12px}.q{display:flex;gap:10px;padding:13px;border-bottom:1px solid #edf0f4}.q:last-child{border-bottom:0}.q input{margin-top:4px}.q-text{flex:1}.muted{color:#687386;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:11px 16px;background:#155eef;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#eef3ff;color:#155eef}.msg{margin-top:10px;font-weight:700}.live{border:1px solid #dfe6ef;border-radius:12px;padding:14px;margin-top:10px}.badge{display:inline-block;background:#e9f8ef;color:#087a38;border-radius:20px;padding:4px 8px;font-size:12px;font-weight:700}.expired{background:#fff0f0;color:#b42318}.search{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5dce7;border-radius:10px;margin:10px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style><!-- TrueRevise SEO -->
<meta name="robots" content="noindex,nofollow">
</head><body><div class="wrap"><div class="top"><a href="admin-dashboard.html">← Admin Dashboard</a><button id="logout">Logout</button></div><div class="card"><h1>⚡ Daily Live Test</h1><p class="muted">Choose questions from your question bank, give the test a title, and publish it for exactly 24 hours.</p><div class="grid"><div class="field"><label>Test Title</label><input id="title" placeholder="e.g. Daily Commerce Challenge - 01"></div><div class="field"><label>Exam</label><input id="exam" placeholder="e.g. UGC NET"></div></div><div class="actions"><button id="selectAll" class="secondary">Select All</button><button id="clearAll" class="secondary">Clear All</button><button id="publish">🚀 Publish Live Test</button></div><div id="msg" class="msg"></div></div><div class="card"><h2>Choose Questions</h2><input id="search" class="search" placeholder="Search questions, exam or subject..."><div id="questions" class="question-list">Loading questions...</div></div><div class="card"><h2>Published Tests</h2><div id="published">Loading...</div></div></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,addDoc,serverTimestamp,Timestamp,query,orderBy}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const $=id=>document.getElementById(id);let questions=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN.toLowerCase()){location.replace('admin.html');return}load()});async function load(){await loadQuestions();await loadPublished()}async function loadQuestions(){try{const s=await getDocs(collection(db,'questions'));questions=s.docs.map(d=>({id:d.id,...d.data()}));renderQuestions()}catch(e){$('questions').innerHTML='<div class="q">Unable to load questions. Check Firestore permissions.</div>'}}function renderQuestions(){const q=$('search').value.toLowerCase().trim();const list=questions.filter(x=>`${x.question||''} ${x.exam||''} ${x.subject||''}`.toLowerCase().includes(q));$('questions').innerHTML=list.length?list.map(x=>`<label class="q"><input type="checkbox" value="${x.id}" data-exam="${esc(x.exam||'')}"><span class="q-text"><b>${esc(x.question||'Question')}</b><br><span class="muted">${esc(x.exam||'')} • ${esc(x.subject||'')}</span></span></label>`).join(''):'<div class="q">No questions found.</div>'}$('search').oninput=renderQuestions;$('selectAll').onclick=()=>document.querySelectorAll('#questions input[type=checkbox]').forEach(x=>x.checked=true);$('clearAll').onclick=()=>document.querySelectorAll('#questions input[type=checkbox]').forEach(x=>x.checked=false);$('publish').onclick=async()=>{const title=$('title').value.trim(),exam=$('exam').value.trim(),ids=[...document.querySelectorAll('#questions input:checked')].map(x=>x.value);if(!title){$('msg').textContent='Enter a test title.';return}if(!ids.length){$('msg').textContent='Select at least one question.';return}const now=new Date(),end=new Date(now.getTime()+24*60*60*1000);try{await addDoc(collection(db,'dailyTests'),{title,exam,questionIds:ids,startAt:Timestamp.fromDate(now),endAt:Timestamp.fromDate(end),durationMinutes:60,createdAt:serverTimestamp(),active:true});$('msg').textContent=`Published successfully. Live for 24 hours (${end.toLocaleString()}).`;$('title').value='';document.querySelectorAll('#questions input').forEach(x=>x.checked=false);loadPublished()}catch(e){console.error(e);$('msg').textContent='Could not publish. Check Firestore permissions.'}};async function loadPublished(){try{const s=await getDocs(collection(db,'dailyTests'));const data=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('published').innerHTML=data.length?data.map(x=>{const end=x.endAt?.toDate?.()||new Date(x.endAt);const live=end>new Date();return `<div class="live"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.exam||'')} • ${x.questionIds?.length||0} questions</span><br><span class="badge ${live?'':'expired'}">${live?'LIVE • ends '+end.toLocaleString():'EXPIRED'}</span><br><a href="daily-test.html?id=${encodeURIComponent(x.id)}">Student View</a></div>`}).join(''):'<div class="muted">No daily tests published yet.</div>'}catch(e){$('published').innerHTML='<div class="muted">Unable to load published tests.</div>'}}$('logout').onclick=async()=>{await signOut(auth);location.replace('admin.html')};</script></body></html>
