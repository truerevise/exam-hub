<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/daily-live-admin.html">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top a{color:#2563eb;text-decoration:none}.card{background:#fff;border:1px solid #e5e9f2;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(15,23,42,.04)}h1,h2{margin:0 0 12px}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:#667085;margin-bottom:6px}.field input,.search{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8dee9;border-radius:9px;background:#fff;color:#172033}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#344054;border:1px solid #d0d5dd}.status{margin-top:10px;font-weight:600}.question-list{max-height:520px;overflow:auto;border:1px solid #e4e7ec;border-radius:10px;margin-top:10px}.q{display:flex;gap:10px;padding:12px;border-bottom:1px solid #edf0f4}.q:last-child{border-bottom:0}.q-text{flex:1}.live{border:1px solid #e4e7ec;border-radius:10px;padding:13px;margin-top:10px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#ecfdf3;color:#027a48;font-size:12px;font-weight:700}.expired{background:#fef3f2;color:#b42318}.error{color:#b42318;background:#fef3f2;border:1px solid #fecdca;border-radius:9px;padding:10px;margin-top:10px;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="admin-dashboard.html">← Admin Dashboard</a>
    <button id="logout">Logout</button>
  </div>

  <div class="card">
    <h1>⚡ Daily Live Tests</h1>
    <p class="muted">Create a professional 24-hour test from your existing Question Bank.</p>
    <div class="grid">
      <div class="field"><label>TEST TITLE</label><input id="title" placeholder="Daily Commerce Test - Day 01"></div>
      <div class="field"><label>EXAM / CATEGORY</label><input id="exam" placeholder="UGC NET Commerce"></div>
      <div class="field"><label>TEST DURATION (MINUTES)</label><input id="duration" type="number" min="1" max="300" value="30"></div>
    </div>
    <div class="actions">
      <button id="selectAll" class="secondary">Select All</button>
      <button id="clearAll" class="secondary">Clear All</button>
      <button id="publish">🚀 Publish Live Test</button>
      <button id="manage" class="secondary">🎯 Manage Attempts</button>
    </div>
    <div id="msg" class="status"></div>
  </div>

  <div class="card">
    <h2>Choose Questions</h2>
    <p class="muted">Select only the questions you want students to receive.</p>
    <input id="search" class="search" placeholder="Search question, exam, subject or topic...">
    <div id="questions" class="question-list"><div class="q">Waiting for Firebase authentication...</div></div>
  </div>

  <div class="card">
    <h2>Published Tests</h2>
    <div id="published"><div class="muted">Waiting for Firebase authentication...</div></div>
  </div>
</div>

<script type="module">
import {auth, db, authReady} from './firebase-config.js?v=20260823';
import {onAuthStateChanged, signOut} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
import {collection, getDocs, Timestamp, serverTimestamp, writeBatch, doc} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';

const SUPER_ADMINS = new Set([
  'commercewithkiransingh@gmail.com',
  'kiransingh.smile@gmail.com'
]);
const $ = id => document.getElementById(id);
let questions = [];
let authInitialized = false;

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[ch]));
}

function showError(target, message){
  $(target).innerHTML = '<div class="error">'+esc(message)+'</div>';
}

function renderQuestions(){
  const term = $('search').value.toLowerCase().trim();
  const filtered = questions.filter(q => {
    const text = [q.question,q.exam,q.subject,q.topic,q.category,q.questionText].filter(Boolean).join(' ').toLowerCase();
    return text.includes(term);
  });
  if(!filtered.length){
    $('questions').innerHTML = '<div class="q">No questions found.</div>';
    return;
  }
  $('questions').innerHTML = filtered.map(q => `
    <label class="q">
      <input type="checkbox" value="${esc(q.id)}">
      <span class="q-text">
        <b>${esc(q.question || q.questionText || 'Question')}</b><br>
        <span class="muted">${esc(q.exam || q.category || '')}${q.subject ? ' • '+esc(q.subject) : ''}${q.topic ? ' • '+esc(q.topic) : ''}</span>
      </span>
    </label>
  `).join('');
}

async function loadQuestions(){
  $('questions').innerHTML = '<div class="q">Loading Question Bank...</div>';
  try{
    const snap = await getDocs(collection(db,'questions'));
    questions = snap.docs.map(d => ({id:d.id,...d.data()}));
    renderQuestions();
    $('msg').textContent = `Question Bank loaded: ${questions.length} questions.`;
  }catch(error){
    console.error('Daily Live Test question load failed:', error);
    showError('questions', `Question Bank could not be loaded. Firebase error: ${error.code || error.message || 'unknown error'}`);
  }
}

async function loadPublished(){
  $('published').innerHTML = '<div class="muted">Loading...</div>';
  try{
    const snap = await getDocs(collection(db,'dailyLiveTests'));
    const data = snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b) => {
      const at = a.createdAt?.seconds || a.publishedAt?.seconds || 0;
      const bt = b.createdAt?.seconds || b.publishedAt?.seconds || 0;
      return bt-at;
    });
    if(!data.length){
      $('published').innerHTML = '<div class="muted">No Daily Live Tests published yet.</div>';
      return;
    }
    $('published').innerHTML = data.map(t => {
      const end = t.endAt?.toDate ? t.endAt.toDate() : new Date(t.endAt || 0);
      const live = end > new Date();
      return `<div class="live">
        <b>${esc(t.title || 'Untitled Test')}</b><br>
        <span class="muted">${esc(t.exam || '')} • ${(t.questionIds || []).length} questions • ${esc(t.durationMinutes || '-')} minutes</span><br>
        <span class="badge ${live ? '' : 'expired'}">${live ? 'LIVE • ends '+end.toLocaleString() : 'EXPIRED'}</span><br><br>
        <a href="daily-live-test.html?id=${encodeURIComponent(t.id)}">Student View</a> ·
        <a href="admin-live-access.html">Manage Attempts</a>
      </div>`;
    }).join('');
  }catch(error){
    console.error('Daily Live Test published load failed:', error);
    showError('published', `Published Tests could not be loaded. Firebase error: ${error.code || error.message || 'unknown error'}`);
  }
}

async function publish(){
  const title = $('title').value.trim();
  const exam = $('exam').value.trim();
  const duration = Number($('duration').value) || 30;
  const ids = [...document.querySelectorAll('#questions input[type="checkbox"]:checked')].map(x => x.value);
  if(!title){$('msg').textContent='Enter a test title.';return;}
  if(!ids.length){$('msg').textContent='Select at least one question.';return;}
  if(duration < 1 || duration > 300){$('msg').textContent='Duration must be between 1 and 300 minutes.';return;}
  $('msg').textContent='Publishing...';
  try{
    const now = new Date();
    const end = new Date(now.getTime()+24*60*60*1000);
    const testRef = doc(collection(db,'dailyLiveTests'));
    const batch = writeBatch(db);
    batch.set(testRef, {
      title, exam, questionIds: ids,
      publishedAt: Timestamp.fromDate(now),
      startAt: Timestamp.fromDate(now),
      endAt: Timestamp.fromDate(end),
      durationMinutes: duration,
      createdAt: serverTimestamp(),
      active: true
    });
    ids.forEach(qid => batch.set(doc(db,'dailyQuestionAccess',qid), {
      questionId: qid, testId: testRef.id,
      expiresAt: Timestamp.fromDate(end),
      createdAt: serverTimestamp()
    }, {merge:true}));
    await batch.commit();
    $('msg').textContent='Published successfully. Live for 24 hours.';
    $('title').value='';
    document.querySelectorAll('#questions input[type="checkbox"]').forEach(x => x.checked=false);
    await loadPublished();
  }catch(error){
    console.error('Publish failed:',error);
    $('msg').textContent=`Could not publish. Firebase error: ${error.code || error.message || 'unknown error'}`;
  }
}

$('search').addEventListener('input',renderQuestions);
$('selectAll').onclick=()=>document.querySelectorAll('#questions input[type="checkbox"]').forEach(x=>x.checked=true);
$('clearAll').onclick=()=>document.querySelectorAll('#questions input[type="checkbox"]').forEach(x=>x.checked=false);
$('publish').onclick=publish;
$('manage').onclick=()=>location.href='admin-live-access.html';
$('logout').onclick=async()=>{await signOut(auth);location.replace('admin.html');};

// Important: firebase-config.js establishes Auth persistence asynchronously.
// Wait for that to finish before listening for the auth state and touching
// protected Firestore collections. This prevents the first-load race that
// previously required a manual page refresh.
try {
  await authReady;
} catch (error) {
  console.warn('Firebase Auth persistence setup failed; continuing with Auth state:', error);
}

onAuthStateChanged(auth, async user => {
  if (authInitialized) return;
  authInitialized = true;

  if(!user){
    location.replace('admin.html');
    return;
  }

  const email = String(user.email || '').toLowerCase();

  // Current Daily Live admin access is restricted to the configured
  // super-admin accounts. Firestore rules remain the final security layer.
  if(!SUPER_ADMINS.has(email)){
    $('msg').textContent = 'Admin verification failed. Redirecting to Admin Login...';
    location.replace('admin.html');
    return;
  }

  $('msg').textContent='Admin verified. Loading Question Bank...';

  // Deliberately load in this order: Auth ready → Admin verified →
  // Question Bank → Published Tests. This avoids the previous race condition.
  try {
    await loadQuestions();
    await loadPublished();
  } catch (error) {
    console.error('Daily Live Admin initialization failed:', error);
    $('msg').textContent = 'Admin page could not finish loading. Please refresh once and check the console.';
  }
});
</script>
</body>
</html>
