<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/daily-live-admin.html">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#080d18;color:#eef2ff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.top a{color:#78aaff;text-decoration:none}.card{background:#101827;border:1px solid #263149;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#9aa7bd;font-size:12px;margin:8px 0 6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #34415b;border-radius:10px;background:#0b1220;color:#fff}.question-list{max-height:520px;overflow:auto;border:1px solid #263149;border-radius:12px}.q{display:flex;gap:10px;padding:13px;border-bottom:1px solid #202b3e}.q:last-child{border-bottom:0}.q-text{flex:1}.muted{color:#8f9bb5;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#182238;color:#a9c4ff;border:1px solid #31405d}.msg{margin-top:10px;font-weight:700}.live{border:1px solid #2c3950;border-radius:12px;padding:14px;margin-top:10px}.badge{display:inline-block;background:#123522;color:#86efac;border-radius:20px;padding:4px 8px;font-size:12px;font-weight:700}.expired{background:#3a1820;color:#ff9eac}.search{width:100%;box-sizing:border-box;padding:11px;border:1px solid #34415b;border-radius:10px;background:#0b1220;color:#fff;margin:10px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><div class="top"><a href="admin-dashboard.html">← Admin Dashboard</a><button id="logout">Logout</button></div><div class="card"><h1>⚡ Daily Live Test</h1><p class="muted">Choose questions, publish a 24-hour live test, then control attempt limits from the access manager.</p><div class="grid"><div class="field"><label>Test Title</label><input id="title" placeholder="e.g. TG SET Commerce Live 1"></div><div class="field"><label>Exam</label><input id="exam" placeholder="e.g. Telangana SET"></div></div><div class="actions"><button id="selectAll" class="secondary">Select All</button><button id="clearAll" class="secondary">Clear All</button><button id="publish">🚀 Publish Live Test</button><button class="secondary" onclick="location.href='admin-live-access.html'">🎯 Manage Attempts</button></div><div id="msg" class="msg"></div></div><div class="card"><h2>Choose Questions</h2><input id="search" class="search" placeholder="Search questions, exam or subject..."><div id="questions" class="question-list">Loading questions...</div></div><div class="card"><h2>Published Tests</h2><div id="published">Loading...</div></div></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,addDoc,serverTimestamp,Timestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com',$=id=>document.getElementById(id);let questions=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN.toLowerCase()){location.replace('admin.html');return}load()});async function load(){await loadQuestions();await loadPublished()}async function loadQuestions(){try{const s=await getDocs(collection(db,'questions'));questions=s.docs.map(d=>({id:d.id,...d.data()}));renderQuestions()}catch(e){$('questions').innerHTML='<div class="q">Unable to load questions. Check Firestore permissions.</div>'}}function renderQuestions(){const q=$('search').value.toLowerCase().trim();const list=questions.filter(x=>`${x.question||''} ${x.exam||''} ${x.subject||''}`.toLowerCase().includes(q));$('questions').innerHTML=list.length?list.map(x=>`<label class="q"><input type="checkbox" value="${x.id}"><span class="q-text"><b>${esc(x.question||'Question')}</b><br><span class="muted">${esc(x.exam||'')} • ${esc(x.subject||'')}</span></span></label>`).join(''):'<div class="q">No questions found.</div>'}$('search').oninput=renderQuestions;$('selectAll').onclick=()=>document.querySelectorAll('#questions input').forEach(x=>x.checked=true);$('clearAll').onclick=()=>document.querySelectorAll('#questions input').forEach(x=>x.checked=false);$('publish').onclick=async()=>{const title=$('title').value.trim(),exam=$('exam').value.trim(),ids=[...document.querySelectorAll('#questions input:checked')].map(x=>x.value);if(!title){$('msg').textContent='Enter a test title.';return}if(!ids.length){$('msg').textContent='Select at least one question.';return}const now=new Date(),end=new Date(now.getTime()+86400000);try{await addDoc(collection(db,'dailyLiveTests'),{title,exam,questionIds:ids,publishedAt:Timestamp.fromDate(now),startAt:Timestamp.fromDate(now),endAt:Timestamp.fromDate(end),durationMinutes:ids.length,createdAt:serverTimestamp(),active:true});$('msg').textContent=`Published successfully. Live for 24 hours until ${end.toLocaleString()}.`;$('title').value='';document.querySelectorAll('#questions input').forEach(x=>x.checked=false);loadPublished()}catch(e){console.error(e);$('msg').textContent='Could not publish. Check Firestore permissions.'}};async function loadPublished(){try{const s=await getDocs(collection(db,'dailyLiveTests'));const data=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('published').innerHTML=data.length?data.map(x=>{const end=x.endAt?.toDate?.()||new Date(x.endAt);const live=end>new Date();return `<div class="live"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.exam||'')} • ${x.questionIds?.length||0} questions</span><br><span class="badge ${live?'':'expired'}">${live?'LIVE • ends '+end.toLocaleString():'EXPIRED'}</span><br><a href="live-test.html?id=${encodeURIComponent(x.id)}">Student View</a> · <a href="admin-live-access.html">Manage Attempts</a></div>`}).join(''):'<div class="muted">No Daily Live Tests published yet.</div>'}catch(e){$('published').innerHTML='<div class="muted">Unable to load published tests.</div>'}}$('logout').onclick=async()=>{await signOut(auth);location.replace('admin.html')};</script></body></html>
