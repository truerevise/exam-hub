<meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>body{margin:0;background:#101216;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;margin-bottom:15px}.top a{color:#8fa7ff;text-decoration:none;font-weight:800}.card{background:#1b1e24;border:1px solid #343b47;border-radius:16px;padding:18px;margin-bottom:14px}.hero,.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.counts{grid-template-columns:repeat(3,1fr);margin-top:10px}.big,.count{background:#252a32;border-radius:12px;padding:14px;text-align:center}.big span,.count span,.meta{display:block;color:#aeb6c2;font-size:13px}.big b,.count b{display:block;font-size:27px;margin-top:6px}.correct{border-top:3px solid #19c463}.wrong{border-top:3px solid #ef4444}.skip{border-top:3px solid #94a3b8}.badge{display:inline-block;background:#173b2a;color:#79e5aa;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{background:#2962ff;color:#fff;border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.secondary{background:#252b36}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input,.filters select{padding:11px;border-radius:9px;border:1px solid #424956;background:#15181d;color:#fff}.result{border-top:1px solid #333;padding:14px 0}.result:first-child{border-top:0}.empty{text-align:center;color:#aeb6c2;padding:28px}.locked{background:#332514;border:1px solid #6b4b1e;color:#fbbf24;padding:14px;border-radius:12px;line-height:1.5}.drawer{display:none;position:fixed;inset:0;z-index:50}.drawer.show{display:block}.scrim{position:absolute;inset:0;background:#0009}.side{position:absolute;right:0;top:0;bottom:0;width:min(380px,88vw);background:#252a31;padding:18px;overflow:auto}.sidehead{display:flex;justify-content:space-between;border-bottom:1px solid #414854;padding-bottom:14px}.close{background:transparent;font-size:28px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;font-size:12px;color:#cbd5e1}.dot{width:21px;height:21px;border-radius:50%;border:2px solid #9aa5b5;display:inline-block;vertical-align:middle;margin-right:6px}.dot.c{background:#19c463;border-color:#19c463}.dot.w{background:#ef4444;border-color:#ef4444}.dot.s{background:#94a3b8;border-color:#94a3b8}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.palette button{aspect-ratio:1;border-radius:50%;background:#242b35;border:2px solid #98a4b4}.palette .c{background:#19c463;border-color:#19c463}.palette .w{background:#ef4444;border-color:#ef4444}.palette .s{background:#94a3b8;border-color:#94a3b8}@media(max-width:650px){.hero,.counts,.filters{grid-template-columns:1fr}.card{padding:15px}}</style></head><body><main class="wrap"><div class="top"><a href="dashboard.html">← Dashboard</a><button id="refresh">Refresh</button></div><div id="detail"></div><section id="listMode"><div class="card"><h2>📊 My Results</h2><p class="meta">Latest attempt for each exam and subject.</p><div class="counts"><div class="count">Attempts<b id="total">0</b></div><div class="count">Average<b id="avg">0%</b></div><div class="count">Best<b id="best">0%</b></div></div></div><div class="card"><div class="filters"><input id="search" placeholder="Search exam, subject or test"><select id="sort"><option value="new">Newest first</option><option value="high">Highest score</option><option value="old">Oldest first</option></select></div><div id="list">Loading...</div></div></section></main><div id="drawer" class="drawer"><div id="scrim" class="scrim"></div><aside class="side"><div class="sidehead"><div><b>Questions</b><div id="sideInfo" class="meta"></div></div><button id="close">×</button></div><div class="legend"><span><i class="dot c"></i>Correct</span><span><i class="dot w"></i>Wrong</span><span><i class="dot s"></i>Not Attempted</span></div><div id="palette" class="palette"></div></aside></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,getDoc,doc,query,where}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=x=>document.getElementById(x),p=new URLSearchParams(location.search),resultId=p.get('resultId'),liveId=p.get('liveTestId');let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),dt=v=>v?.toDate?v.toDate().getTime():v?.seconds?v.seconds*1000:new Date(v||0).getTime(),totalMarks=r=>Array.isArray(r.solutions)&&r.solutions.length?r.solutions.reduce((t,q)=>t+Number(q.marks??1),0):Number(r.totalMarks||r.totalQuestions)||0,pc=r=>totalMarks(r)>0?Number(r.score||0)/totalMarks(r)*100:0,correct=q=>!!q.selectedAnswer&&String(q.selectedAnswer).toUpperCase()===String(q.correctAnswer||'').toUpperCase();function latest(a){const m=new Map();a.forEach(r=>{const k=`${r.exam||''}|${r.subject||''}|${r.title||''}`;if(!m.has(k)||dt(r.submittedAt)>dt(m.get(k).submittedAt))m.set(k,r)});return[...m.values()]}function palette(r){const qs=r.solutions||[];$('palette').innerHTML='';qs.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=correct(q)?'c':q.selectedAnswer?'w':'s';b.onclick=()=>location.href=`review.html?id=${r.id}`;$('palette').appendChild(b)});$('sideInfo').textContent=`${qs.filter(correct).length} correct · ${qs.filter(q=>q.selectedAnswer&&!correct(q)).length} wrong · ${qs.filter(q=>!q.selectedAnswer).length} not attempted`}async function detail(r,rank=''){$('listMode').style.display='none';$('detail').innerHTML=`<div class="card"><span class="badge">${r.liveTestId?'⚡ DAILY LIVE TEST':'TEST RESULT'}</span><h2>${esc(r.title||r.exam||'Test')}</h2><p class="meta">${esc(r.exam||'')} ${r.subject?'· '+esc(r.subject):''} ${rank?'· '+rank:''}</p><div class="hero"><div class="big"><span>Marks</span><b>${Number(r.score)||0} / ${totalMarks(r)}</b></div><div class="big"><span>Percentage</span><b>${Math.round(pc(r))}%</b></div></div><div class="counts"><div class="count correct"><span>Correct Answers</span><b>${Number(r.correctCount)||0}</b></div><div class="count wrong"><span>Wrong Answers</span><b>${Number(r.wrongCount)||0}</b></div><div class="count skip"><span>Not Attempted</span><b>${Number(r.notAttemptedCount)||0}</b></div></div><div class="actions"><button id="qnav">☰ Question Navigation</button><button onclick="location.href='review.html?id=${encodeURIComponent(r.id)}'">📖 Solutions</button><button class="secondary" onclick="location.href='student-results.html'">All Results</button></div></div>`;palette(r);$('qnav').onclick=()=>$('drawer').classList.add('show')}async function liveResult(u,r){const lb=await getDocs(query(collection(db,'dailyLiveLeaderboard'),where('liveTestId','==',r.liveTestId)));const scores=lb.docs.map(d=>Number(d.data().score||0));const rank=1+scores.filter(s=>s>Number(r.score||0)).length;await detail(r,`Rank #${rank} of ${scores.length||1}`)}function render(){let a=rows.filter(r=>`${r.exam||''} ${r.subject||''} ${r.title||''}`.toLowerCase().includes($('search').value.toLowerCase()));a.sort((x,y)=>$('sort').value==='high'?pc(y)-pc(x):$('sort').value==='old'?dt(x.submittedAt)-dt(y.submittedAt):dt(y.submittedAt)-dt(x.submittedAt));$('list').innerHTML=a.length?a.map(r=>`<div class="result"><b>${esc(r.title||r.exam||'Test')}</b><div class="meta">Score ${Number(r.score)||0}/${totalMarks(r)} · ${Math.round(pc(r))}%</div><button onclick="location.href='student-results.html?resultId=${r.id}'">View Result</button> <button onclick="location.href='review.html?id=${r.id}'">Solutions</button></div>`).join(''):'<div class="empty">No results found.</div>'}async function loadList(u){const s=await getDocs(query(collection(db,'results'),where('uid','==',u.uid)));rows=latest(s.docs.map(d=>({id:d.id,...d.data()})));$('total').textContent=rows.length;const a=rows.map(pc);$('avg').textContent=rows.length?Math.round(a.reduce((x,y)=>x+y,0)/rows.length)+'%':'0%';$('best').textContent=rows.length?Math.round(Math.max(...a))+'%':'0%';render()}$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=()=>auth.currentUser&&loadList(auth.currentUser);$('close').onclick=()=>$('drawer').classList.remove('show');$('scrim').onclick=()=>$('drawer').classList.remove('show');onAuthStateChanged(auth,async u=>{if(!u){location.replace('login.html');return}try{if(resultId){const s=await getDoc(doc(db,'results',resultId));if(!s.exists()||s.data().uid!==u.uid)throw Error('Result not found.');const r={id:s.id,...s.data()};r.liveTestId?await liveResult(u,r):await detail(r)}else if(liveId){const s=await getDocs(query(collection(db,'results'),where('uid','==',u.uid),where('liveTestId','==',liveId)));if(!s.size)throw Error('Live Test result not found.');await liveResult(u,{id:s.docs[0].id,...s.docs[0].data()})}else await loadList(u)}catch(e){$('detail').innerHTML=`<div class="card"><div class="locked">${esc(e.message||'Unable to load result.')}</div></div>`}});</script></body></html>
