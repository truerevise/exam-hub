<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/student-results.html"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>:root{--bg:#101216;--panel:#1b1e24;--panel2:#252a32;--line:#343b47;--muted:#aeb6c2;--green:#19c463;--red:#ef4444;--blue:#3b82f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}.top a{color:#8fa7ff;text-decoration:none;font-weight:800}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{background:var(--panel2);border-radius:13px;padding:16px;text-align:center}.big span{display:block;color:var(--muted);font-size:13px}.big b{display:block;font-size:29px;margin-top:7px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.count{background:var(--panel2);padding:13px;border-radius:11px;text-align:center}.count b{display:block;font-size:24px;margin-top:5px}.correct{border-top:3px solid var(--green)}.wrong{border-top:3px solid var(--red)}.skip{border-top:3px solid #94a3b8}.meta{color:var(--muted);font-size:13px;line-height:1.6}.badge{display:inline-block;background:#173b2a;color:#79e5aa;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{background:#2962ff;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800}.secondary{background:#252b36}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input,.filters select{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #424956;background:#15181d;color:#fff}.result{border-top:1px solid #333;padding:15px 0}.result:first-child{border-top:0}.empty{text-align:center;color:var(--muted);padding:28px}.locked{background:#332514;border:1px solid #6b4b1e;color:#fbbf24;padding:14px;border-radius:12px;line-height:1.5}.drawer{display:none;position:fixed;inset:0;z-index:50}.drawer.show{display:block}.scrim{position:absolute;inset:0;background:#0009}.side{position:absolute;right:0;top:0;bottom:0;width:min(380px,88vw);background:#252a31;padding:18px;overflow:auto}.side-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #414854;padding-bottom:14px}.close{background:transparent;border:0;color:#fff;font-size:28px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;color:#cbd5e1;font-size:12px}.legend span{display:flex;align-items:center;gap:7px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid #9aa5b5;display:inline-block}.dot.correct{background:var(--green);border-color:var(--green)}.dot.wrong{background:var(--red);border-color:var(--red)}.dot.skip{background:#9aa5b5;border-color:#9aa5b5}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.palette button{aspect-ratio:1;border-radius:50%;background:#242b35;border:2px solid #98a4b4;color:#fff}.palette button.correct{background:var(--green);border-color:var(--green)}.palette button.wrong{background:var(--red);border-color:var(--red)}.palette button.skip{background:#9aa5b5;border-color:#9aa5b5}.palette button.current{box-shadow:0 0 0 2px #fff inset}@media(max-width:650px){.hero,.counts,.filters{grid-template-columns:1fr}.big b{font-size:27px}.card{padding:15px}}
</style></head><body><main class="wrap"><div class="top"><a href="dashboard.html">← Dashboard</a><button id="refresh">Refresh</button></div><div id="detail"></div><section id="normalMode"><section class="card"><h2>📊 My Results</h2><p class="meta">Only your latest attempt for each exam and subject is shown.</p><div class="counts"><div class="count">Latest Attempts<b id="total">0</b></div><div class="count">Average<b id="average">0%</b></div><div class="count">Best<b id="best">0%</b></div></div></section><section class="card"><div class="filters"><input id="search" placeholder="Search exam, subject or test"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest score</option></select></div><div id="list" style="margin-top:12px">Loading...</div></section></section></main><div id="drawer" class="drawer"><div id="scrim" class="scrim"></div><aside class="side"><div class="side-head"><div><b>Questions</b><div id="sideInfo" class="meta"></div></div><button id="close" class="close">×</button></div><div class="legend"><span><i class="dot correct"></i> Correct</span><span><i class="dot wrong"></i> Wrong</span><span><i class="dot skip"></i> Not Attempted</span><span><i class="dot"></i> Unseen</span></div><div id="palette" class="palette"></div></aside></div><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,getDoc,doc,query,where}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),liveTestId=params.get('liveTestId'),resultId=params.get('resultId');let rows=[],detailResult=null;function dateValue(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;const n=new Date(v).getTime();return Number.isFinite(n)?n:0}function pct(r){const t=Number(r.totalQuestions)||0;return t?Number(r.score||0)/t*100:0}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function isCorrect(q){return!!q.selectedAnswer&&String(q.selectedAnswer).trim().toUpperCase()===String(q.correctAnswer||'').trim().toUpperCase()}function latestOnly(items){const map=new Map();for(const r of items){const key=`${r.exam||''}||${r.subject||''}||${r.title||''}`;const old=map.get(key);if(!old||dateValue(r.submittedAt)>dateValue(old.submittedAt))map.set(key,r)}return[...map.values()]}function render(){const search=$('search').value.toLowerCase();let data=rows.filter(r=>`${r.exam||''} ${r.subject||''} ${r.title||''}`.toLowerCase().includes(search));data.sort((a,b)=>$('sort').value==='high'?pct(b)-pct(a):$('sort').value==='old'?dateValue(a.submittedAt)-dateValue(b.submittedAt):dateValue(b.submittedAt)-dateValue(a.submittedAt));if(!data.length){$('list').innerHTML='<div class="empty">No results found yet.</div>';return}$('list').innerHTML=data.map(r=>`<div class="result"><div><b>${esc(r.title||r.exam||'Test')}</b></div><div class="meta">${r.exam?`Exam: ${esc(r.exam)} · `:''}${r.subject?`Subject: ${esc(r.subject)} · `:''}Score: <b>${Number(r.score)||0}/${Number(r.totalQuestions)||0}</b> · ${Math.round(pct(r))}%</div><div class="meta">${dateValue(r.submittedAt)?new Date(dateValue(r.submittedAt)).toLocaleString():''}</div><button onclick="location.href='student-results.html?resultId=${encodeURIComponent(r.id)}'" style="margin-top:9px">View Result</button> <button onclick="location.href='review.html?id=${encodeURIComponent(r.id)}'" style="margin-top:9px">Solutions</button></div>`).join('')}function buildPalette(r){const p=$('palette');p.innerHTML='';const qs=Array.isArray(r.solutions)?r.solutions:[];qs.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=isCorrect(q)?'correct':q.selectedAnswer?'wrong':'skip';b.onclick=()=>location.href=`review.html?id=${encodeURIComponent(r.id)}#q${i+1}`;p.appendChild(b)});$('sideInfo').textContent=`${qs.filter(isCorrect).length} correct · ${qs.filter(q=>q.selectedAnswer&&!isCorrect(q)).length} wrong · ${qs.filter(q=>!q.selectedAnswer).length} not attempted`}async function showDetail(user,r){detailResult=r;$('normalMode').style.display='none';$('detail').innerHTML=`<section class="card"><span class="badge">${r.liveTestId?'⚡ DAILY LIVE TEST':'TEST RESULT'}</span><h2>${esc(r.title||r.exam||'Test')}</h2><p class="meta">${r.exam?`Exam: ${esc(r.exam)} · `:''}${r.subject?`Subject: ${esc(r.subject)} · `:''}</p><div class="hero"><div class="big"><span>Marks</span><b>${Number(r.score)||0} / ${Number(r.totalQuestions)||0}</b></div><div class="big"><span>Percentage</span><b>${Math.round(pct(r))}%</b></div></div><div class="counts"><div class="count correct"><span>Correct Answers</span><b>${Number(r.correctCount)||0}</b></div><div class="count wrong"><span>Wrong Answers</span><b>${Number(r.wrongCount)||0}</b></div><div class="count skip"><span>Not Attempted</span><b>${Number(r.notAttemptedCount)||0}</b></div></div><div class="actions"><button id="questionMenu">☰ Question Navigation</button><button onclick="location.href='review.html?id=${encodeURIComponent(r.id)}'">📖 Solutions</button><button class="secondary" onclick="location.href='student-results.html'">All Results</button></div></section>`;buildPalette(r);$('questionMenu').onclick=()=>$('drawer').classList.add('show')}async function loadLive(user){const snap=resultId?await getDoc(doc(db,'results',resultId)):null;let r=snap?.exists()&&snap.data().uid===user.uid?{id:snap.id,...snap.data()}:null;if(!r&&liveTestId){const s=await getDocs(query(collection(db,'results'),where('uid','==',user.uid),where('liveTestId','==',liveTestId)));if(s.size)r={id:s.docs[0].id,...s.docs[0].data()}}if(!r)throw Error('Live Test result not found.');const lb=await getDocs(query(collection(db,'dailyLiveLeaderboard'),where('liveTestId','==',r.liveTestId)));const board=lb.docs.map(d=>d.data()).sort((a,b)=>Number(b.score||0)-Number(a.score||0)||dateValue(a.submittedAt)-dateValue(b.submittedAt));r.rank=1+board.filter(x=>Number(x.score||0)>Number(r.score||0)).length;r.participants=board.length||1;await showDetail(user,r);const rankBox=document.createElement('div');rankBox.className='meta';rankBox.style.marginTop='8px';rankBox.innerHTML=`Your Rank: <b>#${r.rank} of ${r.participants}</b>`;$('detail').firstElementChild.appendChild(rankBox)}async function loadNormal(){try{const u=auth.currentUser;if(!u){location.replace('login.html');return}const snap=await getDocs(query(collection(db,'results'),where('uid','==',u.uid)));rows=latestOnly(snap.docs.map(d=>({id:d.id,...d.data()})));const p=rows.map(pct);$('total').textContent=rows.length;$('average').textContent=rows.length?Math.round(p.reduce((a,b)=>a+b,0)/rows.length)+'%':'0%';$('best').textContent=rows.length?Math.round(Math.max(...p))+'%':'0%';render()}catch(e){console.error(e);$('list').innerHTML='<div class="empty">Unable to load your results.</div>'}}$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=()=>auth.currentUser&&(resultId||liveTestId?loadLive(auth.currentUser):loadNormal());$('close').onclick=()=>$('drawer').classList.remove('show');$('scrim').onclick=()=>$('drawer').classList.remove('show');onAuthStateChanged(auth,async u=>{if(!u){location.replace('login.html');return}try{if(resultId||liveTestId){const s=await getDoc(doc(db,'results',resultId));if(s.exists()&&s.data().uid===u.uid)await showDetail(u,{id:s.id,...s.data()});else await loadLive(u)}else await loadNormal()}catch(e){console.error(e);$('detail').innerHTML=`<section class="card"><div class="locked">Unable to load result: ${esc(e.message||'Please try again.')}</div></section>`}});</script></body></html>
