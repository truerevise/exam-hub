<!DOCTYPE html><html lang="en"><head><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="https://truerevise.com/student-results.html"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{margin:0;background:#101216;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top a{color:#7db0ff;text-decoration:none}.card{background:#1b1e24;border:1px solid #303640;border-radius:16px;padding:18px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#242933;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:24px;margin-top:5px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input,.filters select{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #424956;background:#15181d;color:#fff}.result{border-top:1px solid #333;padding:15px 0}.result:first-child{border-top:0}.meta{color:#aeb6c2;font-size:14px;margin-top:5px}.score{font-size:20px;font-weight:800}.badge{display:inline-block;background:#1d6338;padding:5px 8px;border-radius:7px;font-size:12px}button{background:#2962ff;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700}.empty{text-align:center;color:#aeb6c2;padding:28px}.note{color:#aeb6c2;font-size:13px;line-height:1.5}@media(max-width:650px){.stats,.filters{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="dashboard.html">← Dashboard</a><button id="refresh">Refresh</button></div><section class="card"><h2>📊 My Results</h2><p class="meta">Only your latest attempt for each exam and subject is shown.</p><div class="stats"><div class="stat">Latest Attempts<b id="total">0</b></div><div class="stat">Average<b id="average">0%</b></div><div class="stat">Best<b id="best">0%</b></div></div></section><section class="card"><div class="filters"><input id="search" placeholder="Search exam, subject or test"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest score</option></select></div><div id="list" style="margin-top:12px">Loading...</div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id);let rows=[];function dateValue(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;const n=new Date(v).getTime();return Number.isFinite(n)?n:0}function pct(r){const t=Number(r.totalQuestions)||0;return t?Number(r.score||0)/t*100:0}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function latestOnly(items){const map=new Map();for(const r of items){const key=`${r.exam||''}||${r.subject||''}||${r.title||''}`;const old=map.get(key);if(!old||dateValue(r.submittedAt)>dateValue(old.submittedAt))map.set(key,r)}return[...map.values()]}function render(){const search=$('search').value.toLowerCase();let data=rows.filter(r=>`${r.exam||''} ${r.subject||''} ${r.title||''}`.toLowerCase().includes(search));data.sort((a,b)=>$('sort').value==='high'?pct(b)-pct(a):$('sort').value==='old'?dateValue(a.submittedAt)-dateValue(b.submittedAt):dateValue(b.submittedAt)-dateValue(a.submittedAt));if(!data.length){$('list').innerHTML='<div class="empty">No results found yet. Complete a test to see your latest result here.</div>';return}$('list').innerHTML=data.map(r=>`<div class="result"><div class="score">${esc(r.title||r.exam||'Test')}</div><div class="meta">${r.exam?`Exam: ${esc(r.exam)} • `:''}${r.subject?`Subject: ${esc(r.subject)} • `:''}Score: <b>${Number(r.score)||0}/${Number(r.totalQuestions)||0}</b> <span class="badge">${Math.round(pct(r))}%</span></div><div class="meta">${dateValue(r.submittedAt)?new Date(dateValue(r.submittedAt)).toLocaleString():'Date unavailable'}</div><button onclick="location.href='review.html?id=${encodeURIComponent(r.id)}'" style="margin-top:9px">View Solutions</button></div>`).join('')}async function load(){try{const u=auth.currentUser;if(!u){location.replace('login.html');return}const snap=await getDocs(query(collection(db,'results'),where('uid','==',u.uid)));rows=latestOnly(snap.docs.map(d=>({id:d.id,...d.data()})));const p=rows.map(pct);$('total').textContent=rows.length;$('average').textContent=rows.length?Math.round(p.reduce((a,b)=>a+b,0)/rows.length)+'%':'0%';$('best').textContent=rows.length?Math.round(Math.max(...p))+'%':'0%';render()}catch(e){console.error(e);$('list').innerHTML='<div class="empty">Unable to load your results. Please try again.</div>'}}$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=load;onAuthStateChanged(auth,u=>u?load():location.replace('login.html'));</script></body></html>
