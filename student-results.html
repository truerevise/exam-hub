<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/student-results.html"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="UTF-8"><meta name="theme-color" content="#101216"><style>body{margin:0;background:#101216;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}.top a{color:#8fa7ff;text-decoration:none;font-weight:800}.card{background:#1b1e24;border:1px solid #303640;border-radius:16px;padding:18px;margin-bottom:14px}.meta{color:#aeb6c2;font-size:14px;margin-top:5px}.score{font-size:22px;font-weight:900}.badge{display:inline-block;background:#1d6338;padding:5px 8px;border-radius:7px;font-size:12px}.live-summary h2{margin:0 0 8px}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.big{background:#242933;border-radius:14px;padding:16px;text-align:center}.big span{display:block;color:#aeb6c2;font-size:13px}.big b{display:block;font-size:30px;margin-top:7px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.count{background:#242933;border-radius:12px;padding:14px;text-align:center}.count b{display:block;font-size:24px;margin-top:5px}.correct{border-top:3px solid #16a34a}.wrong{border-top:3px solid #ef4444}.unattempted{border-top:3px solid #94a3b8}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{background:#2962ff;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.secondary{background:#252b36}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input,.filters select{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #424956;background:#15181d;color:#fff}.result{border-top:1px solid #333;padding:15px 0}.result:first-child{border-top:0}.empty{text-align:center;color:#aeb6c2;padding:28px}.locked{background:#332514;border:1px solid #6b4b1e;color:#fbbf24;padding:14px;border-radius:12px;line-height:1.5}@media(max-width:650px){.hero,.counts,.filters{grid-template-columns:1fr}.big b{font-size:27px}.top{align-items:flex-start}.card{padding:15px}}
</style></head><body><main class="wrap"><div class="top"><a href="dashboard.html">← Dashboard</a><button id="refresh">Refresh</button></div><div id="liveMode"></div><section id="normalMode"><section class="card"><h2>📊 My Results</h2><p class="meta">Only your latest attempt for each exam and subject is shown.</p><div class="counts"><div class="count">Latest Attempts<b id="total">0</b></div><div class="count">Average<b id="average">0%</b></div><div class="count">Best<b id="best">0%</b></div></div></section><section class="card"><div class="filters"><input id="search" placeholder="Search exam, subject or test"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest score</option></select></div><div id="list" style="margin-top:12px">Loading...</div></section></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,getDoc,doc,query,where}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search),liveTestId=params.get('liveTestId'),resultId=params.get('resultId');let rows=[];function dateValue(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(typeof v.seconds==='number')return v.seconds*1000;const n=new Date(v).getTime();return Number.isFinite(n)?n:0}function pct(r){const t=Number(r.totalQuestions)||0;return t?Number(r.score||0)/t*100:0}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function latestOnly(items){const map=new Map();for(const r of items){const key=`${r.exam||''}||${r.subject||''}||${r.title||''}`;const old=map.get(key);if(!old||dateValue(r.submittedAt)>dateValue(old.submittedAt))map.set(key,r)}return[...map.values()]}function render(){const search=$('search').value.toLowerCase();let data=rows.filter(r=>`${r.exam||''} ${r.subject||''} ${r.title||''}`.toLowerCase().includes(search));data.sort((a,b)=>$('sort').value==='high'?pct(b)-pct(a):$('sort').value==='old'?dateValue(a.submittedAt)-dateValue(b.submittedAt):dateValue(b.submittedAt)-dateValue(a.submittedAt));if(!data.length){$('list').innerHTML='<div class="empty">No results found yet. Complete a test to see your result here.</div>';return}$('list').innerHTML=data.map(r=>`<div class="result"><div class="score">${esc(r.title||r.exam||'Test')}</div><div class="meta">${r.exam?`Exam: ${esc(r.exam)} • `:''}${r.subject?`Subject: ${esc(r.subject)} • `:''}Score: <b>${Number(r.score)||0}/${Number(r.totalQuestions)||0}</b> <span class="badge">${Math.round(pct(r))}%</span></div><div class="meta">${dateValue(r.submittedAt)?new Date(dateValue(r.submittedAt)).toLocaleString():'Date unavailable'}</div><button onclick="location.href='review.html?id=${encodeURIComponent(r.id)}'" style="margin-top:9px">View Solutions</button></div>`).join('')}async function loadLive(user){$('normalMode').style.display='none';const box=$('liveMode');box.innerHTML='<section class="card"><div class="empty">Loading Daily Live Test result...</div></section>';try{let result;if(resultId){const s=await getDoc(doc(db,'results',resultId));if(s.exists()&&s.data().uid===user.uid)result={id:s.id,...s.data()}}if(!result&&liveTestId){const snap=await getDocs(query(collection(db,'results'),where('uid','==',user.uid),where('liveTestId','==',liveTestId)));const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>dateValue(b.submittedAt)-dateValue(a.submittedAt));result=list[0]}if(!result)throw Error('Live Test result not found.');const liveId=result.liveTestId||liveTestId;const lbSnap=await getDocs(query(collection(db,'dailyLiveLeaderboard'),where('liveTestId','==',liveId)));const board=lbSnap.docs.map(d=>d.data()).sort((a,b)=>Number(b.score||0)-Number(a.score||0)||dateValue(a.submittedAt)-dateValue(b.submittedAt));const myScore=Number(result.score)||0;const rank=1+board.filter(x=>Number(x.score||0)>myScore).length;const totalParticipants=board.length||1;const title=result.title||'Daily Live Test';box.innerHTML=`<section class="card live-summary"><span class="badge">⚡ DAILY LIVE TEST</span><h2>${esc(title)}</h2><p class="meta">Your final performance for this Daily Live Test.</p><div class="hero"><div class="big"><span>Marks</span><b>${myScore} / ${Number(result.totalQuestions)||0}</b></div><div class="big"><span>Your Rank</span><b>#${rank} <small style="font-size:14px;color:#aeb6c2">of ${totalParticipants}</small></b></div></div><div class="counts"><div class="count correct"><span>Correct Answers</span><b>${Number(result.correctCount)||0}</b></div><div class="count wrong"><span>Wrong Answers</span><b>${Number(result.wrongCount)||0}</b></div><div class="count unattempted"><span>Not Attempted</span><b>${Number(result.notAttemptedCount)||0}</b></div></div><div class="actions"><button onclick="location.href='review.html?id=${encodeURIComponent(result.id)}'">📖 View Live Test Solutions</button><button class="secondary" onclick="location.href='dashboard.html'">Back to Dashboard</button></div></section>`}catch(e){console.error(e);box.innerHTML=`<section class="card"><div class="locked">Unable to load this Daily Live Test result.<br><br>${esc(e.message||'Please try again.')}</div></section>`}}async function loadNormal(){try{const u=auth.currentUser;if(!u){location.replace('login.html');return}const snap=await getDocs(query(collection(db,'results'),where('uid','==',u.uid)));rows=latestOnly(snap.docs.map(d=>({id:d.id,...d.data()})));const p=rows.map(pct);$('total').textContent=rows.length;$('average').textContent=rows.length?Math.round(p.reduce((a,b)=>a+b,0)/rows.length)+'%':'0%';$('best').textContent=rows.length?Math.round(Math.max(...p))+'%':'0%';render()}catch(e){console.error(e);$('list').innerHTML='<div class="empty">Unable to load your results. Please try again.</div>'}}$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=()=>auth.currentUser&&(liveTestId?loadLive(auth.currentUser):loadNormal());onAuthStateChanged(auth,u=>{if(!u){location.replace('login.html');return}liveTestId?loadLive(u):loadNormal()});</script></body></html>
