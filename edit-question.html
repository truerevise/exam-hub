<style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#111722;border:1px solid #273244;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;color:#aab6cc;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #34415b;border-radius:10px;background:#0d1422;color:#fff}.field textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:10px;padding:12px 17px;background:#2563eb;color:#fff;font-weight:800}.secondary{background:#182238;border:1px solid #31405d}.back{color:#8fb5ff;text-decoration:none}.msg{margin-top:12px;min-height:20px;color:#7ee2a9}.err{color:#ff9aa7}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="back" href="question-bank.html">← Question Bank</a><h1>✏️ Edit Question</h1><section class="card"><div class="grid"><div class="field"><label>Exam *</label><input id="exam"></div><div class="field"><label>Subject *</label><input id="subject"></div><div class="field"><label>Topic</label><input id="topic"></div><div class="field"><label>Difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div><div class="field"><label>Status</label><select id="status"><option value="verified">Verified</option><option value="needs_review">Needs Review</option><option value="reported">Reported</option><option value="disabled">Disabled</option></select></div><div class="field"><label>Marks</label><input id="marks" type="number" min="0" step="0.25"></div><div class="field"><label>Negative Marks</label><input id="negative" type="number" min="0" step="0.25"></div><div class="field"><label>Previously Conducted In</label><input id="previousExam"></div></div><div class="field"><label>Question *</label><textarea id="question"></textarea></div><div class="grid"><div class="field"><label>Option A *</label><input id="A"></div><div class="field"><label>Option B *</label><input id="B"></div><div class="field"><label>Option C *</label><input id="C"></div><div class="field"><label>Option D *</label><input id="D"></div></div><div class="grid"><div class="field"><label>Correct Answer</label><select id="answer"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="ALL">ALL</option><option value="MULTIPLE">MULTIPLE</option><option value="DELETED">DELETED</option></select></div><div class="field"><label>Admin Tags</label><input id="tags" placeholder="comma,separated,tags"></div></div><div class="field"><label>Explanation</label><textarea id="explanation"></textarea></div><div><button class="btn" id="save">Save Changes</button> <button class="btn secondary" onclick="location.href='question-bank.html'">Cancel</button></div><div id="msg" class="msg"></div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{doc,getDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com',$=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');function set(v){$('exam').value=v.exam||'';$('subject').value=v.subject||'';$('topic').value=v.topic||'';$('difficulty').value=v.difficulty||'medium';$('status').value=v.status||'verified';$('marks').value=v.marks??1;$('negative').value=v.negativeMarks??0;$('previousExam').value=v.previousExam||'';$('question').value=v.question||'';const o=v.options||{};$('A').value=o.A??v.optionA??'';$('B').value=o.B??v.optionB??'';$('C').value=o.C??v.optionC??'';$('D').value=o.D??v.optionD??'';$('answer').value=v.correctAnswer||v.answer||'A';$('tags').value=(v.tags||[]).join(', ');$('explanation').value=v.explanation||''}async function load(){if(!id)throw Error('Question ID missing.');const s=await getDoc(doc(db,'questions',id));if(!s.exists())throw Error('Question not found.');set(s.data())}$('save').onclick=async()=>{const o={A:$('A').value.trim(),B:$('B').value.trim(),C:$('C').value.trim(),D:$('D').value.trim()};if(!$('question').value.trim()||!$('exam').value.trim()||!$('subject').value.trim()||Object.values(o).some(v=>!v)){$('msg').className='msg err';$('msg').textContent='Complete the required fields.';return}try{const a=$('answer').value;await updateDoc(doc(db,'questions',id),{exam:$('exam').value.trim(),subject:$('subject').value.trim(),topic:$('topic').value.trim(),difficulty:$('difficulty').value,status:$('status').value,question:$('question').value.trim(),options:o,correctAnswer:a,answerType:['A','B','C','D'].includes(a)?'single':a==='ALL'?'all':a==='MULTIPLE'?'multiple':'deleted_or_all_awarded',marks:Number($('marks').value)||1,negativeMarks:Number($('negative').value)||0,previousExam:$('previousExam').value.trim(),tags:$('tags').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),explanation:$('explanation').value.trim(),updatedAt:serverTimestamp()});$('msg').className='msg';$('msg').textContent='✓ Question updated successfully.'}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'Could not update question.'}};onAuthStateChanged(auth,u=>{if(!isSuperAdmin(u))location.replace('admin.html');else load().catch(e=>{$('msg').className='msg err';$('msg').textContent=e.message})});</script></body></html>
