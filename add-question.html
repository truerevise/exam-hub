<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam Hub | Add Question</title><link rel="stylesheet" href="css/style.css"><style>.form{max-width:800px;margin:auto}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #444;border-radius:10px;background:#222;color:#fff}.field textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{padding:12px 18px;border:0;border-radius:10px;background:#2962ff;color:#fff;font-weight:700}.msg{min-height:22px;margin-top:10px}</style></head><body><header><div class="header-inner"><div class="brand"><button class="icon-btn" onclick="history.back()" aria-label="Back">←</button><div class="logo">Add Question</div></div></div></header><main class="container"><div class="card form"><h2>New Question</h2><div class="field"><label>Exam</label><input id="exam" placeholder="e.g. TG Police, UGC NET"></div><div class="field"><label>Subject</label><input id="subject" placeholder="e.g. General Studies, Commerce"></div><div class="field"><label>Question</label><textarea id="question" placeholder="Enter question"></textarea></div><div class="field"><label>Option A</label><input id="a"></div><div class="field"><label>Option B</label><input id="b"></div><div class="field"><label>Option C</label><input id="c"></div><div class="field"><label>Option D</label><input id="d"></div><div class="field"><label>Correct Answer</label><select id="answer"><option value="">Select correct answer</option><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="field"><label>Explanation</label><textarea id="explanation" placeholder="Explain why the answer is correct"></textarea></div><div class="field"><label>Marks</label><input id="marks" type="number" value="1"></div><div class="field"><label>Negative Marks</label><input id="negativeMarks" type="number" value="0"></div><div class="actions"><button id="save">⭐ Save Question</button><button type="button" onclick="location.href='question-bank.html'">Question Bank</button></div><div id="msg" class="msg"></div></div></main><script type="module">import{db}from'./firebase-config.js';import{addDoc,collection,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id);$('save').onclick=async()=>{const exam=$('exam').value.trim(),subject=$('subject').value.trim(),question=$('question').value.trim(),answer=$('answer').value;if(!exam||!subject||!question||!answer||!$('a').value.trim()||!$('b').value.trim()||!$('c').value.trim()||!$('d').value.trim()){$('msg').textContent='Please fill all required fields.';return}try{await addDoc(collection(db,'questions'),{exam,subject,question,options:{A:$('a').value.trim(),B:$('b').value.trim(),C:$('c').value.trim(),D:$('d').value.trim()},correctAnswer:answer,explanation:$('explanation').value.trim(),marks:Number($('marks').value)||1,negativeMarks:Number($('negativeMarks').value)||0,createdAt:serverTimestamp()});$('msg').textContent='Question saved successfully.';['question','a','b','c','d','explanation'].forEach(id=>$(id).value='');$('answer').value=''}catch(e){console.error(e);$('msg').textContent='Could not save question. Check Firebase/Firestore permissions.'}};</script></body></html>
