<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam Hub | Add Question</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.back{color:#8fb5ff;text-decoration:none}.title{font-size:27px;font-weight:800;margin:7px 0 18px}.card{background:#12192b;border:1px solid #263149;border-radius:18px;padding:20px}.section{padding:15px 0;border-top:1px solid #29344a}.section:first-child{border-top:0}.section h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;color:#aab6cc;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #34415b;border-radius:10px;background:#0f1627;color:#fff}.field textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 17px;background:#2563eb;color:#fff;font-weight:800}.secondary{background:#182238;border:1px solid #31405d}.msg{margin-top:12px;color:#7ee2a9;min-height:20px}.error{color:#ff9aa7}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="title">➕ Add Question</div><section class="card"><div class="section"><h3>Question Details</h3><div class="grid"><div class="field"><label>Exam *</label><input id="exam" placeholder="e.g. UGC NET"></div><div class="field"><label>Subject *</label><input id="subject" placeholder="e.g. Commerce"></div></div><div class="field"><label>Question *</label><textarea id="question" placeholder="Enter the question..."></textarea></div></div><div class="section"><h3>Answer Options</h3><div class="grid"><div class="field"><label>Option A *</label><input id="a"></div><div class="field"><label>Option B *</label><input id="b"></div><div class="field"><label>Option C *</label><input id="c"></div><div class="field"><label>Option D *</label><input id="d"></div></div><div class="field"><label>Correct Answer *</label><select id="answer"><option value="">Select correct answer</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div></div><div class="section"><h3>Explanation & Marks</h3><div class="field"><label>Explanation</label><textarea id="explanation" placeholder="Explain why the answer is correct..."></textarea></div><div class="grid"><div class="field"><label>Marks</label><input id="marks" type="number" value="1" min="0"></div><div class="field"><label>Negative Marks</label><input id="negative" type="number" value="0" min="0" step="0.25"></div></div></div><div class="actions"><button class="btn" id="save">Save Question</button><button class="btn secondary" onclick="location.href='question-bank.html'">Question Bank</button></div><div id="msg" class="msg"></div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{addDoc,collection,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const $=id=>document.getElementById(id);onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN.toLowerCase())location.replace('admin.html')});$('save').onclick=async()=>{const exam=$('exam').value.trim(),subject=$('subject').value.trim(),question=$('question').value.trim(),A=$('a').value.trim(),B=$('b').value.trim(),C=$('c').value.trim(),D=$('d').value.trim(),answer=$('answer').value;if(!exam||!subject||!question||!A||!B||!C||!D||!answer){$('msg').className='msg error';$('msg').textContent='Please complete all required fields.';return}try{await addDoc(collection(db,'questions'),{exam,subject,question,options:{A,B,C,D},correctAnswer:answer,explanation:$('explanation').value.trim(),marks:Number($('marks').value)||1,negativeMarks:Number($('negative').value)||0,createdAt:serverTimestamp()});$('msg').className='msg';$('msg').textContent='✓ Question saved successfully.';['question','a','b','c','d','explanation'].forEach(id=>$(id).value='');$('answer').value=''}catch(e){console.error(e);$('msg').className='msg error';$('msg').textContent='Could not save. Check Firestore permissions.'}};</script></body></html>
