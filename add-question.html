<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Question</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

<header>

<div style="display:flex;justify-content:space-between;align-items:center;">

<div style="display:flex;align-items:center;gap:10px;">
<span class="material-icons">arrow_back</span>
<div class="logo">Add Question</div>
</div>

<div>
<span class="material-icons">save</span>
</div>

</div>

</header>

<div class="container">

<h2>New Question</h2>

<input type="text" placeholder="Exam Category (TG Police, UGC NET, SSC...)">

<input type="text" placeholder="Exam Name">

<input type="text" placeholder="Subject">

<textarea placeholder="Enter Question" style="width:100%;height:120px;background:#222;color:white;border:1px solid #444;border-radius:10px;padding:15px;"></textarea>

<input type="text" placeholder="Option A">

<input type="text" placeholder="Option B">

<input type="text" placeholder="Option C">

<input type="text" placeholder="Option D">

<select id="correctOption" style="width:100%;padding:14px;background:#222;color:white;border:1px solid #444;border-radius:10px;margin-top:15px;">
    <option value="optionA">Correct Option - A</option>
    <option value="optionB">Correct Option - B</option>
    <option value="optionC">Correct Option - C</option>
    <option value="optionD">Correct Option - D</option>
</select>

<input type="text" placeholder="Explanation">

  

<input type="number" placeholder="Marks">

<input type="number" placeholder="Negative Marks">

<button>⭐ Save Question</button>

</div>
<script type="module">
import { db } from "./firebase-config.js";
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const saveBtn = document.querySelector("button");

saveBtn.addEventListener("click", async () => {
  const inputs = document.querySelectorAll("input");
  const textarea = document.querySelector("textarea");
  const correctOption = document.getElementById("correctOption");

  try {
    await addDoc(collection(db, "questions"), {
      category: inputs[0].value,
      exam: inputs[1].value,
      subject: inputs[2].value,
      question: textarea.value,
      optionA: inputs[3].value,
      optionB: inputs[4].value,
      optionC: inputs[5].value,
      optionD: inputs[6].value,
      correctOption: correctOption.value,
explanation: inputs[7].value,
marks: inputs[8].value,
negativeMarks: inputs[9].value,
      createdAt: new Date()
    });

    alert("Question saved successfully!");
  } catch (e) {
    alert("Error: " + e.message);
  }
});
</script>

  
</body>
</html>
