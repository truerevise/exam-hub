<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/add-question.html">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#080b12"><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.back{color:#8fb5ff;text-decoration:none}.title{font-size:27px;font-weight:800;margin:7px 0 18px}.card{background:#111722;border:1px solid #273244;border-radius:18px;padding:20px;box-shadow:0 15px 40px rgba(0,0,0,.2)}.section{padding:15px 0;border-top:1px solid #29344a}.section:first-child{border-top:0}.section h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;color:#aab6cc;font-size:13px;font-weight:800;margin-bottom:6px}.hint{font-size:11px;color:#71809a;font-weight:500;margin-left:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #34415b;border-radius:10px;background:#0d1422;color:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#4f7ff2;box-shadow:0 0 0 3px rgba(79,127,242,.1)}.field textarea{min-height:110px;resize:vertical}.admin-only{background:linear-gradient(135deg,#131c30,#101827);border:1px dashed #405276;border-radius:14px;padding:14px}.admin-only .label{color:#9eb6ff}.answer-help{font-size:12px;color:#8f9bb5;margin-top:6px;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 17px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#182238;border:1px solid #31405d}.msg{margin-top:12px;color:#7ee2a9;min-height:20px}.error{color:#ff9aa7}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="title">➕ Add Question</div><section class="card"><div class="section"><h3>Question Details</h3><div class="grid"><div class="field"><label>Exam *</label><input id="exam" placeholder="e.g. UGC NET"></div><div class="field"><label>Subject *</label><input id="subject" placeholder="e.g. Commerce"></div></div><div class="field"><label>Question *</label><textarea id="question" placeholder="Enter the question..."></textarea></div><div class="admin-only"><div class="field"><label class="label">🏷️ Admin Tags <span class="hint">Optional • visible only to admin</span></label><input id="tags" placeholder="e.g. polity, constitution, Telangana, group 2"></div><div class="field" style="margin-bottom:0"><label class="label">📜 Previously Conducted In <span class="hint">Optional • visible to students after the question</span></label><input id="previousExam" placeholder="e.g. TSPSC Group 2 — 2022"></div></div></div><div class="section"><h3>Answer Options</h3><div class="grid"><div class="field"><label>Option A *</label><input id="a"></div><div class="field"><label>Option B *</label><input id="b"></div><div class="field"><label>Option C *</label><input id="c"></div><div class="field"><label>Option D *</label><input id="d"></div></div><div class="field"><label>Correct Answer / Key *</label><select id="answer"><option value="">Select correct answer</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="ALL">ALL — all four options are correct</option><option value="MULTIPLE">MULTIPLE — more than one option is correct</option><option value="DELETED">DELETED / ALL AWARDED — question withdrawn or marks awarded to all</option></select></div></div><div class="section"><h3>Explanation & Marks</h3><div class="field"><label>Explanation</label><textarea id="explanation" placeholder="Explain why the answer is correct..."></textarea></div><div class="grid"><div class="field"><label>Marks</label><input id="marks" type="number" value="1" min="0"></div><div class="field"><label>Negative Marks</label><input id="negative" type="number" value="0" min="0" step="0.25"></div></div></div><div class="actions"><button class="btn" id="save">Save Question</button><button class="btn secondary" onclick="location.href='question-bank.html'">Question Bank</button></div><div id="msg" class="msg"></div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{addDoc,collection,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com',$=id=>document.getElementById(id);function examDocId(name){return'exam-'+name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,100)}onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN.toLowerCase())location.replace('admin.html')});$('save').onclick=async()=>{const exam=$('exam').value.trim(),subject=$('subject').value.trim(),question=$('question').value.trim(),A=$('a').value.trim(),B=$('b').value.trim(),C=$('c').value.trim(),D=$('d').value.trim(),answer=$('answer').value,tags=$('tags').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),previousExam=$('previousExam').value.trim();if(!exam||!subject||!question||!A||!B||!C||!D||!answer){$('msg').className='msg error';$('msg').textContent='Please complete all required fields.';return}try{await addDoc(collection(db,'questions'),{exam,subject,question,options:{A,B,C,D},correctAnswer:answer,answerType:['A','B','C','D'].includes(answer)?'single':answer==='ALL'?'all':answer==='MULTIPLE'?'multiple':'deleted_or_all_awarded',explanation:$('explanation').value.trim(),marks:Number($('marks').value)||1,negativeMarks:Number($('negative').value)||0,tags,previousExam,createdAt:serverTimestamp()});await setDoc(doc(db,'exams',examDocId(exam)),{name:exam,updatedAt:serverTimestamp(),createdBy:ADMIN},{merge:true});$('msg').className='msg';$('msg').textContent='✓ Question saved successfully.';['question','a','b','c','d','explanation','tags','previousExam'].forEach(id=>$(id).value='');$('answer').value=''}catch(e){console.error(e);$('msg').className='msg error';$('msg').textContent='Could not save. Check Firestore permissions.'}};</script></body></html>
