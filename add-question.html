<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial}.wrap{max-width:900px;margin:auto;padding:18px}.back{color:#8fb5ff;text-decoration:none}.title{font-size:27px;font-weight:800;margin:7px 0 18px}.card{background:#111722;border:1px solid #273244;border-radius:18px;padding:20px}.section{padding:15px 0;border-top:1px solid #29344a}.section:first-child{border-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;color:#aab6cc;font-size:13px;font-weight:800;margin-bottom:6px}.hint{font-size:11px;color:#71809a;font-weight:500}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #34415b;border-radius:10px;background:#0d1422;color:#fff}.field textarea{min-height:110px;resize:vertical}.admin-only{background:#131c30;border:1px dashed #405276;border-radius:14px;padding:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 17px;background:#2563eb;color:#fff;font-weight:800}.secondary{background:#182238;border:1px solid #31405d}.msg{margin-top:12px;color:#7ee2a9;min-height:20px}.error{color:#ff9aa7}.image-field{background:#0d1422;border:1px solid #293852;border-radius:12px;padding:10px}.image-preview{display:none;max-width:100%;max-height:180px;margin-top:8px;border-radius:9px;border:1px solid #34415b;background:#080b12}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="admin-dashboard.html">← Admin Dashboard</a>
<div class="title">➕ Add Question</div>
<section class="card">
<div class="section"><h3>Question Details</h3>
<div class="grid">
<div class="field"><label>Exam *</label><input id="exam" placeholder="e.g. UGC NET"></div>
<div class="field"><label>Subject *</label><input id="subject" placeholder="e.g. Commerce"></div>
<div class="field"><label>Topic</label><input id="topic" placeholder="e.g. Accounting Standards"></div>
<div class="field"><label>Difficulty</label><select id="difficulty"><option value="medium">Medium</option><option value="easy">Easy</option><option value="hard">Hard</option></select></div>
</div>
<div class="field"><label>Question Text *</label><textarea id="question" placeholder="Enter the question text..."></textarea></div>
<div class="field image-field"><label>Question diagram / image <span class="hint">Optional • appears below the question text</span></label><input id="questionImage" type="file" accept="image/*"><img id="questionPreview" class="image-preview" alt="Question image preview"></div>
<div class="admin-only"><div class="field"><label>🏷️ Admin Tags <span class="hint">Optional • admin search/filter</span></label><input id="tags" placeholder="e.g. polity, constitution, Telangana"></div>
<div class="grid"><div class="field"><label>📜 Previously Conducted In</label><input id="previousExam" placeholder="e.g. TSPSC Group 2 — 2022"></div>
<div class="field"><label>Quality Status</label><select id="status"><option value="verified">Verified</option><option value="needs_review">Needs Review</option><option value="reported">Reported</option><option value="disabled">Disabled</option></select></div></div></div></div>
<div class="section"><h3>Answer Options</h3>
<div class="grid">
<div class="field"><label>Option A *</label><input id="a"></div>
<div class="field"><label>Option B *</label><input id="b"></div>
<div class="field"><label>Option C *</label><input id="c"></div>
<div class="field"><label>Option D *</label><input id="d"></div>
</div>
<div class="grid">
<div class="field image-field"><label>Option A image <span class="hint">Optional • diagram/image</span></label><input id="imageA" type="file" accept="image/*"><img id="previewA" class="image-preview" alt="Option A preview"></div>
<div class="field image-field"><label>Option B image <span class="hint">Optional • diagram/image</span></label><input id="imageB" type="file" accept="image/*"><img id="previewB" class="image-preview" alt="Option B preview"></div>
<div class="field image-field"><label>Option C image <span class="hint">Optional • diagram/image</span></label><input id="imageC" type="file" accept="image/*"><img id="previewC" class="image-preview" alt="Option C preview"></div>
<div class="field image-field"><label>Option D image <span class="hint">Optional • diagram/image</span></label><input id="imageD" type="file" accept="image/*"><img id="previewD" class="image-preview" alt="Option D preview"></div>
</div>
<div class="hint">Images are compressed in the browser before saving, so simple diagrams work well without needing a separate image-hosting service.</div>
<div class="field"><label>Correct Answer / Key *</label><select id="answer"><option value="">Select correct answer</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="ALL">ALL — all four options are correct</option><option value="MULTIPLE">MULTIPLE — more than one option is correct</option><option value="DELETED">DELETED / ALL AWARDED</option></select></div>
</div>
<div class="section"><h3>Explanation & Marks</h3><div class="field"><label>Explanation</label><textarea id="explanation" placeholder="Explain why the answer is correct..."></textarea></div><div class="grid"><div class="field"><label>Marks</label><input id="marks" type="number" value="1" min="0"></div><div class="field"><label>Negative Marks</label><input id="negative" type="number" value="0" min="0" step="0.25"></div></div></div>
<div class="actions"><button class="btn" id="save">Save Question</button><button class="btn secondary" onclick="location.href='question-bank.html'">Question Bank</button></div><div id="msg" class="msg"></div>
</section></main>
<script type="module">
import{auth,db}from'./firebase-config.js';
import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
import{addDoc,collection,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
const ADMIN='kiransingh.smile@gmail.com',$=id=>document.getElementById(id);
function examDocId(name){return'exam-'+name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,100)}
async function compressImage(file){if(!file)return'';return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1000;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))};img.onerror=reject;img.src=reader.result};reader.readAsDataURL(file)})}
['A','B','C','D'].forEach(l=>$( 'image'+l).addEventListener('change',()=>{const f=$( 'image'+l).files[0],p=$( 'preview'+l);if(!f){p.style.display='none';return}p.src=URL.createObjectURL(f);p.style.display='block'}));
$('questionImage').addEventListener('change',()=>{const f=$('questionImage').files[0],p=$('questionPreview');if(!f){p.style.display='none';return}p.src=URL.createObjectURL(f);p.style.display='block'});
onAuthStateChanged(auth,u=>{if(!u||!isSuperAdmin(u))location.replace('admin.html')});
$('save').onclick=async()=>{const exam=$('exam').value.trim(),subject=$('subject').value.trim(),question=$('question').value.trim(),A=$('a').value.trim(),B=$('b').value.trim(),C=$('c').value.trim(),D=$('d').value.trim(),answer=$('answer').value;if(!exam||!subject||!question||!A||!B||!C||!D||!answer){$('msg').className='msg error';$('msg').textContent='Please complete all required fields.';return}const saveBtn=$('save');saveBtn.disabled=true;saveBtn.textContent='Saving…';try{const questionImage=await compressImage($('questionImage').files[0]);const optionImages={A:await compressImage($('imageA').files[0]),B:await compressImage($('imageB').files[0]),C:await compressImage($('imageC').files[0]),D:await compressImage($('imageD').files[0])};await addDoc(collection(db,'questions'),{exam,subject,topic:$('topic').value.trim(),difficulty:$('difficulty').value,status:$('status').value,question,questionImage,options:{A,B,C,D},optionImages,correctAnswer:answer,answerType:['A','B','C','D'].includes(answer)?'single':answer==='ALL'?'all':answer==='MULTIPLE'?'multiple':'deleted_or_all_awarded',explanation:$('explanation').value.trim(),marks:Number($('marks').value)||1,negativeMarks:Number($('negative').value)||0,tags:$('tags').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),previousExam:$('previousExam').value.trim(),createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await setDoc(doc(db,'exams',examDocId(exam)),{name:exam,subject,updatedAt:serverTimestamp(),createdBy:auth.currentUser?.email||''},{merge:true});$('msg').className='msg';$('msg').textContent='✓ Question saved successfully with question/option images.';['question','a','b','c','d','explanation','tags','previousExam','topic'].forEach(id=>$(id).value='');$('questionImage').value='';$('questionPreview').style.display='none';['A','B','C','D'].forEach(l=>{$('image'+l).value='';$('preview'+l).style.display='none'});$('answer').value='';$('difficulty').value='medium';$('status').value='verified'}catch(e){console.error(e);$('msg').className='msg error';$('msg').textContent='Could not save. Check Firestore permissions or image size.'}finally{saveBtn.disabled=false;saveBtn.textContent='Save Question'}};
</script></body></html>
