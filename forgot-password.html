<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.container{width:min(400px,100%);background:#171a21;border:1px solid #2b3240;padding:28px;border-radius:18px;box-sizing:border-box}h2{text-align:center;color:#60a5fa;margin-top:0}p{color:#9aa4b2;line-height:1.5}input{width:100%;padding:13px;margin:10px 0;background:#1e232d;color:#fff;border:1px solid #394354;border-radius:9px;box-sizing:border-box}button{width:100%;padding:13px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-weight:700;font-size:16px;cursor:pointer}.message{text-align:center;margin-top:14px;min-height:20px}.back{text-align:center;margin-top:16px}.back a{color:#60a5fa;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h2>Reset Password</h2>
<p>Enter your registered email address. Firebase will send you a password-reset link.</p>
<input type="email" id="email" placeholder="Email Address" autocomplete="email">
<button id="resetBtn">Send Reset Link</button>
<p id="message" class="message"></p>
<div class="back"><a href="login.html">← Back to Login</a></div>
</div>
<script type="module">
import { auth } from "./firebase-config.js";
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
const email=document.getElementById("email"),btn=document.getElementById("resetBtn"),message=document.getElementById("message");
btn.addEventListener("click",async()=>{const e=email.value.trim();message.textContent="";if(!e){message.textContent="Please enter your email address.";message.style.color="#fca5a5";return;}btn.disabled=true;try{await sendPasswordResetEmail(auth,e);message.style.color="#86efac";message.textContent="Reset link sent. Check your email inbox.";}catch(error){message.style.color="#fca5a5";message.textContent=error.code==="auth/user-not-found"?"No account was found with this email.":"Unable to send reset link. Please try again.";btn.disabled=false;}});
</script>
</body>
