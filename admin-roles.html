<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#101827;border:1px solid #263149;border-radius:17px;padding:17px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #34415b;background:#0b1220;color:#fff;margin-top:6px}.btn{padding:11px 15px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.muted{color:#8f9bb5;font-size:12px}.perm{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.perm label{padding:9px;border:1px solid #29364e;border-radius:9px;background:#0b1220;font-size:12px}.item{padding:13px;border:1px solid #29364e;border-radius:12px;margin:9px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.danger{background:#7f1d1d}@media(max-width:600px){.grid,.perm{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>🛡️ Admin Roles</h1><div class="muted">Manage administrator identities and permission profiles.</div></div><button class="btn" onclick="location.href='admin-control-center.html'">← Control Center</button></div><section class="card"><h2>Add / Update Admin</h2><div class="grid"><label>Email<input id="email" type="email" placeholder="admin@example.com"></label><label>Role<select id="role"><option value="manager">Manager</option><option value="content">Content Manager</option><option value="support">Support</option><option value="analyst">Analyst</option></select></label></div><div class="perm"><label><input type="checkbox" value="students" checked> Students</label><label><input type="checkbox" value="exams" checked> Exams</label><label><input type="checkbox" value="questions" checked> Questions</label><label><input type="checkbox" value="liveTests" checked> Live Tests</label><label><input type="checkbox" value="results" checked> Results</label><label><input type="checkbox" value="premium"> Premium</label><label><input type="checkbox" value="payments"> Payments</label><label><input type="checkbox" value="settings"> Site Settings</label></div><br><button class="btn" id="save">Save Role</button><span id="msg"></span></section><section class="card"><h2>Configured Admins</h2><div class="muted">Role records are stored in Firestore. Firebase custom claims must be synchronized by a trusted backend before these roles are used to authorize Security Rules.</div><div id="list">Loading…</div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,setDoc,doc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com',$=id=>document.getElementById(id);let ok=false;onAuthStateChanged(auth,u=>{ok=!!u&&isSuperAdmin(u);if(!ok)location.replace('admin.html');else load()});async function load(){const s=await getDocs(collection(db,'adminUsers'));$('list').innerHTML=s.empty?'<p class="muted">No role records yet.</p>':s.docs.map(d=>{const x=d.data();return `<div class="item"><div><b>${esc(d.id)}</b><div class="muted">${esc(x.role||'manager')} • ${(x.permissions||[]).join(', ')||'none'}</div></div><button class="btn danger" data-id="${esc(d.id)}">Remove</button></div>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this admin role record?')){await deleteDoc(doc(db,'adminUsers',b.dataset.id));await audit('REMOVE_ADMIN_ROLE',{email:b.dataset.id});load()}})}$('save').onclick=async()=>{if(!ok)return;const email=$('email').value.trim().toLowerCase();if(!email)return alert('Enter an email.');const permissions=[...document.querySelectorAll('.perm input:checked')].map(x=>x.value);await setDoc(doc(db,'adminUsers',email),{email,role:$('role').value,permissions,updatedAt:serverTimestamp(),updatedBy:auth.currentUser.email},{merge:true});await audit('UPDATE_ADMIN_ROLE',{email,role:$('role').value,permissions});$('email').value='';$('msg').textContent=' ✓ Saved';setTimeout(()=>$('msg').textContent='',2000);load()};async function audit(action,details){await setDoc(doc(db,'auditLogs',Date.now()+'_'+Math.random().toString(36).slice(2)),{action,admin:auth.currentUser.email,createdAt:serverTimestamp(),details})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
