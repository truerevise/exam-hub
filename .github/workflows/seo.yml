name: TrueRevise SEO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply technical SEO metadata to public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from html import unescape
          private = {"admin.html","admin-dashboard.html","admin-pass-access.html","add-question.html","bulk-import.html","bulk-import-questions.html","edit-question.html","admin-analytics.html","admin-audit.html","admin-control-center.html","admin-exam-manager.html","admin-homepage-manager.html","admin-live-access.html","admin-notifications.html","admin-payments.html","admin-question-reports.html","admin-roles.html","admin-site-settings.html","admin-clean-embedded-options.html","admin-content-health.html","daily-live-admin.html","manage-exams.html","students.html","student-results.html","dashboard.html","profile.html","results.html","review.html","saved-questions.html","pass-access.html","premium-pass.html","login.html","register.html","forgot-password.html","verify-account.html","test.html","live-test.html","mock-test.html"}
          def remove_old_seo(text):
            for p in [r'<!-- TrueRevise SEO -->.*?(?=<style|</head>)',r'<meta\s+name=["\']description["\'][^>]*>\s*',r'<meta\s+name=["\']robots["\'][^>]*>\s*',r'<meta\s+name=["\']googlebot["\'][^>]*>\s*',r'<meta\s+name=["\']author["\'][^>]*>\s*',r'<link\s+rel=["\']canonical["\'][^>]*>\s*',r'<link\s+rel=["\']icon["\'][^>]*>\s*',r'<link\s+rel=["\']manifest["\'][^>]*>\s*',r'<meta\s+property=["\']og:[^"\']+["\'][^>]*>\s*',r'<meta\s+name=["\']twitter:[^"\']+["\'][^>]*>\s*',r'<script\s+type=["\']application/ld\+json["\']>.*?</script>\s*']:
              text=re.sub(p,'',text,flags=re.I|re.S)
            return text
          def meta(text,pattern,fallback):
            m=re.search(pattern,text,flags=re.I|re.S);return unescape(m.group(1).strip()) if m else fallback
          for path in Path('.').glob('*.html'):
            name=path.name;text=path.read_text(encoding='utf-8')
            if '<html' not in text.lower():continue
            if name in private:
              old=meta(text,r'<title>(.*?)</title>','');text=remove_old_seo(text);text=re.sub(r'<title>.*?</title>\s*','',text,count=1,flags=re.I|re.S)
              title=old or name.replace('.html','').replace('-',' ').title()+' | True Revise Admin'
              seo=f'<!-- TrueRevise Private Page -->\n<meta name="robots" content="noindex,nofollow,noarchive">\n<meta name="googlebot" content="noindex,nofollow,noarchive">\n<title>{title}</title>\n'
              text=re.sub(r'<head>','<head>\n'+seo,text,count=1,flags=re.I);path.write_text(text,encoding='utf-8');continue
            old_title=meta(text,r'<title>(.*?)</title>','');old_desc=meta(text,r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']','')
            if name=='index.html':title='True Revise | UGC NET, TSPSC & Competitive Exam Mock Tests';desc='Prepare for UGC NET, TSPSC and other competitive exams with daily live tests, mock exams, subject-wise practice and instant results on True Revise.';canonical='https://truerevise.com/'
            elif name=='current-affairs.html':title='Current Affairs for Competitive Exams | True Revise';desc='Practice exam-focused current affairs covering important events, government schemes, awards, appointments and daily quiz preparation on True Revise.';canonical='https://truerevise.com/current-affairs.html'
            else:title=old_title or name.replace('.html','').replace('-',' ').title()+' | True Revise';desc=old_desc or f'{title.replace(" | True Revise","")} resources, information and exam preparation content from True Revise.';canonical='https://truerevise.com/'+name
            seo=f'<!-- TrueRevise SEO -->\n<meta name="description" content="{desc}">\n<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n<meta name="author" content="True Revise">\n<link rel="canonical" href="{canonical}">\n<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n<meta name="theme-color" content="#070b14">\n<meta property="og:type" content="website">\n<meta property="og:url" content="{canonical}">\n<meta property="og:title" content="{title}">\n<meta property="og:description" content="{desc}">\n<meta property="og:site_name" content="True Revise">\n<meta property="og:locale" content="en_IN">\n<meta name="twitter:card" content="summary">\n<meta name="twitter:title" content="{title}">\n<meta name="twitter:description" content="{desc}">\n'
            text=remove_old_seo(text);text=re.sub(r'<title>.*?</title>\s*','',text,count=1,flags=re.I|re.S);text=re.sub(r'<head>','<head>\n'+seo,text,count=1,flags=re.I);text=re.sub(r'(<meta charset=[^>]+>)',r'\1\n<title>'+title+'</title>',text,count=1,flags=re.I);path.write_text(text,encoding='utf-8')
          PY
      - name: Refresh sitemap with all public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          from html import escape
          private={"admin.html","admin-dashboard.html","admin-pass-access.html","add-question.html","bulk-import.html","bulk-import-questions.html","edit-question.html","admin-analytics.html","admin-audit.html","admin-control-center.html","admin-exam-manager.html","admin-homepage-manager.html","admin-live-access.html","admin-notifications.html","admin-payments.html","admin-question-reports.html","admin-roles.html","admin-site-settings.html","admin-clean-embedded-options.html","admin-content-health.html","daily-live-admin.html","manage-exams.html","students.html","student-results.html","dashboard.html","profile.html","results.html","review.html","saved-questions.html","pass-access.html","premium-pass.html","login.html","register.html","forgot-password.html","verify-account.html","test.html","live-test.html","mock-test.html"}
          urls=['https://truerevise.com/']
          for p in sorted(Path('.').glob('*.html')):
            if p.name=='index.html' or p.name in private:continue
            t=p.read_text(encoding='utf-8',errors='ignore').lower()
            if '<html' in t and 'noindex' not in t:urls.append('https://truerevise.com/'+p.name)
          rows='\n'.join(f'  <url><loc>{escape(u)}</loc><lastmod>{date.today().isoformat()}</lastmod></url>' for u in urls)
          Path('sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+rows+'\n</urlset>\n',encoding='utf-8')
          PY
      - name: Commit SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml
          if git diff --cached --quiet; then echo "No SEO changes needed"; else git commit -m "Expand public page SEO and sitemap"; git push; fi
