name: TrueRevise SEO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply technical SEO metadata to public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from html import unescape

          private = {
              "admin.html", "admin-dashboard.html", "admin-pass-access.html", "add-question.html", "bulk-import.html", "bulk-import-questions.html", "edit-question.html",
              "admin-analytics.html", "admin-audit.html", "admin-control-center.html",
              "admin-exam-manager.html", "admin-homepage-manager.html", "admin-live-access.html",
              "admin-notifications.html", "admin-pass-access.html", "admin-payments.html",
              "admin-question-reports.html", "admin-roles.html", "admin-site-settings.html",
              "admin-clean-embedded-options.html", "daily-live-admin.html", "manage-exams.html", "students.html", "student-results.html",
              "dashboard.html", "profile.html", "results.html", "review.html", "saved-questions.html",
              "pass-access.html", "premium-pass.html", "login.html", "register.html", "forgot-password.html",
              "verify-account.html", "test.html", "live-test.html", "mock-test.html"
          }

          def remove_old_seo(text):
              patterns = [
                  r'<!-- TrueRevise SEO -->.*?(?=<style|</head>)',
                  r'<meta\s+name=["\']description["\'][^>]*>\s*',
                  r'<meta\s+name=["\']robots["\'][^>]*>\s*',
                  r'<meta\s+name=["\']googlebot["\'][^>]*>\s*',
                  r'<meta\s+name=["\']author["\'][^>]*>\s*',
                  r'<link\s+rel=["\']canonical["\'][^>]*>\s*',
                  r'<link\s+rel=["\']icon["\'][^>]*>\s*',
                  r'<link\s+rel=["\']manifest["\'][^>]*>\s*',
                  r'<meta\s+property=["\']og:[^"\']+["\'][^>]*>\s*',
                  r'<meta\s+name=["\']twitter:[^"\']+["\'][^>]*>\s*',
                  r'<script\s+type=["\']application/ld\+json["\']>.*?</script>\s*',
              ]
              for pattern in patterns:
                  text = re.sub(pattern, '', text, flags=re.I | re.S)
              return text

          def get_meta(text, pattern, fallback):
              match = re.search(pattern, text, flags=re.I | re.S)
              return unescape(match.group(1).strip()) if match else fallback

          for path in Path('.').glob('*.html'):
              name = path.name
              text = path.read_text(encoding='utf-8')
              if '<html' not in text.lower():
                  continue

              if name in private:
                  old_title = get_meta(text, r'<title>(.*?)</title>', '')
                  text = remove_old_seo(text)
                  text = re.sub(r'<title>.*?</title>\s*', '', text, count=1, flags=re.I | re.S)
                  private_title = old_title or name.replace('.html', '').replace('-', ' ').title() + ' | True Revise Admin'
                  private_seo = f'''<!-- TrueRevise Private Page -->
          <meta name="robots" content="noindex,nofollow,noarchive">
          <meta name="googlebot" content="noindex,nofollow,noarchive">
          <title>{private_title}</title>
          '''
                  text = re.sub(r'<head>', '<head>\n' + private_seo, text, count=1, flags=re.I)
                  path.write_text(text, encoding='utf-8')
                  continue

              old_title = get_meta(text, r'<title>(.*?)</title>', '')
              old_desc = get_meta(text, r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', '')

              if name == 'index.html':
                  title = 'True Revise | UGC NET, TSPSC & Competitive Exam Mock Tests'
                  desc = 'Prepare for UGC NET, TSPSC and other competitive exams with daily live tests, mock exams, subject-wise practice and instant results on True Revise.'
                  canonical = 'https://truerevise.com/'
              elif name == 'current-affairs.html':
                  title = 'Current Affairs for Competitive Exams | True Revise'
                  desc = 'Practice exam-focused current affairs covering important events, government schemes, awards, appointments and daily quiz preparation on True Revise.'
                  canonical = 'https://truerevise.com/current-affairs.html'
              else:
                  title = old_title or name.replace('.html', '').replace('-', ' ').title() + ' | True Revise'
                  desc = old_desc or f'{title.replace(" | True Revise", "")} resources, information and exam preparation content from True Revise.'
                  canonical = 'https://truerevise.com/' + name

              structured = f'''<script type="application/ld+json">{{
            "@context":"https://schema.org",
            "@type":"WebPage",
            "name":{title!r},
            "url":{canonical!r},
            "description":{desc!r},
            "isPartOf":{{"@type":"WebSite","name":"True Revise","url":"https://truerevise.com/"}}
          }}</script>'''.replace("'", '"')

              seo = f'''<!-- TrueRevise SEO -->
          <meta name="description" content="{desc}">
          <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
          <meta name="author" content="True Revise">
          <link rel="canonical" href="{canonical}">
          <link rel="icon" href="/favicon.svg" type="image/svg+xml">
          <meta name="theme-color" content="#070b14">
          <meta property="og:type" content="website">
          <meta property="og:url" content="{canonical}">
          <meta property="og:title" content="{title}">
          <meta property="og:description" content="{desc}">
          <meta property="og:site_name" content="True Revise">
          <meta property="og:locale" content="en_IN">
          <meta name="twitter:card" content="summary">
          <meta name="twitter:title" content="{title}">
          <meta name="twitter:description" content="{desc}">
          {structured}
          '''

              text = remove_old_seo(text)
              text = re.sub(r'<title>.*?</title>\s*', '', text, count=1, flags=re.I | re.S)
              text = re.sub(r'<head>', '<head>\n' + seo, text, count=1, flags=re.I)
              text = re.sub(r'(<meta charset=[^>]+>)', r'\1\n<title>' + title + '</title>', text, count=1, flags=re.I)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Refresh sitemap with all public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          from html import escape

          private = {
              "admin.html", "admin-dashboard.html", "admin-pass-access.html", "add-question.html", "bulk-import.html", "bulk-import-questions.html", "edit-question.html",
              "admin-analytics.html", "admin-audit.html", "admin-control-center.html",
              "admin-exam-manager.html", "admin-homepage-manager.html", "admin-live-access.html",
              "admin-notifications.html", "admin-pass-access.html", "admin-payments.html",
              "admin-question-reports.html", "admin-roles.html", "admin-site-settings.html",
              "admin-clean-embedded-options.html", "daily-live-admin.html", "manage-exams.html", "students.html", "student-results.html",
              "dashboard.html", "profile.html", "results.html", "review.html", "saved-questions.html",
              "pass-access.html", "premium-pass.html", "login.html", "register.html", "forgot-password.html",
              "verify-account.html", "test.html", "live-test.html", "mock-test.html"
          }

          today = date.today().isoformat()
          urls = ['https://truerevise.com/']
          for path in sorted(Path('.').glob('*.html')):
              if path.name == 'index.html' or path.name in private:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore').lower()
              if '<html' in text and 'noindex' not in text:
                  urls.append('https://truerevise.com/' + path.name)

          rows = '\n'.join(f'  <url><loc>{escape(url)}</loc><lastmod>{today}</lastmod></url>' for url in urls)
          Path('sitemap.xml').write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              + rows + '\n</urlset>\n',
              encoding='utf-8'
          )
          print(f'Added {len(urls)} public URLs to sitemap.xml')
          PY

      - name: Commit SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml
          if git diff --cached --quiet; then
            echo "No SEO changes needed"
          else
            git commit -m "Expand public page SEO and sitemap"
            git push
          fi
