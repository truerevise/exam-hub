name: Install Question Report UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject report modules
        shell: python
        run: |
          from pathlib import Path

          pages = {
              'test.html': '<script type="module" src="./question-report.js"></script>',
              'mock-test.html': '<script type="module" src="./question-report.js"></script>',
              'live-test.html': '<script type="module" src="./question-report.js"></script>',
              'daily-live-test.html': '<script type="module" src="./question-report.js"></script>',
              'admin-dashboard.html': '<script type="module" src="./admin-question-report-widget.js"></script>',
          }
          for name, tag in pages.items():
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if tag in text:
                  continue
              marker = '</body>'
              if marker in text:
                  text = text.replace(marker, tag + marker, 1)
              else:
                  text += '\n' + tag + '\n'
              p.write_text(text, encoding='utf-8')

      - name: Commit injected UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test.html mock-test.html live-test.html daily-live-test.html admin-dashboard.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add question reporting UI [skip ci]"
          git push
