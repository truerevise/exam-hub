name: One-time fix - submit visibility

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-submit-visibility.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch test navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path('test.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<button id="submitBtn">✓ Submit Test</button>',
                  '<button id="submitBtn" style="display:none">✓ Submit Test</button>',
              ),
              (
                  '<button id="sideSubmit" class="side-submit">SUBMIT TEST</button>',
                  '<button id="sideSubmit" class="side-submit" style="display:none">SUBMIT TEST</button>',
              ),
              (
                  "$('submitBtn').style.display='block';",
                  "$('submitBtn').style.display=currentQuestion===questions.length-1?'block':'none';$('sideSubmit').style.display=currentQuestion===questions.length-1?'block':'none';",
              ),
              (
                  "$('prevBtn').style.display=$('nextBtn').style.display=$('submitBtn').style.display='none'",
                  "$('prevBtn').style.display=$('nextBtn').style.display=$('submitBtn').style.display='none';$('sideSubmit').style.display='none'",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected pattern: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patched test page and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test.html .github/workflows/one-time-fix-submit-visibility.yml
          git rm .github/workflows/one-time-fix-submit-visibility.yml
          git commit -m 'Show submit only on last test question'
          git push