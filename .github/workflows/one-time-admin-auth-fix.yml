name: One-time admin authorization fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-admin-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix admin authorization and Firestore rules
        shell: python
        run: |
          from pathlib import Path
          import re

          emails = "['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com']"
          helper = f"const SUPER_ADMINS={emails};function isSuperAdmin(u){{return !!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()));}}const ADMIN='kiransingh.smile@gmail.com';"

          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              if "const ADMIN='kiransingh.smile@gmail.com';" not in s:
                  continue
              s = s.replace("const ADMIN='kiransingh.smile@gmail.com';", helper)
              s = s.replace("u?.email?.toLowerCase()!==ADMIN.toLowerCase()", "!isSuperAdmin(u)")
              s = s.replace("u?.email?.toLowerCase()===ADMIN.toLowerCase()", "isSuperAdmin(u)")
              s = s.replace("u.email.toLowerCase()===ADMIN.toLowerCase()", "isSuperAdmin(u)")
              s = s.replace("u.email?.toLowerCase()!==ADMIN.toLowerCase()", "!isSuperAdmin(u)")
              s = s.replace("u.email?.toLowerCase()===ADMIN.toLowerCase()", "isSuperAdmin(u)")
              s = s.replace("(u.email||'').toLowerCase()!==ADMIN.toLowerCase()", "!isSuperAdmin(u)")
              s = s.replace("(u.email||'').toLowerCase()===ADMIN.toLowerCase()", "isSuperAdmin(u)")
              s = s.replace("createdBy:ADMIN", "createdBy:auth.currentUser?.email||''")
              s = s.replace("premiumGrantedBy:ADMIN", "premiumGrantedBy:auth.currentUser?.email||''")
              p.write_text(s, encoding='utf-8')

          for p in Path('.').glob('*.js'):
              s = p.read_text(encoding='utf-8')
              if "const ADMIN='kiransingh.smile@gmail.com';" not in s:
                  continue
              s = s.replace("const ADMIN='kiransingh.smile@gmail.com';", helper)
              s = s.replace("u?.email?.toLowerCase()!==ADMIN.toLowerCase()", "!isSuperAdmin(u)")
              s = s.replace("u?.email?.toLowerCase()===ADMIN.toLowerCase()", "isSuperAdmin(u)")
              s = s.replace("u.email.toLowerCase()===ADMIN.toLowerCase()", "isSuperAdmin(u)")
              s = s.replace("u.email?.toLowerCase()!==ADMIN.toLowerCase()", "!isSuperAdmin(u)")
              s = s.replace("u.email?.toLowerCase()===ADMIN.toLowerCase()", "isSuperAdmin(u)")
              s = s.replace("(u.email||'').toLowerCase()!==ADMIN.toLowerCase()", "!isSuperAdmin(u)")
              s = s.replace("(u.email||'').toLowerCase()===ADMIN.toLowerCase()", "isSuperAdmin(u)")
              s = s.replace("createdBy:ADMIN", "createdBy:auth.currentUser?.email||''")
              s = s.replace("premiumGrantedBy:ADMIN", "premiumGrantedBy:auth.currentUser?.email||''")
              p.write_text(s, encoding='utf-8')

          rules = Path('firestore.rules')
          s = rules.read_text(encoding='utf-8')
          old = "return signedIn() && request.auth.token.email == 'kiransingh.smile@gmail.com';"
          new = "return signedIn() && request.auth.token.email in ['commercewithkiransingh@gmail.com', 'kiransingh.smile@gmail.com'];"
          s = s.replace(old, new)

          if 'match /subjects/{subjectId}' not in s:
              marker = "    match /exams/{examId} {"
              block = "    match /subjects/{subjectId} {\n      allow read: if signedIn();\n      allow create, update, delete: if hasPermission('exams') || hasPermission('questions');\n    }\n"
              s = s.replace(marker, block + marker)

          if 'match /bulkImportDrafts/{draftId}' not in s:
              marker = "    match /questions/{questionId} {"
              block = "    match /bulkImportDrafts/{draftId} {\n      allow read, write: if hasPermission('questions') || hasPermission('exams');\n    }\n"
              s = s.replace(marker, block + marker)

          rules.write_text(s, encoding='utf-8')

      - name: Commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/one-time-admin-auth-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Fix admin authorization across admin pages and Firestore'
          git push