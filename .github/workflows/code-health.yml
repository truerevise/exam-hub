name: Code health

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check inline JavaScript in HTML
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          pattern = re.compile(r'<script(?P<attrs>[^>]*)>(?P<code>.*?)</script>', re.I|re.S)
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              for i, match in enumerate(pattern.finditer(text), 1):
                  attrs = match.group('attrs').lower()
                  code = match.group('code')
                  if 'src=' in attrs or 'application/ld+json' in attrs or not code.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                      f.write(code)
                      temp = f.name
                  result = subprocess.run(['node','--check',temp], text=True, capture_output=True)
                  if result.returncode:
                      print(result.stdout)
                      print(result.stderr)
                      raise SystemExit(f'Inline JavaScript syntax error: {path} script #{i}')
          print('Inline JavaScript syntax checks passed.')
          PY
      - name: Check critical files exist
        shell: bash
        run: |
          set -e
          for f in index.html firebase-config.js firestore.rules support.html add-question.html test.html dashboard.html; do
            test -f "$f" || { echo "Missing critical file: $f"; exit 1; }
          done
          echo 'Critical file check passed.'
