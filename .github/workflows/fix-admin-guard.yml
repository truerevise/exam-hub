name: Fix admin guard helper

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared Super Admin helper to affected pages
        shell: python
        run: |
          from pathlib import Path
          changed = []
          helper = "const SUPER_ADMINS=['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com'];function isSuperAdmin(u){return !!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()));}"
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              if 'isSuperAdmin(' not in s or 'function isSuperAdmin' in s:
                  continue
              old = None
              for candidate in ["const ADMIN='commercewithkiransingh@gmail.com';", "const ADMIN='kiransingh.smile@gmail.com';"]:
                  if candidate in s:
                      old = candidate
                      break
              if old:
                  s = s.replace(old, helper + old, 1)
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print('Fixed:', ', '.join(changed) if changed else 'none')
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-admin-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix shared Super Admin guard on admin pages'
          git push
