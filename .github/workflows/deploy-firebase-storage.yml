name: Deploy Firebase Storage Rules

on:
  push:
    branches:
      - main
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Firebase CLI
        run: npx --yes firebase-tools@15.28.1 --version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Storage Rules
        run: npx --yes firebase-tools@15.28.1 deploy --only storage --project exam-hub-db0eb
