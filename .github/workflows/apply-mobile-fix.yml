name: Apply mobile home fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add mobile stylesheet to home page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="/mobile-fix.css">'
          if link not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in index.html')
              s = s.replace(marker, link + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Mobile stylesheet linked.')
          else:
              print('Mobile stylesheet already linked.')
          PY

      - name: Commit home page mobile fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make home page mobile friendly'
          git push
