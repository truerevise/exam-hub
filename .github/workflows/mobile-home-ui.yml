name: Apply mobile home UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mobile-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject mobile stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<link rel="stylesheet" href="/mobile-home.css?v=2">'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit mobile UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix mobile UI for home page'
          git push
