name: Apply mobile home UI

on:
  push:
    branches: [main]

permissions:
  contents: write

# Prevent multiple runs from racing while committing back to main.
concurrency:
  group: mobile-home-ui
  cancel-in-progress: true

jobs:
  mobile-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject mobile stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="/mobile-home.css?v=2">'

          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in index.html')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Mobile stylesheet added.')
          else:
              print('Mobile stylesheet already present.')
          PY

      - name: Commit and push only if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- index.html; then
            echo 'No mobile UI change required.'
            exit 0
          fi

          git add index.html
          git commit -m 'Apply mobile home UI [skip mobile-ui]'

          # Rebase onto the newest main commit in case another workflow
          # pushed while this job was running.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
