name: Fix test language default

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make English the default test language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace("currentLang=localStorage.getItem('trueReviseLang')||'en'", "currentLang='en'")
          s2 = s2.replace("currentLang=b.dataset.lang;localStorage.setItem('trueReviseLang',currentLang);", "currentLang=b.dataset.lang;")
          if s2 == s:
              print('No language-default change needed.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Updated test.html: English is now the default; Telugu changes only on explicit selection.')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-test-language-default.yml
          if git diff --quiet -- test.html; then
            git add -A
            git commit -m 'Remove one-time language fix workflow' || exit 0
          else
            git add test.html .github/workflows/fix-test-language-default.yml
            git commit -m 'Make English default in test language switcher'
          fi
          git push