name: Apply Super Admin guard fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin pages
        shell: python
        run: |
          from pathlib import Path
          helper = "const SUPER_ADMINS=['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com'];function isSuperAdmin(u){return !!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()));}"
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'isSuperAdmin(' not in s or 'function isSuperAdmin' in s:
                  continue
              for old in ["const ADMIN='commercewithkiransingh@gmail.com';", "const ADMIN='kiransingh.smile@gmail.com';"]:
                  if old in s:
                      s=s.replace(old,helper+old,1)
                      p.write_text(s,encoding='utf-8')
                      changed.append(p.name)
                      break
          print('Patched:', changed)
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-admin-guard-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Super Admin authorization on admin pages'
          git push
