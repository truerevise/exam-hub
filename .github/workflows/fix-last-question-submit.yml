name: Verify last question submit button

on:
  push:
    branches: [main]
    paths:
      - 'live-test.html'
      - '.github/workflows/fix-last-question-submit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify submit button is last-question only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('live-test.html').read_text(encoding='utf-8')
          if '#submit{display:none!important}' in s:
              raise SystemExit('Found a forced-visible submit rule.')
          patterns = [
              r"style\.display\s*=\s*i\s*===\s*qs\.length\s*-\s*1\s*\?\s*['\"]block['\"]\s*:\s*['\"]none['\"]",
              r"style\.display\s*=\s*current\s*===\s*qs\.length\s*-\s*1\s*\?\s*['\"]block['\"]\s*:\s*['\"]none['\"]",
          ]
          if not any(re.search(p, s) for p in patterns):
              raise SystemExit('Could not verify last-question submit visibility logic.')
          print('Last-question submit visibility check passed.')
          PY
