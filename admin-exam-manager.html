<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Manager • True Revise</title><style>body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.card{background:#101827;border:1px solid #29344a;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select{width:100%;box-sizing:border-box;padding:10px;background:#0b1220;color:#fff;border:1px solid #34415b;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800}.btn.secondary{background:#182238;border:1px solid #31405d}.row{display:flex;gap:8px;flex-wrap:wrap}.item{padding:13px;border-top:1px solid #263149;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.muted{color:#8f9bb5;font-size:12px}.pill{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:#052e1a;color:#86efac}.off{background:#2b1b08;color:#fcd34d}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="head"><div><h1>📝 Exam & Subject Manager</h1><div class="muted">Create, enable, hide and configure exams.</div></div><button class="btn secondary" onclick="location.href='admin-dashboard.html'">← Admin</button></div><section class="card"><h3>Create / Update Exam</h3><input type="hidden" id="id"><div class="grid"><input id="name" placeholder="Exam name"><input id="subject" placeholder="Primary subject"><input id="questions" type="number" min="1" placeholder="Number of questions"><input id="duration" type="number" min="1" placeholder="Duration (minutes)"><input id="marks" type="number" step="0.25" placeholder="Marks per question"><input id="negative" type="number" min="0" step="0.25" placeholder="Negative marks"><select id="access"><option value="free">Free</option><option value="premium">Premium</option></select><select id="enabled"><option value="true">Enabled</option><option value="false">Hidden</option></select></div><div class="row" style="margin-top:10px"><button class="btn" id="save">Save Exam</button><button class="btn secondary" id="clear">Clear</button></div><p class="muted">This manager writes to the existing <code>exams</code> collection. Existing exam fields are preserved when editing.</p></section><section class="card"><input id="search" placeholder="Search exams..." style="margin-bottom:8px"><div id="list">Loading...</div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,doc,setDoc,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com',$=id=>document.getElementById(id);let rows=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fill(id){const d=rows.find(x=>x.id===id);if(!d)return;$('id').value=id;$('name').value=d.name||d.title||'';$('subject').value=d.subject||'';$('questions').value=d.numberOfQuestions||d.totalQuestions||'';$('duration').value=d.duration||d.durationMinutes||'';$('marks').value=d.marksPerQuestion??d.marks??2;$('negative').value=d.negativeMarks??0;$('access').value=d.access||((d.premium||d.isPremium)?'premium':'free');$('enabled').value=String(d.enabled!==false)}function render(){const q=$('search').value.toLowerCase();const data=rows.filter(d=>`${d.name||''} ${d.title||''} ${d.subject||''}`.toLowerCase().includes(q));$('list').innerHTML=data.length?data.map(d=>`<div class="item"><div><b>${esc(d.name||d.title||'Untitled')}</b><div class="muted">${esc(d.subject||'No subject')} • ${d.numberOfQuestions||d.totalQuestions||'-'} questions • ${d.duration||d.durationMinutes||'-'} min • ${esc(d.access||((d.premium||d.isPremium)?'premium':'free'))}</div></div><div><span class="pill ${d.enabled===false?'off':''}">${d.enabled===false?'HIDDEN':'ENABLED'}</span> <button class="btn secondary" onclick="window.editExam('${d.id}')">Edit</button></div></div>`).join(''):'<div class="muted">No exams found.</div>'}window.editExam=fill;async function load(){const s=await getDocs(collection(db,'exams'));rows=s.docs.map(d=>({id:d.id,...d.data()}));render()}$('search').oninput=render;$('clear').onclick=()=>{document.querySelectorAll('input').forEach(x=>x.value='');$('access').value='free';$('enabled').value='true'};$('save').onclick=async()=>{const id=$('id').value;const d={name:$('name').value.trim(),title:$('name').value.trim(),subject:$('subject').value.trim(),numberOfQuestions:Number($('questions').value)||0,totalQuestions:Number($('questions').value)||0,duration:Number($('duration').value)||0,durationMinutes:Number($('duration').value)||0,marksPerQuestion:Number($('marks').value)||0,negativeMarks:Number($('negative').value)||0,access:$('access').value,premium:$('access').value==='premium',isPremium:$('access').value==='premium',enabled:$('enabled').value==='true',updatedAt:serverTimestamp()};if(!d.name) return alert('Enter an exam name');if(id)await setDoc(doc(db,'exams',id),d,{merge:true});else{d.createdAt=serverTimestamp();await addDoc(collection(db,'exams'),d)}await load();alert('Exam saved')};onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()!==ADMIN.toLowerCase())location.replace('admin.html');else load().catch(e=>alert(e.message))});</script></body></html>
