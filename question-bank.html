<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam Hub | Question Bank</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:900px;margin:auto;padding:18px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff}.q{background:#1f1f1f;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#aaa;font-size:13px}.q button{margin-top:10px;padding:9px 14px;border:0;border-radius:8px;background:#dc3545;color:#fff}@media(max-width:600px){.filters{grid-template-columns:1fr}}</style></head><body><header><div class="header-inner"><div class="brand"><button class="icon-btn" onclick="history.back()">←</button><div class="logo">Question Bank</div></div></div></header><main class="wrap"><div class="card"><div class="filters"><input id="exam" placeholder="Filter exam"><input id="subject" placeholder="Filter subject"></div><button id="refresh" style="margin-top:10px">Refresh</button></div><div id="list">Loading...</div></main><script type="module">import{db}from'./firebase-config.js';import{collection,getDocs,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const list=$('list');list.textContent='Loading...';try{const snap=await getDocs(collection(db,'questions'));const fe=$('exam').value.trim().toLowerCase(),fs=$('subject').value.trim().toLowerCase();let html='',n=0;snap.forEach(d=>{const q=d.data();if(fe&&!String(q.exam||q.Exam||'').toLowerCase().includes(fe))return;if(fs&&!String(q.subject||q.Subject||'').toLowerCase().includes(fs))return;n++;const o=q.options||{};const A=o.A??q.optionA??'',B=o.B??q.optionB??'',C=o.C??q.optionC??'',D=o.D??q.optionD??'',ans=q.correctAnswer??q.correctOption??'';html+=`<article class="q"><b>${n}. ${esc(q.question)}</b><div class="muted">${esc(q.exam||q.category)} • ${esc(q.subject)} • Correct: ${esc(ans)}</div><p>A. ${esc(A)}<br>B. ${esc(B)}<br>C. ${esc(C)}<br>D. ${esc(D)}</p><div class="muted">Explanation: ${esc(q.explanation)}</div><button data-id="${d.id}">Delete</button></article>`});list.innerHTML=n?html:'<div class="card">No questions found.</div>';list.querySelectorAll('button').forEach(b=>b.onclick=async()=>{if(confirm('Delete this question?')){await deleteDoc(doc(db,'questions',b.dataset.id));load()}})}catch(e){console.error(e);list.innerHTML='<div class="card">Unable to load questions. Check Firestore permissions.</div>'}}$('refresh').onclick=load;$('exam').oninput=load;$('subject').oninput=load;load();</script></body></html>
