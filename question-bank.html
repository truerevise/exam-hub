<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{color:#8fb5ff;text-decoration:none}.title{font-size:27px;font-weight:800;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#182238;border:1px solid #31405d}.card,.q,.test-group{background:#111722;border:1px solid #263149;border-radius:17px;margin-bottom:14px}.card{padding:17px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.filters input{width:100%;padding:12px;border-radius:10px;border:1px solid #34415b;background:#0d1422;color:#fff;outline:none}.meta{color:#8f9bb5;font-size:13px;line-height:1.5}.test-group{overflow:hidden}.test-head{padding:16px 17px;background:linear-gradient(145deg,#151e2e,#111722);border-bottom:1px solid #263149;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}.test-head:hover{background:#172033}.test-title{font-size:17px;font-weight:850;line-height:1.35}.test-label{color:#8fb5ff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.test-count{white-space:nowrap;color:#b9c7df;background:#182238;border:1px solid #31405d;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.test-chevron{font-size:17px;color:#8fa7d0;transition:transform .2s}.test-group.collapsed .test-chevron{transform:rotate(-90deg)}.test-body{padding:12px}.test-group.collapsed .test-body{display:none}.q{padding:17px;margin:0 0 12px}.q:last-child{margin-bottom:0}.q h3{margin:0 0 8px;line-height:1.45}.options{margin:12px 0;padding:12px;border-radius:11px;background:#0e1525;line-height:1.8}.answer{color:#7ee2a9;font-weight:800}.answer.special{color:#ffd58a}.delete{border:0;border-radius:9px;padding:9px 12px;background:#4a1e2a;color:#ffabb8;font-weight:800;cursor:pointer}.tag{display:inline-block;margin:5px 5px 0 0;padding:4px 8px;border-radius:999px;background:#182742;border:1px solid #30476e;color:#9eb9ef;font-size:11px}.source{margin-top:10px;padding:9px 11px;border-radius:10px;background:#151f31;border-left:3px solid #4f7ff2;color:#c6d4ed;font-size:12px}.empty{color:#8f9bb5;text-align:center;padding:28px}.group-tools{display:flex;gap:8px;flex-wrap:wrap}.group-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.group-pill{font-size:10px;font-weight:800;color:#8ee6bd;background:#0f2b20;border:1px solid #1f5c43;border-radius:999px;padding:5px 8px}@media(max-width:700px){.filters{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}.test-head{align-items:flex-start}.test-count{font-size:10px}.q{padding:14px}.group-tools{width:100%}.group-tools .btn{flex:1}}
</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="title">📚 Question Bank</div></div><div class="actions"><button class="btn secondary" id="refresh">Refresh</button><button class="btn secondary" id="expandAll">Expand All</button><button class="btn secondary" id="collapseAll">Collapse All</button><button class="btn" onclick="location.href='add-question.html'">＋ Add Question</button></div></div><section class="card"><div class="filters"><input id="exam" placeholder="🔎 Filter by exam"><input id="subject" placeholder="Filter by subject / test name"><input id="tags" placeholder="🏷️ Search admin tags (e.g. polity)"></div><div class="meta" id="count" style="margin-top:10px">Loading...</div></section><div id="list"></div></main><script type="module">const SUPER_ADMINS=['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com'];function isSuperAdmin(u){return !!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()));}import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const $=id=>document.getElementById(id);let all=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function answerLabel(q){const a=String(q.correctAnswer??q.answer??'').toUpperCase();if(a==='ALL')return 'ALL — all four options are correct';if(a==='MULTIPLE')return 'MULTIPLE — more than one option is correct';if(a==='DELETED')return 'DELETED / ALL AWARDED';if(!a)return '—';return a}function getTestName(q){const explicit=String(q.testName??q.test??'').trim();if(explicit)return explicit;return String(q.subject||'General Test').trim()||'General Test'}function getGroupKey(q){return `${String(q.exam||'Exam').trim()}\u0000${getTestName(q)}`}
function questionHtml(q,index){const o=q.options||{};const tags=(q.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');const source=q.previousExam?`<div class="source">📜 Previously conducted in: <b>${esc(q.previousExam)}</b></div>`:'';const ans=answerLabel(q),raw=String(q.correctAnswer??q.answer??'').toUpperCase(),special=['ALL','MULTIPLE','DELETED'].includes(raw);return `<article class="q"><h3>${index+1}. ${esc(q.question)}</h3><div class="meta">${esc(q.exam||'Exam')} • ${esc(getTestName(q))} • ${Number(q.marks||1)} mark${Number(q.marks||1)===1?'':'s'}</div>${tags?`<div style="margin-top:5px">${tags}</div>`:''}${source}<div class="options"><div>A. ${esc(o.A??q.optionA)}</div><div>B. ${esc(o.B??q.optionB)}</div><div>C. ${esc(o.C??q.optionC)}</div><div>D. ${esc(o.D??q.optionD)}</div></div><div class="answer${special?' special':''}">Correct: ${esc(ans)}</div><div class="meta" style="margin-top:7px">${esc(q.explanation||'No explanation added.')}</div><button class="delete" data-id="${q.id}">Delete</button></article>`}
function render(){const e=$('exam').value.toLowerCase().trim(),s=$('subject').value.toLowerCase().trim(),tagQuery=$('tags').value.toLowerCase().trim();const rows=all.filter(q=>{const tags=(q.tags||[]).join(' ').toLowerCase();const exam=String(q.exam||'').toLowerCase();const testName=getTestName(q).toLowerCase();return exam.includes(e)&&testName.includes(s)&&(!tagQuery||tags.includes(tagQuery))});$('count').textContent=`${rows.length} question${rows.length===1?'':'s'} shown • ${new Set(rows.map(getGroupKey)).size} test group${new Set(rows.map(getGroupKey)).size===1?'':'s'}`;if(!rows.length){$('list').innerHTML='<div class="card empty">No questions found.</div>';return}const groups=new Map();rows.forEach(q=>{const key=getGroupKey(q);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q)});const groupEntries=[...groups.entries()].sort((a,b)=>{const [ae,at]=a[0].split('\u0000'),[be,bt]=b[0].split('\u0000');return ae.localeCompare(be)||at.localeCompare(bt)});$('list').innerHTML=groupEntries.map(([key,questions])=>{const [exam,testName]=key.split('\u0000');return `<section class="test-group"><div class="test-head" data-group="${esc(key)}"><div><div class="test-label">Mock Test Group</div><div class="test-title">${esc(exam)} — ${esc(testName)}</div><div class="group-summary"><span class="meta">${questions.length} question${questions.length===1?'':'s'}</span><span class="group-pill">${esc(testName)}</span></div></div><div class="test-chevron">▼</div></div><div class="test-body">${questions.map((q,i)=>questionHtml(q,i)).join('')}</div></section>`}).join('');bindEvents()}
function bindEvents(){document.querySelectorAll('.test-head').forEach(head=>head.onclick=()=>head.closest('.test-group').classList.toggle('collapsed'));document.querySelectorAll('.delete').forEach(b=>b.onclick=async ev=>{ev.stopPropagation();if(confirm('Delete this question?')){b.disabled=true;try{await deleteDoc(doc(db,'questions',b.dataset.id));await load()}catch(e){console.error(e);alert('Could not delete this question. Check Firestore permissions.')}finally{b.disabled=false}}})}
async function load(){try{const snap=await getDocs(collection(db,'questions'));all=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error(e);$('count').textContent='Could not load questions';$('list').innerHTML='<div class="card empty">Firebase could not read the question bank. Check Firestore rules.</div>'}}
$('expandAll').onclick=()=>document.querySelectorAll('.test-group').forEach(g=>g.classList.remove('collapsed'));$('collapseAll').onclick=()=>document.querySelectorAll('.test-group').forEach(g=>g.classList.add('collapsed'));onAuthStateChanged(auth,u=>{if(isSuperAdmin(u))load();else location.replace('admin.html')});['exam','subject','tags'].forEach(id=>$(id).oninput=render);$('refresh').onclick=load;</script></body></html>
