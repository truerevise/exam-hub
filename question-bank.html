<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam Hub | Question Bank</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{color:#8fb5ff;text-decoration:none}.title{font-size:27px;font-weight:800;margin-top:5px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800}.secondary{background:#182238;border:1px solid #31405d}.card,.q{background:#12192b;border:1px solid #263149;border-radius:17px;padding:17px;margin-bottom:14px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input{width:100%;padding:12px;border-radius:10px;border:1px solid #34415b;background:#0f1627;color:#fff}.q h3{margin:0 0 8px;line-height:1.45}.meta{color:#8f9bb5;font-size:13px;line-height:1.5}.options{margin:12px 0;padding:12px;border-radius:11px;background:#0e1525;line-height:1.8}.answer{color:#7ee2a9;font-weight:800}.delete{border:0;border-radius:9px;padding:9px 12px;background:#4a1e2a;color:#ffabb8;font-weight:800}.empty{color:#8f9bb5;text-align:center;padding:28px}@media(max-width:600px){.filters{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="title">📚 Question Bank</div></div><div class="actions"><button class="btn secondary" id="refresh">Refresh</button><button class="btn" onclick="location.href='add-question.html'">＋ Add Question</button></div></div><section class="card"><div class="filters"><input id="exam" placeholder="🔎 Filter by exam"><input id="subject" placeholder="Filter by subject"></div><div class="meta" id="count" style="margin-top:10px">Loading...</div></section><div id="list"></div></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const $=id=>document.getElementById(id);let all=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const e=$('exam').value.toLowerCase(),s=$('subject').value.toLowerCase();const rows=all.filter(q=>String(q.exam||'').toLowerCase().includes(e)&&String(q.subject||'').toLowerCase().includes(s));$('count').textContent=`${rows.length} question${rows.length===1?'':'s'} shown`;if(!rows.length){$('list').innerHTML='<div class="card empty">No questions found.</div>';return}$('list').innerHTML=rows.map((q,i)=>{const o=q.options||{};return `<article class="q"><h3>${i+1}. ${esc(q.question)}</h3><div class="meta">${esc(q.exam||'Exam')} • ${esc(q.subject||'Subject')} • ${Number(q.marks||1)} mark${Number(q.marks||1)===1?'':'s'}</div><div class="options"><div>A. ${esc(o.A??q.optionA)}</div><div>B. ${esc(o.B??q.optionB)}</div><div>C. ${esc(o.C??q.optionC)}</div><div>D. ${esc(o.D??q.optionD)}</div></div><div class="answer">Correct: ${esc(q.correctAnswer??q.answer??'—')}</div><div class="meta" style="margin-top:7px">${esc(q.explanation||'No explanation added.')}</div><button class="delete" data-id="${q.id}">Delete</button></article>`}).join('');document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(confirm('Delete this question?')){await deleteDoc(doc(db,'questions',b.dataset.id));load()}})}async function load(){try{const snap=await getDocs(collection(db,'questions'));all=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error(e);$('count').textContent='Could not load questions';$('list').innerHTML='<div class="card empty">Firebase could not read the question bank. Check Firestore rules.</div>'}}onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()===ADMIN.toLowerCase())load();else location.replace('admin.html')});$('exam').oninput=render;$('subject').oninput=render;$('refresh').onclick=load;</script></body></html>
