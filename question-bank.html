<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#080b12"><title>True Revise | Question Bank</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{color:#8fb5ff;text-decoration:none}.title{font-size:27px;font-weight:800;margin-top:5px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800}.secondary{background:#182238;border:1px solid #31405d}.card,.q{background:#111722;border:1px solid #263149;border-radius:17px;padding:17px;margin-bottom:14px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.filters input{width:100%;padding:12px;border-radius:10px;border:1px solid #34415b;background:#0d1422;color:#fff;outline:none}.meta{color:#8f9bb5;font-size:13px;line-height:1.5}.q h3{margin:0 0 8px;line-height:1.45}.options{margin:12px 0;padding:12px;border-radius:11px;background:#0e1525;line-height:1.8}.answer{color:#7ee2a9;font-weight:800}.answer.special{color:#ffd58a}.delete{border:0;border-radius:9px;padding:9px 12px;background:#4a1e2a;color:#ffabb8;font-weight:800}.tag{display:inline-block;margin:5px 5px 0 0;padding:4px 8px;border-radius:999px;background:#182742;border:1px solid #30476e;color:#9eb9ef;font-size:11px}.source{margin-top:10px;padding:9px 11px;border-radius:10px;background:#151f31;border-left:3px solid #4f7ff2;color:#c6d4ed;font-size:12px}.empty{color:#8f9bb5;text-align:center;padding:28px}@media(max-width:700px){.filters{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="title">📚 Question Bank</div></div><div class="actions"><button class="btn secondary" id="refresh">Refresh</button><button class="btn" onclick="location.href='add-question.html'">＋ Add Question</button></div></div><section class="card"><div class="filters"><input id="exam" placeholder="🔎 Filter by exam"><input id="subject" placeholder="Filter by subject"><input id="tags" placeholder="🏷️ Search admin tags (e.g. polity)"></div><div class="meta" id="count" style="margin-top:10px">Loading...</div></section><div id="list"></div></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const $=id=>document.getElementById(id);let all=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function answerLabel(q){const a=String(q.correctAnswer??q.answer??'').toUpperCase();if(a==='ALL')return 'ALL — all four options are correct';if(a==='MULTIPLE')return 'MULTIPLE — more than one option is correct';if(a==='DELETED')return 'DELETED / ALL AWARDED';if(!a)return '—';return a}function render(){const e=$('exam').value.toLowerCase(),s=$('subject').value.toLowerCase(),tagQuery=$('tags').value.toLowerCase().trim();const rows=all.filter(q=>{const tags=(q.tags||[]).join(' ').toLowerCase();return String(q.exam||'').toLowerCase().includes(e)&&String(q.subject||'').toLowerCase().includes(s)&&(!tagQuery||tags.includes(tagQuery))});$('count').textContent=`${rows.length} question${rows.length===1?'':'s'} shown`;if(!rows.length){$('list').innerHTML='<div class="card empty">No questions found.</div>';return}$('list').innerHTML=rows.map((q,i)=>{const o=q.options||{};const tags=(q.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');const source=q.previousExam?`<div class="source">📜 Previously conducted in: <b>${esc(q.previousExam)}</b></div>`:'';const ans=answerLabel(q),special=['ALL','MULTIPLE','DELETED'].includes(String(q.correctAnswer??q.answer??'').toUpperCase());return `<article class="q"><h3>${i+1}. ${esc(q.question)}</h3><div class="meta">${esc(q.exam||'Exam')} • ${esc(q.subject||'Subject')} • ${Number(q.marks||1)} mark${Number(q.marks||1)===1?'':'s'}</div>${tags?`<div style="margin-top:5px">${tags}</div>`:''}${source}<div class="options"><div>A. ${esc(o.A??q.optionA)}</div><div>B. ${esc(o.B??q.optionB)}</div><div>C. ${esc(o.C??q.optionC)}</div><div>D. ${esc(o.D??q.optionD)}</div></div><div class="answer${special?' special':''}">Correct: ${esc(ans)}</div><div class="meta" style="margin-top:7px">${esc(q.explanation||'No explanation added.')}</div><button class="delete" data-id="${q.id}">Delete</button></article>`}).join('');document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(confirm('Delete this question?')){await deleteDoc(doc(db,'questions',b.dataset.id));load()}})}async function load(){try{const snap=await getDocs(collection(db,'questions'));all=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error(e);$('count').textContent='Could not load questions';$('list').innerHTML='<div class="card empty">Firebase could not read the question bank. Check Firestore rules.</div>'}}onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()===ADMIN.toLowerCase())load();else location.replace('admin.html')});['exam','subject','tags'].forEach(id=>$(id).oninput=render);$('refresh').onclick=load;</script></body></html>
