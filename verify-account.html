<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verify Account | Exam Hub</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.container{width:min(470px,100%);background:#171a21;border:1px solid #2b3240;padding:28px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}h2{margin:0;text-align:center;color:#60a5fa}.sub{text-align:center;color:#9ca3af;font-size:14px;line-height:1.5;margin:10px 0 24px}.step{border:1px solid #303847;border-radius:14px;padding:18px;margin:14px 0;background:#13161c}.step h3{margin:0 0 8px;font-size:16px}.status{font-size:13px;color:#9ca3af;line-height:1.5;margin:0 0 12px}.status.ok{color:#86efac}.status.warn{color:#fbbf24}button{width:100%;padding:13px;margin-top:8px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#293140}button:disabled{opacity:.6;cursor:not-allowed}input{width:100%;padding:13px;background:#1e232d;color:#fff;border:1px solid #394354;border-radius:10px;margin-top:8px;outline:none}input:focus{border-color:#2563eb}.otp{display:none}.otp.show{display:block}.message{text-align:center;min-height:22px;margin-top:14px;font-size:14px}.small{text-align:center;color:#9ca3af;font-size:12px;margin-top:16px}.small a{color:#60a5fa;text-decoration:none}</style>
</head>
<body><div class="container"><h2>Verify your account</h2><p class="sub">Exam Hub requires both your email and mobile number to be verified. This helps prevent fake contact details.</p><div class="step"><h3>1. Email verification</h3><p id="emailStatus" class="status">Checking email verification…</p><button id="emailBtn">Check email verification</button><button id="resendEmail" class="secondary">Resend verification email</button></div><div class="step"><h3>2. Mobile verification</h3><p id="phoneStatus" class="status">Verify your email first.</p><input id="phone" type="tel" placeholder="Mobile number, e.g. +919876543210" autocomplete="tel"><div id="recaptcha-container"></div><button id="sendOtp" disabled>Send OTP</button><div id="otpArea" class="otp"><input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP"><button id="verifyOtp">Verify mobile number</button></div></div><p id="message" class="message"></p><p class="small"><a href="login.html">Back to login</a></p></div>
<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, sendEmailVerification, RecaptchaVerifier, linkWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const $=id=>document.getElementById(id);let user=null,confirmation=null,recaptcha=null,finishing=false;
const msg=(text,color="#fca5a5")=>{$("message").style.color=color;$("message").textContent=text;};
function render(){if(!user)return;const verified=!!user.emailVerified;$("emailStatus").textContent=verified?`✓ Email verified: ${user.email}`:`Verification email sent to ${user.email}. Open it, then return here and tap Check email verification.`;$("emailStatus").className=`status ${verified?'ok':'warn'}`;$("phone").disabled=!verified;$("sendOtp").disabled=!verified;$("phoneStatus").textContent=verified?(user.phoneNumber?`✓ Mobile verified: ${user.phoneNumber}`:"Enter your mobile number and verify it with OTP."):"Verify your email first.";if(user.phoneNumber){$("phoneStatus").className="status ok";$("phone").value=user.phoneNumber;$("phone").disabled=true;$("sendOtp").disabled=true;$("otpArea").classList.remove("show");}}
async function refresh(){if(!auth.currentUser){location.href="login.html";return;}await auth.currentUser.reload();user=auth.currentUser;render();if(user.emailVerified&&!user.phoneNumber)setupRecaptcha();if(user.emailVerified&&user.phoneNumber)await finish();}
function setupRecaptcha(){if(recaptcha)return;recaptcha=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal",callback:()=>{},"expired-callback":()=>msg("reCAPTCHA expired. Please try again.")});recaptcha.render();}
async function finish(){if(finishing)return;finishing=true;try{const ref=doc(db,"students",user.uid),snap=await getDoc(ref),name=localStorage.getItem(`examHubPendingName_${user.uid}`)||user.displayName||"Student";if(snap.exists()){await setDoc(ref,{emailVerified:true,phoneVerified:true,verifiedAt:new Date().toISOString()},{merge:true});}else{await setDoc(ref,{name,email:user.email,mobile:user.phoneNumber,emailVerified:true,phoneVerified:true,verifiedAt:new Date().toISOString()});}localStorage.removeItem(`examHubPendingName_${user.uid}`);msg("✓ Account verified successfully. Redirecting…","#86efac");setTimeout(()=>location.href="dashboard.html",700);}catch(e){finishing=false;msg(e.message||"Unable to finish account verification.");}}
$("emailBtn").onclick=refresh;
$("resendEmail").onclick=async()=>{try{if(!auth.currentUser)throw new Error("Please login again.");await sendEmailVerification(auth.currentUser);msg("Verification email sent. Check your inbox and spam folder.","#86efac");}catch(e){msg(e.message||"Unable to send verification email.");}};
$("sendOtp").onclick=async()=>{try{const phone=$("phone").value.trim();if(!/^\+[1-9]\d{7,14}$/.test(phone)){msg("Enter a valid international mobile number, e.g. +919876543210.");return;}setupRecaptcha();$("sendOtp").disabled=true;confirmation=await linkWithPhoneNumber(auth.currentUser,phone,recaptcha);$("otpArea").classList.add("show");msg("OTP sent to your mobile number.","#86efac");}catch(e){$("sendOtp").disabled=false;msg(e.code==="auth/credential-already-in-use"?"This mobile number is already linked to another account.":(e.message||"Unable to send OTP."));}};
$("verifyOtp").onclick=async()=>{try{const code=$("otp").value.trim();if(!/^\d{6}$/.test(code)){msg("Enter the 6-digit OTP.");return;}$("verifyOtp").disabled=true;await confirmation.confirm(code);await auth.currentUser.reload();user=auth.currentUser;if(!user.phoneNumber)throw new Error("Mobile verification could not be completed.");await finish();}catch(e){$("verifyOtp").disabled=false;msg(e.code==="auth/invalid-verification-code"?"Incorrect OTP. Please try again.":(e.message||"Mobile verification failed."));}};
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return;}user=u;render();if(user.emailVerified&&!user.phoneNumber)setupRecaptcha();if(user.emailVerified&&user.phoneNumber)finish();});
</script></body></html>
