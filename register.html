<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/register.html">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.container{width:min(430px,100%);background:#171a21;border:1px solid #2b3240;padding:28px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}h2{text-align:center;color:#60a5fa;margin:0 0 8px}.sub{text-align:center;color:#9ca3af;margin:0 0 22px;font-size:14px;line-height:1.5}label{display:block;color:#d1d5db;font-size:13px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;background:#1e232d;color:#fff;border:1px solid #394354;border-radius:10px;outline:none}input:focus{border-color:#2563eb}.phone-wrap{display:flex;align-items:center;background:#1e232d;border:1px solid #394354;border-radius:10px;overflow:hidden}.phone-prefix{padding:13px 10px 13px 13px;color:#fff;font-weight:700;background:#252b37;border-right:1px solid #394354}.phone-wrap input{flex:1;width:auto;border:0;border-radius:0;background:transparent}.phone-wrap input:focus{border:0}button{width:100%;padding:14px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;margin-top:18px}button:disabled{opacity:.6;cursor:not-allowed}.message{text-align:center;margin-top:14px;min-height:22px;font-size:14px}.note{text-align:center;color:#9ca3af;font-size:12px;line-height:1.5;margin-top:16px}.links{text-align:center;margin-top:18px}.links a{color:#60a5fa;text-decoration:none}.links a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<h2>Create your Exam Hub account</h2>
<p class="sub">Enter your email and Indian mobile number. Verification can be temporarily disabled by the administrator.</p>
<label for="name">Full Name</label><input id="name" type="text" placeholder="Enter your full name" autocomplete="name">
<label for="email">Email Address</label><input id="email" type="email" placeholder="Enter your email" autocomplete="email">
<label for="mobile">Mobile Number</label>
<div class="phone-wrap"><span class="phone-prefix">+91</span><input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter 10-digit mobile number" autocomplete="tel-national"></div>
<label for="password">Password</label><input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password">
<label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password">
<button id="registerBtn" type="button">Create Account</button>
<p id="message" class="message"></p>
<p class="note">One email address and one mobile number can belong to only one Exam Hub account.</p>
<div class="links"><a href="login.html">Already have an account? Login</a></div>
</div>
<script type="module">
import { auth, db, authReady } from "./firebase-config.js";
import { createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { doc, getDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const $=id=>document.getElementById(id);
async function getVerificationSettings(){
  try{
    const snap=await getDoc(doc(db,'appSettings','verification'));
    const data=snap.exists()?snap.data():{};
    return {emailRequired:data.emailVerificationRequired===true,mobileRequired:data.mobileVerificationRequired===true};
  }catch(_){ return {emailRequired:false,mobileRequired:false}; }
}
$("mobile").addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,10)});
$("registerBtn").addEventListener("click",async()=>{
 const name=$("name").value.trim(),email=$("email").value.trim().toLowerCase(),mobile=$("mobile").value.replace(/\D/g,''),password=$("password").value,confirm=$("confirmPassword").value,message=$("message"),btn=$("registerBtn");
 message.style.color="#fca5a5";message.textContent="";
 if(!name||!email||!mobile||!password||!confirm){message.textContent="Please complete all fields.";return;}
 if(password!==confirm){message.textContent="Passwords do not match.";return;}
 if(name.length<2){message.textContent="Please enter your full name.";return;}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){message.textContent="Please enter a valid email address.";return;}
 if(!/^[6-9]\d{9}$/.test(mobile)){message.textContent="Enter a valid 10-digit Indian mobile number starting with 6, 7, 8 or 9.";return;}
 if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?#&]).{8,}$/.test(password)){message.textContent="Password must contain uppercase, lowercase, number, special character and be at least 8 characters.";return;}
 btn.disabled=true;btn.textContent="Creating account…";
 try{
   await authReady;
   const settings=await getVerificationSettings();
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   const uid=cred.user.uid;
   const mobileE164='+91'+mobile;
   const batch=writeBatch(db);
   batch.set(doc(db,'students',uid),{name,email,mobile:mobileE164,emailVerified:false,phoneVerified:false,createdAt:serverTimestamp()},{merge:true});
   batch.create(doc(db,'mobileRegistry',mobileE164),{uid,email,createdAt:serverTimestamp()});
   await batch.commit();
   localStorage.setItem(`examHubPendingName_${uid}`,name);
   if(settings.emailRequired) await sendEmailVerification(cred.user);
   if(settings.emailRequired||settings.mobileRequired) location.href='verify-account.html';
   else { message.style.color='#86efac'; message.textContent='Account created successfully. Redirecting…'; setTimeout(()=>location.href='dashboard.html',400); }
 }catch(error){
   const duplicateEmailCodes=new Set(['auth/email-already-in-use','auth/account-exists-with-different-credential']);
   message.textContent=duplicateEmailCodes.has(error.code)?"This email is already registered. Please login with the existing account.":((error.code==='permission-denied'||error.code==='already-exists')?"This mobile number is already registered. Please use another mobile number.":(error.message||"Unable to create account.")));
   btn.disabled=false;btn.textContent="Create Account";
 }
});
</script>
</body>
</html>
