<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/register.html">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.container{width:min(430px,100%);background:#171a21;border:1px solid #2b3240;padding:28px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}h2{text-align:center;color:#60a5fa;margin:0 0 8px}.sub{text-align:center;color:#9ca3af;margin:0 0 22px;font-size:14px}label{display:block;color:#d1d5db;font-size:13px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;background:#1e232d;color:#fff;border:1px solid #394354;border-radius:10px;outline:none}input:focus{border-color:#2563eb}button{width:100%;padding:14px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;margin-top:18px}button:disabled{opacity:.6;cursor:not-allowed}.message{text-align:center;margin-top:14px;min-height:22px;font-size:14px}.note{text-align:center;color:#9ca3af;font-size:12px;line-height:1.5;margin-top:16px}.links{text-align:center;margin-top:18px}.links a{color:#60a5fa;text-decoration:none}.links a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<h2>Create your Exam Hub account</h2>
<p class="sub">Your email and mobile number will be verified before your account is activated.</p>
<label for="name">Full Name</label><input id="name" type="text" placeholder="Enter your full name" autocomplete="name">
<label for="email">Email Address</label><input id="email" type="email" placeholder="Enter your email" autocomplete="email">
<label for="password">Password</label><input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password">
<label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password">
<button id="registerBtn" type="button">Create Account</button>
<p id="message" class="message"></p>
<p class="note">After registration, you must verify your email and mobile number with OTP. Do not enter another person's details.</p>
<div class="links"><a href="login.html">Already have an account? Login</a></div>
</div>
<script type="module">
import { auth } from "./firebase-config.js";
import { createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
const $=id=>document.getElementById(id);
$("registerBtn").addEventListener("click",async()=>{
 const name=$("name").value.trim(),email=$("email").value.trim(),password=$("password").value,confirm=$("confirmPassword").value,message=$("message"),btn=$("registerBtn");
 message.style.color="#fca5a5";message.textContent="";
 if(!name||!email||!password||!confirm){message.textContent="Please complete all fields.";return;}
 if(password!==confirm){message.textContent="Passwords do not match.";return;}
 if(name.length<2){message.textContent="Please enter your full name.";return;}
 if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?#&]).{8,}$/.test(password)){message.textContent="Password must contain uppercase, lowercase, number, special character and be at least 8 characters.";return;}
 btn.disabled=true;btn.textContent="Creating account…";
 try{
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   await sendEmailVerification(cred.user);
   localStorage.setItem(`examHubPendingName_${cred.user.uid}`,name);
   location.href="verify-account.html";
 }catch(error){
   message.textContent=error.code==="auth/email-already-in-use"?"This email is already registered. Please login.":(error.message||"Unable to create account.");
   btn.disabled=false;btn.textContent="Create Account";
 }
});
</script>
</body>
</html>
