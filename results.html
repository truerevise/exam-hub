<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Results</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

h2{
    text-align:center;
}

.card{
    background:#222;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>My Test Results</h2>

<div id="results"></div>

<script type="module">
import { db } from "./firebase-config.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const resultsDiv = document.getElementById("results");

    async function loadResults() {

    const snapshot = await getDocs(collection(db, "results"));

    resultsDiv.innerHTML = "";

    snapshot.forEach(doc => {

        const data = doc.data();

        resultsDiv.innerHTML += `
        <div class="card">

            <h3>${data.exam}</h3>

            <p><b>Subject:</b> ${data.subject}</p>

            <p><b>Score:</b> ${data.score}</p>

            <p><b>Total Questions:</b> ${data.totalQuestions}</p>

            <button onclick="location.href='review.html?id=${doc.id}'">
                View Solutions
            </button>

        </div>
        `;

    });

}

loadResults();

    
</script>

</body>
</html>
