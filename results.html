<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam Hub | Admin Results</title><style>body{margin:0;background:#101216;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.top a{color:#7db0ff;text-decoration:none}.card{background:#1b1e24;border:1px solid #303640;border-radius:16px;padding:18px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#242933;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:24px;margin-top:5px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input,.filters select{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #424956;background:#15181d;color:#fff}.result{border-top:1px solid #333;padding:15px 0}.result:first-child{border-top:0}.meta{color:#aeb6c2;font-size:14px;margin-top:5px}.score{font-size:20px;font-weight:800}.badge{display:inline-block;background:#1d6338;padding:5px 8px;border-radius:7px;font-size:12px}.empty{color:#aeb6c2;text-align:center;padding:25px}button{background:#2962ff;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}@media(max-width:650px){.stats,.filters{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a href="admin-dashboard.html">← Admin Dashboard</a><button id="refresh">Refresh</button></div><div class="card"><h2>📊 Results Management</h2><p class="meta">Student mock-test attempts saved in Firebase.</p><div class="stats"><div class="stat">Total Attempts<b id="total">0</b></div><div class="stat">Average Score<b id="average">0%</b></div><div class="stat">Best Score<b id="best">0%</b></div></div></div><div class="card"><div class="filters"><input id="search" placeholder="Search exam or subject"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest score</option></select></div><div id="list" style="margin-top:12px">Checking admin access...</div></div></div><script type="module">import {auth,db} from './firebase-config.js';import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import {collection,getDocs} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const $=id=>document.getElementById(id);let rows=[];onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN.toLowerCase()){location.replace('admin.html');return}load()});async function load(){try{const snap=await getDocs(collection(db,'results'));rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));render()}catch(e){console.error(e);$('list').innerHTML='<div class="empty">Unable to load results. Firestore rules may need admin read access.</div>'}}function dateValue(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(v.seconds)return v.seconds*1000;return new Date(v).getTime()||0}function pct(r){const t=Number(r.totalQuestions)||0;return t?((Number(r.score)||0)/t*100):0}function render(){const search=$('search').value.trim().toLowerCase();let data=rows.filter(r=>(`${r.exam||''} ${r.subject||''} ${r.email||''}`).toLowerCase().includes(search));data.sort((a,b)=>$('sort').value==='high'?pct(b)-pct(a):$('sort').value==='old'?dateValue(a.submittedAt)-dateValue(b.submittedAt):dateValue(b.submittedAt)-dateValue(a.submittedAt));$('total').textContent=rows.length;const p=rows.map(pct);$('average').textContent=rows.length?Math.round(p.reduce((a,b)=>a+b,0)/rows.length)+'%':'0%';$('best').textContent=rows.length?Math.round(Math.max(...p))+'%':'0%';if(!data.length){$('list').innerHTML='<div class="empty">No results found.</div>';return}$('list').innerHTML=data.map(r=>`<div class="result"><div class="score">${escapeHtml(r.exam||'Exam')} — ${escapeHtml(r.subject||'Subject')}</div><div class="meta">Score: <b>${Number(r.score)||0}/${Number(r.totalQuestions)||0}</b> &nbsp; <span class="badge">${Math.round(pct(r))}%</span></div><div class="meta">${dateValue(r.submittedAt)?new Date(dateValue(r.submittedAt)).toLocaleString():'Date unavailable'}${r.email?' • '+escapeHtml(r.email):''}</div><div class="meta">${r.uid?'Student ID: '+escapeHtml(r.uid):''}</div></div>`).join('')}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=load;</script></body></html>
