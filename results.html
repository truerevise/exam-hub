<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Results | Exam Hub</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;padding:20px}h2{text-align:center}.card{background:#222;border-radius:10px;padding:15px;margin-bottom:15px}.meta{color:#bbb;font-size:14px}.score{font-size:22px;font-weight:bold}.progress{height:8px;background:#333;border-radius:10px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#2563eb}button{width:100%;padding:12px;margin-top:10px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer}.empty{text-align:center;color:#bbb;padding:30px}.topbar{display:flex;gap:10px;margin-bottom:15px}.topbar button{margin:0}.error{background:#3b0000;border-left:4px solid #f44336;padding:15px;border-radius:8px}
</style>
</head>
<body>
<h2>My Test Results</h2>
<div class="topbar"><button onclick="location.href='dashboard.html'">← Dashboard</button><button onclick="location.href='mock-test.html'">Take Another Test</button></div>
<div id="results"><p class="empty">Loading results...</p></div>
<script type="module">
import { db } from './firebase-config.js';
import { collection,getDocs } from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
const resultsDiv=document.getElementById('results');
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function loadResults(){
  try{
    const snapshot=await getDocs(collection(db,'results'));
    if(snapshot.empty){resultsDiv.innerHTML='<div class="card empty">No test results found.<br>Take your first mock test to see your score here.</div>';return;}
    const results=snapshot.docs.map(doc=>({id:doc.id,data:doc.data()})).sort((a,b)=>{const da=a.data.submittedAt?.toDate?.()||new Date(0),db=b.data.submittedAt?.toDate?.()||new Date(0);return db-da;});
    resultsDiv.innerHTML=results.map(({id,data})=>{
      const total=Number(data.totalQuestions||0),score=Number(data.score||0),percent=total?Math.max(0,Math.min(100,(score/total)*100)):0;
      const date=data.submittedAt?.toDate?.();
      return `<div class="card"><h3>${escapeHtml(data.exam||'Exam')}</h3><p class="meta">Subject: ${escapeHtml(data.subject||'N/A')}</p><p class="meta">${date?escapeHtml(date.toLocaleString()):'Date not available'}</p><p class="score">Score: ${score} / ${total}</p><div class="progress"><span style="width:${percent}%"></span></div><p>${percent.toFixed(0)}%</p><button onclick="location.href='review.html?id=${encodeURIComponent(id)}'">View Solutions</button></div>`;
    }).join('');
  }catch(error){console.error(error);resultsDiv.innerHTML='<div class="error"><b>Unable to load results.</b><br><br>Please check your internet connection and try again.</div>';}
}
loadResults();
</script>
</body>
</html>
