</head><body><div class="wrap"><div class="top"><a href="admin-dashboard.html">← Admin Dashboard</a><button id="refresh">Refresh</button></div><div class="card"><h2>📊 Results Management</h2><p class="meta">View compiled performance or open individual student attempts.</p><div class="stats"><div class="stat">Total Attempts<b id="total">0</b></div><div class="stat">Average Score<b id="average">0%</b></div><div class="stat">Best Score<b id="best">0%</b></div></div></div><div class="tabs"><button id="compiledBtn" class="tab active">📋 Compiled Results</button><button id="individualBtn" class="tab">👤 Individual Results</button></div><section id="compiledView" class="card"><div class="filters"><input id="compiledSearch" placeholder="Search student, email, exam or subject"><select id="compiledSort"><option value="attempts">Most attempts</option><option value="average">Highest average</option><option value="best">Highest best score</option><option value="name">Name A-Z</option></select></div><div id="compiledList" style="margin-top:12px">Loading...</div></section><section id="individualView" class="card hidden"><div class="filters"><input id="search" placeholder="Search exam, subject or email"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest score</option></select></div><div id="list" style="margin-top:12px">Loading...</div></section></div><script type="module">const SUPER_ADMINS=['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com'];function isSuperAdmin(u){return !!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()));}import {auth,db} from './firebase-config.js';import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import {collection,getDocs} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const $=id=>document.getElementById(id);let rows=[];onAuthStateChanged(auth,u=>{if(!u||!isSuperAdmin(u)){location.replace('admin.html');return}load()});async function load(){try{const snap=await getDocs(collection(db,'results'));rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));renderAll()}catch(e){console.error(e);$('compiledList').innerHTML=$('list').innerHTML='<div class="empty">Unable to load results. Firestore rules may need admin read access.</div>'}}function dateValue(v){if(!v)return 0;if(typeof v.toDate==='function')return v.toDate().getTime();if(v.seconds)return v.seconds*1000;return new Date(v).getTime()||0}function pct(r){const t=Number(r.totalQuestions)||0;return t?((Number(r.score)||0)/t*100):0}function studentKey(r){return (r.uid||r.email||'unknown').toLowerCase()}function compiledData(){const map=new Map();rows.forEach(r=>{const key=studentKey(r);if(!map.has(key))map.set(key,{key,name:r.name||r.studentName||r.displayName||r.email||'Student',email:r.email||'',attempts:0,totalPct:0,best:0,last:0});const s=map.get(key);s.attempts++;const p=pct(r);s.totalPct+=p;s.best=Math.max(s.best,p);s.last=Math.max(s.last,dateValue(r.submittedAt));if((r.name||r.studentName||r.displayName)&&s.name==='Student')s.name=r.name||r.studentName||r.displayName});return [...map.values()].map(s=>({...s,average:s.attempts?s.totalPct/s.attempts:0}))}function renderCompiled(){const search=$('compiledSearch').value.trim().toLowerCase();let data=compiledData().filter(s=>`${s.name} ${s.email}`.toLowerCase().includes(search));const sort=$('compiledSort').value;data.sort((a,b)=>sort==='average'?b.average-a.average:sort==='best'?b.best-a.best:sort==='name'?a.name.localeCompare(b.name):b.attempts-a.attempts);if(!data.length){$('compiledList').innerHTML='<div class="empty">No students/results found.</div>';return}$('compiledList').innerHTML=data.map(s=>`<div class="student"><div class="student-head"><div><div class="student-name">${escapeHtml(s.name)}</div><div class="small">${escapeHtml(s.email||'Email unavailable')}</div></div><div class="badge">${s.attempts} attempt${s.attempts===1?'':'s'}</div></div><div class="meta">Average: <b>${Math.round(s.average)}%</b> &nbsp; • &nbsp; Best: <b>${Math.round(s.best)}%</b> &nbsp; • &nbsp; Last attempt: ${s.last?new Date(s.last).toLocaleString():'N/A'}</div></div>`).join('')}function renderIndividual(){const search=$('search').value.trim().toLowerCase();let data=rows.filter(r=>(`${r.exam||''} ${r.subject||''} ${r.email||''} ${r.name||r.studentName||''}`).toLowerCase().includes(search));data.sort((a,b)=>$('sort').value==='high'?pct(b)-pct(a):$('sort').value==='old'?dateValue(a.submittedAt)-dateValue(b.submittedAt):dateValue(b.submittedAt)-dateValue(a.submittedAt));if(!data.length){$('list').innerHTML='<div class="empty">No results found.</div>';return}$('list').innerHTML=data.map(r=>`<div class="result"><div class="score">${escapeHtml(r.name||r.studentName||r.email||'Student')} — ${escapeHtml(r.exam||'Exam')}</div><div class="meta">Subject: ${escapeHtml(r.subject||'N/A')} &nbsp; • &nbsp; Score: <b>${Number(r.score)||0}/${Number(r.totalQuestions)||0}</b> &nbsp; <span class="badge">${Math.round(pct(r))}%</span></div><div class="meta">${dateValue(r.submittedAt)?new Date(dateValue(r.submittedAt)).toLocaleString():'Date unavailable'}${r.email?' • '+escapeHtml(r.email):''}</div><button onclick="location.href='review.html?id=${encodeURIComponent(r.id)}'" style="margin-top:9px">View Individual Result</button></div>`).join('')}function renderAll(){const p=rows.map(pct);$('total').textContent=rows.length;$('average').textContent=rows.length?Math.round(p.reduce((a,b)=>a+b,0)/rows.length)+'%':'0%';$('best').textContent=rows.length?Math.round(Math.max(...p))+'%':'0%';renderCompiled();renderIndividual()}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('compiledBtn').onclick=()=>{ $('compiledView').classList.remove('hidden');$('individualView').classList.add('hidden');$('compiledBtn').classList.add('active');$('individualBtn').classList.remove('active')};$('individualBtn').onclick=()=>{ $('individualView').classList.remove('hidden');$('compiledView').classList.add('hidden');$('individualBtn').classList.add('active');$('compiledBtn').classList.remove('active')};$('compiledSearch').oninput=renderCompiled;$('compiledSort').onchange=renderCompiled;$('search').oninput=renderIndividual;$('sort').onchange=renderIndividual;$('refresh').onclick=load;</script></body></html>
