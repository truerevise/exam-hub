<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.card{background:#101827;border:1px solid #29344a;border-radius:16px;padding:16px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b1220;border:1px solid #263149;border-radius:13px;padding:14px}.v{font-size:26px;font-weight:900;margin-top:5px}.muted{color:#8f9bb5;font-size:12px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #263149}select,input,.btn{padding:10px;border-radius:9px;border:1px solid #34415b;background:#0b1220;color:#fff}.btn{background:#2563eb;border:0;font-weight:800;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.stats{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="head"><div><h1>📊 Results & Analytics</h1><div class="muted">Performance overview from submitted results.</div></div><button class="btn" onclick="location.href='admin-dashboard.html'">← Admin</button></div><section class="card"><div class="row"><select id="exam"><option value="">All exams</option></select><input id="search" placeholder="Search title/subject"><button class="btn" id="csv">Export CSV</button></div></section><section class="stats"><div class="stat"><div class="muted">Attempts</div><div class="v" id="attempts">0</div></div><div class="stat"><div class="muted">Average %</div><div class="v" id="avg">0%</div></div><div class="stat"><div class="muted">Highest %</div><div class="v" id="high">0%</div></div><div class="stat"><div class="muted">Students</div><div class="v" id="students">0</div></div></section><section class="card table"><table><thead><tr><th>Test</th><th>Exam</th><th>Attempts</th><th>Average</th><th>Highest</th><th>Lowest</th></tr></thead><tbody id="body"></tbody></table></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com',$=id=>document.getElementById(id);let rows=[];function pct(r){const n=Number(r.totalQuestions)||0;return n?Number(r.score||0)/n*100:0}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function grouped(){const e=$('exam').value,s=$('search').value.toLowerCase();const map=new Map();rows.filter(r=>(!e||r.exam===e)&&`${r.title||''} ${r.subject||''}`.toLowerCase().includes(s)).forEach(r=>{const key=`${r.exam||'—'}|${r.title||'Untitled'}`;if(!map.has(key))map.set(key,{title:r.title||'Untitled',exam:r.exam||'—',p:[]});map.get(key).p.push(pct(r))});return[...map.values()].map(x=>({...x,attempts:x.p.length,avg:x.p.reduce((a,b)=>a+b,0)/x.p.length,high:Math.max(...x.p),low:Math.min(...x.p)})).sort((a,b)=>b.attempts-a.attempts)}function render(){const d=grouped(),p=d.flatMap(x=>x.p),students=new Set(rows.filter(r=>!$('exam').value||r.exam===$('exam').value).map(r=>r.uid).filter(Boolean));$('attempts').textContent=p.length;$('avg').textContent=p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length)+'%':'0%';$('high').textContent=p.length?Math.round(Math.max(...p))+'%':'0%';$('students').textContent=students.size;$('body').innerHTML=d.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.exam)}</td><td>${x.attempts}</td><td>${Math.round(x.avg)}%</td><td>${Math.round(x.high)}%</td><td>${Math.round(x.low)}%</td></tr>`).join('')||'<tr><td colspan="6">No data.</td></tr>'}function exportCsv(){const d=grouped();const lines=[['Test','Exam','Attempts','Average %','Highest %','Lowest %'],...d.map(x=>[x.title,x.exam,x.attempts,x.avg.toFixed(2),x.high.toFixed(2),x.low.toFixed(2)])];const csv=lines.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='true-revise-analytics.csv';a.click();URL.revokeObjectURL(a.href)}async function load(){const[s,e]=await Promise.all([getDocs(collection(db,'results')),getDocs(collection(db,'exams'))]);rows=s.docs.map(d=>d.data());e.docs.forEach(d=>{const x=d.data(),n=x.name||x.title;if(n&&!Array.from($('exam').options).some(o=>o.value===n)){const o=document.createElement('option');o.value=n;o.textContent=n;$('exam').appendChild(o)}});render()}$('exam').onchange=render;$('search').oninput=render;$('csv').onclick=exportCsv;onAuthStateChanged(auth,u=>{if(!isSuperAdmin(u))location.replace('admin.html');else load().catch(e=>alert(e.message))});</script></body></html>
