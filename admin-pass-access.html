<!doctype html><html><head>
<!-- TrueRevise Private Page -->
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<title>Admin Pass Access | True Revise Admin</title>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#8fb5ff;text-decoration:none}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:18px}.card{background:#12192b;border:1px solid #263149;border-radius:18px;padding:18px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#8f9bb5;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #34415b;border-radius:10px;background:#0f1627;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800}.muted{color:#8f9bb5;font-size:13px}.exam{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #29344a}.tag{font-size:12px;font-weight:800}.free{color:#86efac}.premium{color:#fbbf24}.toggle{width:48px;height:26px;position:relative}.toggle input{display:none}.slider{position:absolute;inset:0;border-radius:30px;background:#3a455e}.slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.toggle input:checked+.slider{background:#16a34a}.toggle input:checked+.slider:before{transform:translateX(22px)}#msg{color:#86efac;min-height:20px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><h2>💳 Pass & Exam Access</h2></div><button class="btn" style="width:auto" id="refresh">Refresh</button></div><div class="grid"><section class="card"><h3>Premium Pass</h3><p class="muted">Set the price and validity. Daily Live Tests are always free.</p><div class="field"><label>PRICE (₹)</label><input id="price" type="number" min="1" value="20"></div><div class="field"><label>VALIDITY (DAYS)</label><input id="days" type="number" min="1" value="30"></div><button class="btn" id="save">Save Settings</button><div id="msg"></div><p class="muted">Payment will be connected to Razorpay separately. This page does not charge money.</p></section><section class="card"><h3>Exam Access</h3><p class="muted">ON = Free for everyone. OFF = Premium Pass required.</p><div id="exams">Loading...</div></section></div></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{doc,getDoc,setDoc,collection,getDocs,writeBatch,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const SUPER_ADMINS=['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com'],$=x=>document.getElementById(x);let free=new Set();function isSuperAdmin(u){return!!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()))}function examDocId(name){return'exam-'+name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,100)}async function load(){const s=await getDoc(doc(db,'passSettings','main'));if(s.exists()){const d=s.data();$('price').value=d.price??20;$('days').value=d.validityDays??30;free=new Set(d.freeExams||[])}const examSnap=await getDocs(collection(db,'exams'));const questionSnap=await getDocs(collection(db,'questions'));const existingNames=new Set(examSnap.docs.map(d=>d.data().name).filter(Boolean));const names=[...new Set([...existingNames,...questionSnap.docs.map(d=>d.data().exam)].filter(Boolean))].sort();const missing=names.filter(n=>!existingNames.has(n));if(missing.length){const batch=writeBatch(db);missing.forEach(n=>batch.set(doc(db,'exams',examDocId(n)),{name:n,createdAt:serverTimestamp(),createdBy:auth.currentUser?.email||''},{merge:true}));await batch.commit()}$('exams').innerHTML=names.length?names.map(n=>`<div class="exam"><div><b>${n}</b><div class="tag ${free.has(n)?'free':'premium'}">${free.has(n)?'FREE':'PREMIUM'}</div></div><label class="toggle"><input type="checkbox" data-exam="${n}" ${free.has(n)?'checked':''}><span class="slider"></span></label></div>`).join(''):'<p class="muted">No exams found.</p>';document.querySelectorAll('[data-exam]').forEach(x=>x.onchange=()=>x.checked?free.add(x.dataset.exam):free.delete(x.dataset.exam))}async function save(){try{await setDoc(doc(db,'passSettings','main'),{price:Number($('price').value)||20,validityDays:Number($('days').value)||30,freeExams:[...free],updatedAt:new Date(),updatedBy:auth.currentUser?.email||''},{merge:true});$('msg').textContent='✓ Settings saved.'}catch(e){console.error(e);$('msg').textContent='Unable to save. Check Firebase permissions.'}}$('save').onclick=save;$('refresh').onclick=load;onAuthStateChanged(auth,u=>isSuperAdmin(u)?load():location.replace('admin.html'));</script></body></html>
