<meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef2ff;font-family:Inter,system-ui,Arial}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#101827;border:1px solid #263149;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid #202a3d}.row:last-child{border:0}label{font-weight:800}.sub{color:#8f9bb5;font-size:12px;margin-top:4px}.input{width:100%;padding:11px;border-radius:9px;border:1px solid #33415d;background:#0b1220;color:#fff}.btn{padding:11px 15px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:800}.switch{width:48px;height:26px}.banner{width:100%;min-height:80px}.back{background:#182238;border:1px solid #31405d}.toast{margin-top:10px;color:#86efac;font-weight:800}</style></head><body><main class="wrap"><div class="top"><div><h1>⚙️ Site Settings</h1><div class="sub">Global controls for True Revise</div></div><button class="btn back" onclick="history.back()">← Back</button></div><section class="card"><h2>Access & Safety</h2><div class="row"><div><label>Registration</label><div class="sub">Allow new students to register</div></div><input class="switch" type="checkbox" id="registrationEnabled"></div><div class="row"><div><label>Maintenance mode</label><div class="sub">Show maintenance state to the app</div></div><input class="switch" type="checkbox" id="maintenanceMode"></div><div class="row"><div><label>Daily Live Tests</label><div class="sub">Enable/disable live-test access globally</div></div><input class="switch" type="checkbox" id="dailyLiveEnabled"></div><div class="row"><div><label>Email verification required</label><div class="sub">Can be switched off temporarily</div></div><input class="switch" type="checkbox" id="emailVerificationRequired"></div><div class="row"><div><label>Mobile verification required</label><div class="sub">Can be switched off temporarily</div></div><input class="switch" type="checkbox" id="mobileVerificationRequired"></div></section><section class="card"><h2>Exam Defaults</h2><div class="grid"><div><label>Default duration (minutes)</label><input class="input" id="defaultDuration" type="number" min="1"></div><div><label>Default attempts</label><input class="input" id="defaultAttempts" type="number" min="1"></div><div><label>Default marks/question</label><input class="input" id="defaultMarks" type="number" step="0.25" min="0"></div><div><label>Default negative marks</label><input class="input" id="defaultNegative" type="number" step="0.25" min="0"></div></div></section><section class="card"><h2>Homepage</h2><label>Announcement</label><textarea class="input banner" id="announcement" placeholder="Important announcement for students"></textarea><br><br><label>Promotional banner text</label><textarea class="input banner" id="promoBanner" placeholder="Premium Pass / upcoming exam promotion"></textarea></section><section class="card"><button class="btn" id="save">Save Settings</button><div id="msg" class="toast"></div></section></main><script type="module">const SUPER_ADMINS=['commercewithkiransingh@gmail.com','kiransingh.smile@gmail.com'];function isSuperAdmin(u){return !!(u?.email&&SUPER_ADMINS.includes(u.email.toLowerCase()));}import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const ADMIN='kiransingh.smile@gmail.com';const ids=['registrationEnabled','maintenanceMode','dailyLiveEnabled','emailVerificationRequired','mobileVerificationRequired','defaultDuration','defaultAttempts','defaultMarks','defaultNegative','announcement','promoBanner'];const $=x=>document.getElementById(x);async function load(){const s=await getDoc(doc(db,'appSettings','site'));const d=s.exists()?s.data():{registrationEnabled:true,maintenanceMode:false,dailyLiveEnabled:true,emailVerificationRequired:false,mobileVerificationRequired:false,defaultDuration:50,defaultAttempts:1,defaultMarks:2,defaultNegative:0,announcement:'',promoBanner:''};ids.forEach(id=>{if($(id).type==='checkbox')$(id).checked=!!d[id];else $(id).value=d[id]??''})}onAuthStateChanged(auth,u=>{if(!isSuperAdmin(u))return location.replace('admin.html');load().catch(console.error)});$('save').onclick=async()=>{const d={updatedAt:serverTimestamp(),updatedBy:auth.currentUser.email};ids.forEach(id=>d[id]=$(id).type==='checkbox'?$(id).checked:($(id).type==='number'?Number($(id).value):$(id).value));await setDoc(doc(db,'appSettings','site'),d,{merge:true});await setDoc(doc(db,'auditLogs',Date.now()+'_'+Math.random().toString(36).slice(2)),{action:'UPDATE_SITE_SETTINGS',admin:auth.currentUser.email,createdAt:serverTimestamp(),details:d});$('msg').textContent='✓ Settings saved successfully';setTimeout(()=>$('msg').textContent='',2500)}</script></body></html>
