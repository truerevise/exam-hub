<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
padding:20px;
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px auto;
max-width:350px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#0d6efd;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#084298;
}
</style>

</head>

<body>

<header>
Exam Hub
</header>

<div class="container">

<h2>Welcome Student 👋</h2>

<div class="card">
<h3>UGC NET Commerce</h3>
<button>Start Mock Test</button>
</div>

<div class="card">
<h3>My Results</h3>
<button>View Results</button>
</div>

<div class="card">
<h3>Profile</h3>
<button>My Profile</button>
</div>

<div class="card">
<button id="logoutBtn">Logout</button>
</div>

</div>

</body>
</html>
