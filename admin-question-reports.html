<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#080b12;--panel:#111722;--line:#273244;--text:#f5f7fb;--muted:#9aa5b5;--blue:#4f7cff;--amber:#fbbf24;--green:#35d69a;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17233d,#080b12 46%);color:var(--text);font-family:Inter,system-ui,sans-serif}.top{position:sticky;top:0;z-index:20;background:rgba(8,13,23,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.back{color:#b7c7ff;text-decoration:none;font-size:12px;font-weight:800}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:22px 0 40px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.eyebrow{color:#8fa7ff;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.hero h1{margin:5px 0;font-size:28px;letter-spacing:-.5px}.hero p{margin:0;color:var(--muted);font-size:12px}.count{background:#3a2c0b;border:1px solid #735a16;color:#ffd86b;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;white-space:nowrap}.toolbar{background:#0f1622;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px;display:grid;grid-template-columns:minmax(180px,1fr) 170px 220px auto;gap:9px}.toolbar input,.toolbar select{width:100%;background:#121a26;color:#fff;border:1px solid #354257;border-radius:10px;padding:10px 12px;min-height:42px;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:#5d82ff;box-shadow:0 0 0 3px #4f7cff22}.refresh{border:1px solid #3d5ea8;background:#182a52;color:#dce7ff;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.card{background:linear-gradient(145deg,#111722,#0e141e);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.report-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta{display:flex;gap:7px;flex-wrap:wrap;color:#aeb8c8;font-size:10px}.pill{padding:5px 8px;border-radius:999px;background:#1d2635}.pill.new{background:#3a2c0b;color:#ffd86b}.pill.resolved{background:#123b2e;color:#75edbd}.reason{margin:12px 0 8px;color:#ffd86b;font-size:12px;font-weight:900}.question{font-weight:800;line-height:1.6;font-size:14px;margin-bottom:12px;white-space:pre-wrap}.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;color:#c8d1df;font-size:11px}.opt{background:#171f2c;border:1px solid #2b3748;padding:9px;border-radius:9px;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{border:1px solid #48566b;background:#222c3a;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.actions .resolve{background:#174b3b;border-color:#2f8f6d}.actions button:disabled{opacity:.55;cursor:wait}.empty{text-align:center;color:var(--muted);padding:45px 15px;border:1px dashed #344258;border-radius:14px}.error{color:#ffb4bd;background:#25151a;border-color:#6b2936}.loading{color:#aeb8c8;text-align:center;padding:30px}.subtle{color:var(--muted);font-size:10px;margin-top:4px}@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.refresh{width:100%}}@media(max-width:560px){.wrap{width:calc(100% - 20px);padding-top:15px}.top{padding:11px 12px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:23px}.toolbar{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.card{padding:13px}.question{font-size:13px}.meta{font-size:9px}}</style></head><body><header class="top"><div class="brand">True Revise · Admin</div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a></header><main class="wrap"><section class="hero"><div><div class="eyebrow">CONTENT QUALITY</div><h1>🚩 Question Reports</h1><p>Review student-reported issues, correct questions and keep the question bank reliable.</p></div><div id="count" class="count">0 new</div></section><section class="toolbar"><input id="search" placeholder="Search question, exam, subject or student…"><select id="status"><option value="all">All statuses</option><option value="new">New</option><option value="resolved">Resolved</option></select><select id="reason"><option value="all">All report reasons</option><option>No correct answer</option><option>Question wording/frame is wrong</option><option>Wrong or missing option</option><option>Other issue</option></select><button id="refresh" class="refresh" type="button">↻ Refresh</button></section><div id="list"><div class="loading">Loading question reports…</div></div></main><script type="module">import{auth,db,isSuperAdmin}from'./firebase-config.js';import{collection,getDocs,doc,updateDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';const $=id=>document.getElementById(id);let reports=[];function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}function date(v){if(!v)return'—';try{const d=v.toDate?v.toDate():new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString()}catch{return'—'}}async function load(){const list=$('list');list.innerHTML='<div class="loading">Loading question reports…</div>';try{const s=await getDocs(collection(db,'questionReports'));reports=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.reportedAt?.seconds||0)-(a.reportedAt?.seconds||0));render()}catch(e){console.error('Question reports load failed',e);list.innerHTML=`<div class="card error"><b>Unable to load question reports.</b><div class="subtle">${esc(e.message||'Firestore access was denied.')}</div><div class="subtle">If this is a permissions error, confirm the signed-in account has question-management permission.</div></div>`}}function render(){const q=$('search').value.trim().toLowerCase(),st=$('status').value,rs=$('reason').value;const filtered=reports.filter(r=>{const hay=[r.question,r.exam,r.subject,r.userEmail,r.reason,r.uid].join(' ').toLowerCase();return(!q||hay.includes(q))&&(st==='all'||(r.status||'new')===st)&&(rs==='all'||r.reason===rs)});$('count').textContent=`${reports.filter(r=>(r.status||'new')==='new').length} new`;if(!filtered.length){$('list').innerHTML='<div class="empty">No question reports match the current filters.</div>';return}$('list').innerHTML=filtered.map(r=>{const o=r.options||{};const status=r.status||'new';return`<article class="card"><div class="report-head"><div class="meta"><span class="pill ${status==='new'?'new':'resolved'}">${esc(status)}</span><span class="pill">${esc(r.exam||'Unknown exam')}${r.subject?' · '+esc(r.subject):''}</span><span class="pill">${esc(r.page||'')}</span><span class="pill">${esc(r.userEmail||r.uid||'')}</span></div><div class="subtle">${date(r.reportedAt)}</div></div><div class="reason">${esc(r.reason||'Reported issue')}</div><div class="question">${esc(r.question||'Question unavailable')}</div><div class="opts"><div class="opt"><b>A.</b> ${esc(o.A)}</div><div class="opt"><b>B.</b> ${esc(o.B)}</div><div class="opt"><b>C.</b> ${esc(o.C)}</div><div class="opt"><b>D.</b> ${esc(o.D)}</div></div><div class="actions">${status==='new'?`<button class="resolve" data-resolve="${esc(r.id)}">✓ Mark resolved</button>`:''}<button data-copy="${esc(r.question||'')}">Copy question</button></div></article>`}).join('');document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await updateDoc(doc(db,'questionReports',b.dataset.resolve),{status:'resolved',resolvedAt:new Date()});const r=reports.find(x=>x.id===b.dataset.resolve);if(r)r.status='resolved';render()}catch(e){console.error(e);b.disabled=false;alert('Could not update this report. Please try again.')}});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy question',1200)}catch{}})}['search','status','reason'].forEach(id=>$(id).addEventListener('input',render));$('refresh').onclick=load;onAuthStateChanged(auth,u=>{if(!u||!isSuperAdmin(u)){location.replace('admin.html');return}load()});</script></body></html>
