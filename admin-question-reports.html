<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="canonical" href="https://truerevise.com/admin-question-reports.html">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#080b12;--panel:#111722;--line:#273244;--text:#f5f7fb;--muted:#9aa5b5;--blue:#4f7cff;--amber:#fbbf24;--green:#35d69a;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.top{position:sticky;top:0;z-index:10;background:#0a111d;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.back{color:#b7c7ff;text-decoration:none;font-size:13px;font-weight:800}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:20px 0}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted)}.count{background:#3a2c0b;border:1px solid #735a16;color:#ffd86b;border-radius:999px;padding:9px 13px;font-weight:900}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{background:#121a26;color:#fff;border:1px solid #354257;border-radius:10px;padding:10px 12px;min-height:42px}.filters input{flex:1;min-width:220px}.card{background:linear-gradient(145deg,#111722,#0e141e);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#aeb8c8;font-size:11px;margin-bottom:10px}.pill{padding:4px 8px;border-radius:999px;background:#1d2635}.pill.new{background:#3a2c0b;color:#ffd86b}.pill.resolved{background:#123b2e;color:#75edbd}.question{font-weight:800;line-height:1.55;margin-bottom:11px}.reason{color:#ffd86b;font-size:13px;font-weight:900;margin-bottom:10px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;color:#c8d1df;font-size:12px}.opt{background:#171f2c;border:1px solid #2b3748;padding:8px;border-radius:8px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{border:1px solid #48566b;background:#222c3a;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.actions .resolve{background:#174b3b;border-color:#2f8f6d}.empty{text-align:center;color:var(--muted);padding:45px 15px}.error{color:#ffb4bd}@media(max-width:620px){.hero{align-items:flex-start;flex-direction:column}.opts{grid-template-columns:1fr}.hero h1{font-size:23px}}
</style></head><body><header class="top"><div class="brand">True Revise · Admin</div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a></header><main class="wrap"><section class="hero"><div><h1>🚩 Question Reports</h1><p>Review questions reported by students and track corrections.</p></div><div id="count" class="count">0 new</div></section><div class="filters"><input id="search" placeholder="Search question, exam, subject or user…"><select id="status"><option value="all">All statuses</option><option value="new">New</option><option value="resolved">Resolved</option></select><select id="reason"><option value="all">All reasons</option><option>No correct answer</option><option>Question wording/frame is wrong</option><option>Wrong or missing option</option><option>Other issue</option></select></div><div id="list"></div></main><script type="module">import{auth,db}from'./firebase-config.js';import{collection,getDocs,doc,updateDoc}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';const $=id=>document.getElementById(id);let reports=[];function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}function date(v){if(!v)return'—';try{const d=v.toDate?v.toDate():new Date(v);return d.toLocaleString()}catch{return'—'}}async function load(){try{const s=await getDocs(collection(db,'questionReports'));reports=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const aa=a.reportedAt?.seconds||0,bb=b.reportedAt?.seconds||0;return bb-aa});render()}catch(e){$('list').innerHTML=`<div class="card error">Unable to load reports. Check that your Firebase rules allow admins to read <b>questionReports</b>.<br><small>${esc(e.message)}</small></div>`}}function render(){const q=$('search').value.trim().toLowerCase(),st=$('status').value,rs=$('reason').value;const filtered=reports.filter(r=>{const hay=[r.question,r.exam,r.subject,r.userEmail,r.reason].join(' ').toLowerCase();return(!q||hay.includes(q))&&(st==='all'||r.status===st)&&(rs==='all'||r.reason===rs)});$('count').textContent=`${reports.filter(r=>r.status==='new').length} new`;if(!filtered.length){$('list').innerHTML='<div class="card empty">No question reports match the current filters.</div>';return}$('list').innerHTML=filtered.map(r=>{const o=r.options||{};return`<article class="card"><div class="meta"><span class="pill ${r.status==='new'?'new':'resolved'}">${esc(r.status||'new')}</span><span class="pill">${esc(r.page||'')}</span><span class="pill">${esc(r.exam||'')}${r.subject?' · '+esc(r.subject):''}</span><span class="pill">${esc(r.userEmail||r.uid||'')}</span><span class="pill">${date(r.reportedAt)}</span></div><div class="reason">${esc(r.reason||'Reported issue')}</div><div class="question">${esc(r.question||'Question unavailable')}</div><div class="opts"><div class="opt">A. ${esc(o.A)}</div><div class="opt">B. ${esc(o.B)}</div><div class="opt">C. ${esc(o.C)}</div><div class="opt">D. ${esc(o.D)}</div></div><div class="actions">${r.status==='new'?`<button class="resolve" data-id="${esc(r.id)}">✓ Mark resolved</button>`:''}<button data-copy="${esc(r.question||'')}">Copy question</button></div></article>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{b.disabled=true;await updateDoc(doc(db,'questionReports',b.dataset.id),{status:'resolved',resolvedAt:new Date()});const r=reports.find(x=>x.id===b.dataset.id);if(r)r.status='resolved';render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy question',1200)}catch{}})}['search','status','reason'].forEach(id=>$(id).addEventListener('input',render));onAuthStateChanged(auth,u=>{if(!u){$('list').innerHTML='<div class="card error">Admin sign-in required.</div>';return}load()});</script></body></html>
